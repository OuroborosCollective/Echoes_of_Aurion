name: Aurion LIVE Godot Visual Parity (fails without matching live views)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-vps-live-audit:
    runs-on: [self-hosted, linux]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fail closed unless comparing the exact released main checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Capture actual VPS Godot desktop and compare independent live gameplay views
        shell: bash
        env:
          DISPLAY: ":99"
        run: |
          set -euo pipefail
          auth="$(find /tmp -maxdepth 2 -path '/tmp/xvfb-run.*/Xauthority' -type f -readable -print -quit 2>/dev/null || :)"
          if [[ -n "$auth" ]]; then export XAUTHORITY="$auth"; fi
          python3 scripts/godot/live_visual_parity.py --capture-desktop --output "$RUNNER_TEMP/aurion-live-visual-parity"
      - name: Upload original screenshots and fail-closed diagnosis even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurion-LIVE-parity-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/aurion-live-visual-parity/
          retention-days: 7
          if-no-files-found: warn
