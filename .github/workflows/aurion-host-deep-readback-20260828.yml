name: Aurion host deep readback 2026-08-28

on:
  push:
    branches:
      - aurion/migration-truth-snapshot-20260828

permissions:
  contents: read

env:
  EXPECTED_MAIN_SHA: c0ad8967046c52141cf1b5f69874a0c53117fbe2

jobs:
  host-readback:
    name: Deep read-only VPS and production schema readback
    runs-on: [self-hosted, Linux, X64, aurion-static]
    timeout-minutes: 15
    steps:
      - name: Guard and host permissions inventory
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "OuroborosCollective/Echoes_of_Aurion"
          printf 'host=%s\n' "$(hostname)"
          printf 'identity=%s\n' "$(id)"
          for p in /opt/echoes-of-aurion /opt/echoes-of-aurion/.env.production /var/www/echoes-of-aurion /opt/aurion-zone-runtime; do
            if [[ -e "$p" ]]; then
              stat -c 'path=%n owner=%U group=%G mode=%a type=%F' "$p"
            fi
          done
          echo 'aurion_sbin_begin'
          find /usr/local/sbin -maxdepth 1 -type f -iname '*aurion*' -printf '%f\n' 2>/dev/null | sort || true
          echo 'aurion_sbin_end'
          echo 'sudo_policy_begin'
          sudo -n -l 2>&1 | sed -E 's/(password|passwd|token|secret|key)=?[^ ,]*/\1=[REDACTED]/Ig' | head -n 120 || true
          echo 'sudo_policy_end'

      - name: Read current arelogic.space routing contract
        shell: bash
        run: |
          set -euo pipefail
          site=/etc/nginx/sites-enabled/arelogic.space
          if [[ -r "$site" ]]; then
            echo 'arelogic_nginx_begin'
            sed -n '1,140p' "$site" \
              | sed -E 's#(proxy_set_header[[:space:]]+Authorization[[:space:]]+).*#\1[REDACTED];#'
            echo 'arelogic_nginx_end'
          else
            echo 'arelogic_nginx=unreadable'
          fi
          for snippet in /etc/nginx/snippets/arelogic-zone-runtime.conf /etc/nginx/conf.d/zz-aurion-zone-runtime-rate-limit.conf; do
            if [[ -r "$snippet" ]]; then
              printf 'nginx_snippet_begin=%s\n' "$snippet"
              cat "$snippet"
              printf 'nginx_snippet_end=%s\n' "$snippet"
            fi
          done

      - name: Probe known local Aurion lanes
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local port="$1" path="$2" accept="$3"
            local hdr body code ctype hash
            hdr="$(mktemp)"; body="$(mktemp)"
            code="$(curl --max-time 5 --silent --show-error --header "Accept: ${accept}" --dump-header "$hdr" --output "$body" --write-out '%{http_code}' "http://127.0.0.1:${port}${path}" 2>/dev/null || true)"
            if [[ -z "$code" || "$code" == 000 ]]; then
              printf 'local_lane port=%s path=%s status=unreachable\n' "$port" "$path"
            else
              ctype="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); print $2; exit}' "$hdr")"
              hash="$(sha256sum "$body" | awk '{print $1}')"
              printf 'local_lane port=%s path=%s status=%s content_type=%s bytes=%s body_sha256=%s\n' "$port" "$path" "$code" "${ctype:-unknown}" "$(wc -c < "$body")" "$hash"
              if [[ "${ctype:-}" == application/json* ]]; then
                printf 'local_json port=%s path=%s body=' "$port" "$path"
                head -c 800 "$body"
                printf '\n'
              fi
            fi
            rm -f "$hdr" "$body"
          }
          probe 3100 /_runtime/healthz application/json
          probe 8090 /mcp application/json
          probe 8090 /mcp text/event-stream
          probe 3000 / application/json
          probe 3000 /healthz application/json

      - name: Check out exact verified source for DB client only
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN_SHA }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Read production database schema and migration journal
        shell: bash
        run: |
          set -euo pipefail
          envfile=/opt/echoes-of-aurion/.env.production
          if [[ ! -r "$envfile" ]]; then
            echo 'production_db_readback=env_unreadable'
            exit 0
          fi
          DOTENV_CONFIG_PATH="$envfile" node --import dotenv/config --input-type=module <<'NODE'
          import mysql from "mysql2/promise";
          const url = process.env.DATABASE_URL;
          if (!url) {
            console.log(JSON.stringify({ productionDbReadback: false, reason: "DATABASE_URL_missing" }));
            process.exit(0);
          }
          const connection = await mysql.createConnection(url);
          const wanted = [
            "progressionLedger",
            "aurionGlobalWorldStates",
            "aurionGlobalWorldEpochReceipts",
            "aurionWorldChunkDeltas",
            "aurionWorldPresenceLeases",
            "aurionWorldEpochRequests",
            "aurionWorldEpochReactions",
            "aurionLootDropReceiptsV2",
            "aurionItemInstancesV2",
            "aurionMasteryEvents",
            "aurionEthosEvents",
            "aurionFactionQuestlineStates",
            "aurionFactionQuestlineOathReceipts",
            "aurionFactionQuestlineDecisionReceipts",
            "aurionFactionQuestlineRewardReceipts"
          ];
          const placeholders = wanted.map(() => "?").join(",");
          const [tables] = await connection.query(
            `SELECT TABLE_NAME FROM information_schema.tables WHERE table_schema=DATABASE() AND TABLE_NAME IN (${placeholders}) ORDER BY TABLE_NAME`,
            wanted,
          );
          const present = tables.map(row => row.TABLE_NAME);
          const missing = wanted.filter(name => !present.includes(name));
          const [journalTables] = await connection.query(
            `SELECT TABLE_NAME FROM information_schema.tables WHERE table_schema=DATABASE() AND TABLE_NAME LIKE '%drizzle%migration%' ORDER BY TABLE_NAME`,
          );
          const journalNames = journalTables.map(row => row.TABLE_NAME);
          const journals = {};
          for (const name of journalNames) {
            if (!/^[A-Za-z0-9_]+$/.test(name)) continue;
            const [rows] = await connection.query(`SELECT * FROM \`${name}\` ORDER BY 1`);
            journals[name] = rows.map(row => {
              const safe = {};
              for (const [key, value] of Object.entries(row)) {
                safe[key] = Buffer.isBuffer(value) ? value.toString("hex") : value instanceof Date ? value.toISOString() : value;
              }
              return safe;
            });
          }
          console.log(JSON.stringify({ productionDbReadback: true, presentTables: present, missingTables: missing, migrationJournals: journals }));
          if (present.includes("aurionFactionQuestlineRewardReceipts")) {
            const [cols] = await connection.query(
              `SELECT COLUMN_NAME,COLUMN_TYPE,IS_NULLABLE,COLUMN_KEY FROM information_schema.columns WHERE table_schema=DATABASE() AND TABLE_NAME='aurionFactionQuestlineRewardReceipts' ORDER BY ORDINAL_POSITION`,
            );
            console.log(JSON.stringify({ rewardReceiptColumns: cols }));
          }
          await connection.end();
          NODE
