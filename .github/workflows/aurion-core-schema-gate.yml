name: Aurion core schema and native auth safety gate
on:
  pull_request:
    paths:
      - 'server/**'
      - 'shared/**'
      - 'drizzle/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/aurion-core-schema-gate.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'shared/**'
      - 'drizzle/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/aurion-core-schema-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-auth-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.4.13
        env:
          MARIADB_ROOT_PASSWORD: aurion-disposable-classless-test
          MARIADB_DATABASE: aurion_classless_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -paurion-disposable-classless-test --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      DATABASE_URL: mysql://root:aurion-disposable-classless-test@127.0.0.1:3306/aurion_classless_test
      AURION_CLASSLESS_E2E: "1"
      AURION_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      JWT_SECRET: aurion-disposable-local-pack-signing-key-never-production
      VITE_APP_ID: aurion-core-schema-isolated-regression
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Verify exact head and install frozen dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$AURION_RELEASE_SHA"
          pnpm install --frozen-lockfile
      - name: Verify pack guardrails and GitHub workflow routing
        run: node --test scripts/godot/offline-linux-pack.test.mjs scripts/ci/offline-workflow-mode.test.mjs scripts/ci/workflow-impact.test.mjs
      - name: Verify native-auth production-wave safety
        run: node --test scripts/native-auth-0075-wave-preflight.test.mjs
      - name: Validate migration ledger and authorized schema dispatch contract
        run: |
          set -euo pipefail
          pnpm verify:migrations
          node --test scripts/dispatch-aurion-schema-plan.test.mjs
      - name: Apply canonical migrations to disposable MariaDB
        run: pnpm exec drizzle-kit migrate
      - name: Verify native auth on actual isolated MariaDB
        env:
          AURION_NATIVE_AUTH_E2E: "1"
        run: |
          set -euo pipefail
          node scripts/prepare-native-auth-test-schema.mjs
          pnpm exec vitest run server/nativeAuthProtocol.test.ts server/nativeAuthStateSeal.test.ts server/nativeAuthPersistenceMariaDb.test.ts server/nativeAuthBrowserMariaDb.test.ts server/nativeAuthSchemaIsolation.test.ts --reporter=verbose
      - name: Verify native auth HTTP/session boundary
        run: pnpm exec vitest run server/nativeAuthHttp.test.ts server/_core/sdkNativeAuth.test.ts server/nativeAuthPersistenceUnavailable.test.ts --reporter=verbose
