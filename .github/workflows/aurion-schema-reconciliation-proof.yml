      - name: Apply 0063 NPC information ecology migration separately
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import mysql from "mysql2/promise";
          const sql=fs.readFileSync("drizzle/0064_aurion_world_entity_foundation.sql","utf8");
          const statements=sql.split(/\s*-->\s*statement-breakpoint\s*/).map(s=>s.trim()).filter(Boolean);
