permissions:
  contents: read

jobs:
  reconciliation-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: auriontest
          MARIADB_DATABASE: aurion_reconciliation_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -pauriontest --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:auriontest@127.0.0.1:3306/aurion_reconciliation_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and reconciliation unit tests
        run: |
          set -euo pipefail
          pnpm check
          pnpm vitest run server/aurionProductionSchemaReconciliation.test.ts
          git diff --check
      - name: Establish canonical database through journaled 0020 only
        run: |
          set -euo pipefail
          backup="$(mktemp)"
          cp drizzle/meta/_journal.json "$backup"
          restore_journal() { cp "$backup" drizzle/meta/_journal.json; rm -f "$backup"; }
          trap restore_journal EXIT
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path="drizzle/meta/_journal.json";
          const journal=JSON.parse(fs.readFileSync(path,"utf8"));
          const cutoff=journal.entries.filter(entry=>Number(entry.idx)<=20);
          if(cutoff.length!==21 || cutoff.at(-1)?.tag!=="0020_wasd_aurion_dialogue_quest_intents") throw new Error("unable to construct exact 0020 journal cutoff");
          journal.entries=cutoff;
          fs.writeFileSync(path, `${JSON.stringify(journal,null,2)}\n`);
          NODE
          pnpm exec drizzle-kit migrate
          restore_journal
          trap - EXIT
          git diff --exit-code -- drizzle/meta/_journal.json
      - name: Prove all declared late migrations classify absent on a 0020-only database
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/reconcile-aurion-production-schema.ts > absent.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const receipt=JSON.parse(fs.readFileSync("absent.json","utf8"));
          if(receipt.overallState!=="RECONCILIATION_REQUIRED") throw new Error(`unexpected overall state ${receipt.overallState}`);
          if(receipt.summary.absentCount!==JSON.parse(fs.readFileSync("config/aurion-migration-wave-manifest.json","utf8")).migrations.length || receipt.summary.matchCount!==0 || receipt.summary.driftCount!==0) throw new Error("late-migration absence classification mismatch");
          for(const migration of receipt.migrations) if(migration.state!=="ABSENT_APPLY_REQUIRED") throw new Error(`${migration.tag} was not absent`);
          console.log(JSON.stringify({phase:"0020-only",summary:receipt.summary,states:receipt.migrations.map(m=>[m.tag,m.state])}));
          NODE
      - name: Apply 0021 through 0050 inside this isolated proof database
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import mysql from "mysql2/promise";
          const tags=[
            "0021_aurion_global_world_state","0022_aurion_world_chunk_deltas","0023_aurion_world_presence_epochs","0024_aurion_world_epoch_reactions","0025_aurion_loot_mastery_ethos","0026_aurion_faction_questline_state","0027_aurion_faction_questline_rewards","0028_aurion_world_checkpoint", "0029_aurion_guild_kingdom_authority", "0030_aurion_guild_bank_economy", "0031_aurion_profession_crafting_persistence", "0032_aurion_group_instances", "0033_aurion_ax1_ui_controls", "0034_ax1_starter_equipment_receipts",
            "0035_aurion_npc_memory_quest_offers", "0036_aurion_faction_warfront_receipts", "0037_aurion_trade_crafting_receipts", "0038_aurion_world_chunk_delta_conflicts", "0039_aurion_world_epoch_materializations", "0040_aurion_progression_receipts", "0041_aurion_content_hash_ledger", "0042_aurion_npc_multi_memory", "0043_aurion_civilization_history", "0044_aurion_semantic_memory_graph", "0045_aurion_deterministic_quest_compiler", "0046_aurion_semantic_node_history_key",
            "0047_aurion_world_context_capsules",
            "0048_aurion_causal_evidence",
            "0049_aurion_causal_receipt_v2",
            "0050_aurion_human_ai_authoring",
          ];
          const connection=await mysql.createConnection(process.env.DATABASE_URL);
          try {
            for(const tag of tags){
              const sql=fs.readFileSync(`drizzle/${tag}.sql`,"utf8");
              const statements=sql.split(/\s*-->\s*statement-breakpoint\s*/).map(s=>s.trim()).filter(Boolean);
              for(const statement of statements) await connection.query(statement);
            }
          } finally { await connection.end(); }
          console.log(JSON.stringify({phase:"pre-0051-compatibility",appliedTags:tags}));
          NODE
      - name: Prove new runtime is compatible with canonical 0050 schema
        env:
          NODE_ENV: test
          AURION_CROSS_ZONE_LEGACY_E2E: "1"
        run: |
          set -euo pipefail
          pnpm exec vitest run server/causality/crossZoneLegacyCompatibilityMariaDb.test.ts

      - name: Apply 0051 cross-zone handover migration separately
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import mysql from "mysql2/promise";
          const sql=fs.readFileSync("drizzle/0051_aurion_cross_zone_handover_v2.sql","utf8");
          const statements=sql.split(/\s*-->\s*statement-breakpoint\s*/).map(s=>s.trim()).filter(Boolean);
          const connection=await mysql.createConnection(process.env.DATABASE_URL);
          try {
            for(const statement of statements) await connection.query(statement);
          } finally { await connection.end(); }
          console.log(JSON.stringify({phase:"0051-applied",statementCount:statements.length}));
          NODE

      - name: Prove Step 24 runtime remains compatible before 0052
        env:
          NODE_ENV: test
          AURION_EFFECT_LEGACY_E2E: "1"
          AURION_RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pnpm exec vitest run server/effects/aurionEffectLegacyCompatibilityMariaDb.test.ts

      - name: Apply 0052 effect intent journal migration separately
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import mysql from "mysql2/promise";
          const sql=fs.readFileSync("drizzle/0052_aurion_effect_intent_journal.sql","utf8");
          const statements=sql.split(/\s*-->\s*statement-breakpoint\s*/).map(s=>s.trim()).filter(Boolean);
          const connection=await mysql.createConnection(process.env.DATABASE_URL);
          try {
            for(const statement of statements) await connection.query(statement);
          } finally { await connection.end(); }
          console.log(JSON.stringify({phase:"0052-applied",statementCount:statements.length}));
          NODE

      - name: Apply 0053 NPC action gateway migration separately
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
