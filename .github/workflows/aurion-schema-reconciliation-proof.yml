          console.log(JSON.stringify({phase:"0063-applied",statementCount:statements.length}));
          NODE

      - name: Prove all declared late migrations match after isolated apply
        run: |
          set -euo pipefail
          set +e
          pnpm exec tsx scripts/reconcile-aurion-production-schema.ts --require-match > matched.json
          status=$?
          set -e
          cat matched.json
          test "$status" -eq 0
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const receipt=JSON.parse(fs.readFileSync("matched.json","utf8"));
          if(receipt.overallState!=="PRESENT_SCHEMA_MATCH") throw new Error(`unexpected overall state ${receipt.overallState}`);
          if(receipt.summary.matchCount!==JSON.parse(fs.readFileSync("config/aurion-migration-wave-manifest.json","utf8")).migrations.length || receipt.summary.absentCount!==0 || receipt.summary.driftCount!==0) throw new Error("late-migration match classification mismatch");
          console.log(JSON.stringify({phase:"full-match",summary:receipt.summary,drizzleJournal:receipt.drizzleJournal}));
          NODE
      - name: Prove structural drift fails closed
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import mysql from "mysql2/promise";
          const connection=await mysql.createConnection(process.env.DATABASE_URL);
          try {
            await connection.query("DROP INDEX `aurionFactionQuestlineRewardReceipts_digest_uq` ON `aurionFactionQuestlineRewardReceipts`");
            await connection.query("DROP TRIGGER `aurionContentHashLedger_no_update`");
          } finally { await connection.end(); }
          NODE
          set +e
          pnpm exec tsx scripts/reconcile-aurion-production-schema.ts --require-match > drift.json
          status=$?
          set -e
          cat drift.json
          test "$status" -eq 3
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const receipt=JSON.parse(fs.readFileSync("drift.json","utf8"));
          if(receipt.overallState!=="PRESENT_SCHEMA_DRIFT") throw new Error(`unexpected overall state ${receipt.overallState}`);
          const reward=receipt.migrations.find(m=>m.tag==="0027_aurion_faction_questline_rewards");
          if(!reward || reward.state!=="PRESENT_SCHEMA_DRIFT" || !reward.drift.some(v=>v.includes("missing_index:aurionFactionQuestlineRewardReceipts_digest_uq"))) throw new Error("expected digest-index drift was not detected");
          const ledger=receipt.migrations.find(m=>m.tag==="0041_aurion_content_hash_ledger");
          if(ledger?.state!=="PRESENT_SCHEMA_DRIFT"||!ledger.drift.includes("aurionContentHashLedger:missing_trigger:aurionContentHashLedger_no_update")) throw new Error("missing append-only trigger was not detected");
          console.log(JSON.stringify({phase:"intentional-drift",index:reward.drift,trigger:ledger.drift}));
          NODE
