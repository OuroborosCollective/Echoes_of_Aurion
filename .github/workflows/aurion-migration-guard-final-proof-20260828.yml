name: Aurion migration guard final proof 2026-08-28

on:
  push:
    branches:
      - fix/aurion-migration-chain-guard-20260828

permissions:
  contents: read

concurrency:
  group: aurion-migration-guard-final-proof-20260828
  cancel-in-progress: false

env:
  EXPECTED_FIX_SHA: e9381653d9f88daaadb7932f8c5dde21b15d9099

jobs:
  prove-exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Guard trigger scope
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "OuroborosCollective/Echoes_of_Aurion"
          test "${GITHUB_REF_NAME}" = "fix/aurion-migration-chain-guard-20260828"

      - name: Check out exact cleaned fix head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_FIX_SHA }}
          fetch-depth: 0

      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_FIX_SHA}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Full TypeScript and regression suite
        run: |
          set -euo pipefail
          pnpm check
          pnpm test
          git diff --check

      - name: Prove migration guard rejects exactly the known journal cutoff
        run: |
          set -euo pipefail
          set +e
          pnpm verify:migrations > guard.txt 2>&1
          status=$?
          set -e
          cat guard.txt
          test "$status" -ne 0
          grep -Fq '"sqlCount": 28' guard.txt
          grep -Fq '"journalCount": 21' guard.txt
          for tag in \
            0021_aurion_global_world_state \
            0022_aurion_world_chunk_deltas \
            0023_aurion_world_presence_epochs \
            0024_aurion_world_epoch_reactions \
            0025_aurion_loot_mastery_ethos \
            0026_aurion_faction_questline_state \
            0027_aurion_faction_questline_rewards
          do
            grep -Fq "$tag" guard.txt
          done
          grep -Fq '"missingSqlTags": []' guard.txt
          grep -Fq '"duplicateNumericPrefixes": []' guard.txt
          grep -Fq '"duplicateJournalTags": []' guard.txt
          grep -Fq '"journalIndicesSequential": true' guard.txt

      - name: Build revision-bound runtime artifact to catch packaging regressions
        env:
          AURION_RELEASE_SHA: ${{ env.EXPECTED_FIX_SHA }}
        run: |
          set -euo pipefail
          pnpm build:runtime-artifact
          node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("dist/.aurion-runtime-build.json","utf8")); if(m.revision!==process.env.AURION_RELEASE_SHA) process.exit(1); console.log(JSON.stringify({revision:m.revision, manifest:true}))'
