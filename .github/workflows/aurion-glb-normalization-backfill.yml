name: Aurion GLB Normalization Backfill

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Audit first; apply performs the deterministic data repair."
        required: true
        type: choice
        options:
          - audit
          - apply
      expected_missing_count:
        description: "Exact number of approved local GLBs expected to lack normalization."
        required: true
        default: "86"
        type: string

permissions:
  contents: read

concurrency:
  group: aurion-glb-normalization-backfill
  cancel-in-progress: false

jobs:
  repair:
    name: Bound production GLB normalization repair
    runs-on: [self-hosted, Linux, X64, aurion-static]
    environment: production
    timeout-minutes: 45
    env:
      EXPECTED_MISSING_COUNT: ${{ inputs.expected_missing_count }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: Check out exact main revision
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Prove branch and source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -n "${EXPECTED_MISSING_COUNT}"
          [[ "${EXPECTED_MISSING_COUNT}" =~ ^(0|[1-9][0-9]*)$ ]]

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build deterministic backfill utility bundle
        run: |
          set -euo pipefail
          npm exec --yes --package=esbuild@0.25.0 -- esbuild scripts/backfill-glb-normalization.ts \
            --bundle \
            --packages=external \
            --platform=node \
            --format=esm \
            --outfile=/tmp/aurion-glb-normalization-backfill.mjs
          sha256sum /tmp/aurion-glb-normalization-backfill.mjs

      - name: Verify the running production container and persistent GLB volume
        run: |
          set -euo pipefail
          test "$(sudo -n /usr/local/sbin/aurion-glb-normalization-backfill inspect-running)" = "true"
          test "$(sudo -n /usr/local/sbin/aurion-glb-normalization-backfill inspect-revision)" = "${GITHUB_SHA}"
          sudo -n /usr/local/sbin/aurion-glb-normalization-backfill inspect-storage-env \
            | grep -Fxq 'AURION_GLB_STORAGE_DIR=/var/lib/aurion/glb'
          sudo -n /usr/local/sbin/aurion-glb-normalization-backfill inspect-volume \
            | grep -Fxq 'echoes-of-aurion-glb-assets:/var/lib/aurion/glb'
          test "$(sudo -n /usr/local/sbin/aurion-glb-normalization-backfill inspect-release-sha)" = "${GITHUB_SHA}"

      - name: Copy utility into the exact production container
        run: cat /tmp/aurion-glb-normalization-backfill.mjs | sudo -n /usr/local/sbin/aurion-glb-normalization-backfill copy-utility

      - name: Read-only audit of the exact missing set
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/aurion-glb-normalization-backfill run audit "${EXPECTED_MISSING_COUNT}" \
            | tee glb-normalization-audit.json
          node --input-type=module -e '
            import fs from "node:fs";
            const r=JSON.parse(fs.readFileSync("glb-normalization-audit.json","utf8"));
            if(r.mode!=="audit"||r.operation.updated!==0||r.operation.scanned!==Number(process.env.EXPECTED_MISSING_COUNT)) process.exit(2);
            if(r.approvedLocal!==86||r.physicalCatalogEligible!==0) process.exit(3);
          '
        env:
          EXPECTED_MISSING_COUNT: ${{ inputs.expected_missing_count }}

      - name: Apply only when explicitly requested
        if: ${{ inputs.mode == 'apply' }}
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/aurion-glb-normalization-backfill run apply "${EXPECTED_MISSING_COUNT}" \
            | tee glb-normalization-apply.json

      - name: Final production readback
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ inputs.mode }}" = "apply" ]; then
            sudo -n /usr/local/sbin/aurion-glb-normalization-backfill run readback 0 \
              | tee glb-normalization-readback.json
            curl --fail --silent --show-error https://arelogic.space/api/game/glb-catalog > glb-public-catalog.json
            EXPECTED_PHYSICAL="${EXPECTED_MISSING_COUNT}" node --input-type=module -e '
              import fs from "node:fs";
              const r=JSON.parse(fs.readFileSync("glb-normalization-readback.json","utf8"));
              if(r.mode!=="readback"||r.operation.scanned!==0||r.physicalCatalogEligible!==r.approvedLocal||r.approvedLocal!==Number(process.env.EXPECTED_PHYSICAL)||r.logicalCatalogEntries<1) process.exit(2);
              const publicCatalog=JSON.parse(fs.readFileSync("glb-public-catalog.json","utf8"));
              if(publicCatalog?.version!=="aurion.glb-import.v1"||!Array.isArray(publicCatalog?.entries)||publicCatalog.entries.length<1) process.exit(3);
            '
          else
            cp glb-normalization-audit.json glb-normalization-readback.json
          fi

      - name: Remove temporary utility from production container
        if: always()
        run: sudo -n /usr/local/sbin/aurion-glb-normalization-backfill cleanup || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aurion-glb-normalization-${{ github.run_id }}
          path: |
            glb-normalization-audit.json
            glb-normalization-apply.json
            glb-normalization-readback.json
            glb-public-catalog.json
          if-no-files-found: warn
          retention-days: 30
