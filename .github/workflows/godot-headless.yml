name: Godot headless contract
on:
  pull_request:
    paths:
      - 'scripts/godot/**'
      - 'config/godot-toolchain.lock.json'
      - 'godot-client/**'
      - '.github/workflows/godot-headless.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bootstrap regression
        run: node --test scripts/godot/toolchain.test.mjs
      - name: Install and verify editor
        run: |
          node scripts/godot/bootstrap.mjs
          node scripts/godot/doctor.mjs
          node scripts/godot/bootstrap.mjs
      - name: Real GDScript contract and TS parity
        run: |
          .aurion-godot/editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot-client --script tests/contracts/test_zone_contract.gd
          node scripts/godot/verify-contract-parity.mjs
