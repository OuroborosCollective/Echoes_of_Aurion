name: Aurion migration chain proof 2026-08-28

on:
  push:
    branches:
      - fix/aurion-migration-chain-truth-20260828

permissions:
  contents: read

jobs:
  migration-chain-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: auriontest
          MARIADB_DATABASE: aurion_chain_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -proot --silent || mariadb-admin ping -h 127.0.0.1 -pauriontest --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:auriontest@127.0.0.1:3306/aurion_chain_test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and guard regression
        run: |
          set -euo pipefail
          pnpm check
          pnpm vitest run scripts/drizzleMigrationChain.test.ts
          git diff --check

      - name: Prove current repository chain fails closed on 0021 through 0027
        run: |
          set -euo pipefail
          set +e
          pnpm verify:migrations > migration-chain-report.txt 2>&1
          status=$?
          set -e
          cat migration-chain-report.txt
          test "$status" -ne 0
          for tag in \
            0021_aurion_global_world_state \
            0022_aurion_world_chunk_deltas \
            0023_aurion_world_presence_epochs \
            0024_aurion_world_epoch_reactions \
            0025_aurion_loot_mastery_ethos \
            0026_aurion_faction_questline_state \
            0027_aurion_faction_questline_rewards
          do
            grep -Fq "$tag" migration-chain-report.txt
          done

      - name: Execute the unmodified Drizzle journal on a fresh isolated MariaDB
        run: |
          set -euo pipefail
          pnpm exec drizzle-kit migrate

      - name: Read back the exact fresh-database cutoff
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import mysql from "mysql2/promise";
          const db = await mysql.createConnection(process.env.DATABASE_URL);
          const [tables] = await db.query("SELECT TABLE_NAME FROM information_schema.tables WHERE table_schema=DATABASE() ORDER BY TABLE_NAME");
          const names = tables.map(row => row.TABLE_NAME);
          const mustExist = ["aurionDialogueCommandReceipts"];
          const lateTables = [
            "aurionGlobalWorldStates",
            "aurionWorldChunkDeltas",
            "aurionWorldPresenceLeases",
            "aurionWorldEpochReactions",
            "aurionLootDropReceiptsV2",
            "aurionFactionQuestlineStates",
            "aurionFactionQuestlineRewardReceipts",
          ];
          for (const name of mustExist) {
            if (!names.includes(name)) throw new Error(`Expected journaled migration table missing: ${name}`);
          }
          const unexpectedlyPresent = lateTables.filter(name => names.includes(name));
          console.log(JSON.stringify({ tableCount: names.length, journaled0020Present: true, unexpectedlyPresentLateTables: unexpectedlyPresent }));
          if (unexpectedlyPresent.length) throw new Error(`Unjournaled late tables were unexpectedly created: ${unexpectedlyPresent.join(",")}`);
          await db.end();
          NODE
