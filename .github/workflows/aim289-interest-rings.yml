name: AIM-289 Interest Rings and HLOD

on:
  pull_request:
    paths:
      - ".github/workflows/aim289-interest-rings.yml"
      - "shared/worldChunkInterestProtocol.ts"
      - "shared/worldChunkProjectionProtocol.ts"
      - "shared/worldChunkStreamingProtocol.ts"
      - "server/worldChunkInterestProtocol.test.ts"
      - "server/worldChunkProjectionProtocol.test.ts"
      - "server/worldChunkStreamingProtocol.test.ts"
      - "client/src/xaurion/core/actorLod.ts"
      - "client/src/xaurion/core/actorLod.test.ts"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aim-289-interest-rings-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  interest-rings:
    name: Rings, HLOD policy, cache eviction, actor LOD, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove exact checked-out head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Run interest, projection, streaming and actor LOD regressions
        run: >-
          pnpm exec vitest run
          server/worldChunkInterestProtocol.test.ts
          server/worldChunkProjectionProtocol.test.ts
          server/worldChunkStreamingProtocol.test.ts
          client/src/xaurion/core/actorLod.test.ts

      - name: TypeScript check
        run: pnpm check

      - name: Build production runtime
        run: pnpm build
