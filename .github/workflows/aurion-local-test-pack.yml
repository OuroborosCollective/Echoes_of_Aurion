name: Aurion Local Test Pack

on:
  pull_request:
    paths:
      - "server/**"
      - "client/**"
      - "shared/**"
      - "drizzle/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/aurion-local-test-pack.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - "client/**"
      - "shared/**"
      - "drizzle/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/aurion-local-test-pack.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurion-local-test-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-offline-pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      mariadb:
        image: mariadb:11.4.13
        env:
          MARIADB_ROOT_PASSWORD: aurion-disposable-classless-test
          MARIADB_DATABASE: aurion_classless_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -paurion-disposable-classless-test --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      DATABASE_URL: mysql://root:aurion-disposable-classless-test@127.0.0.1:3306/aurion_classless_test
      AURION_CLASSLESS_E2E: "1"
      AURION_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      JWT_SECRET: aurion-disposable-local-pack-signing-key-never-production
      VITE_APP_ID: aurion-local-pack-isolated-regression
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Guard repository scope
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "${{ github.repository }}"
          case "${GITHUB_EVENT_NAME}" in
            push|workflow_dispatch)
              test "${GITHUB_REF_NAME}" = "main"
              ;;
            pull_request)
              ;;
            *)
              echo "unsupported event: ${GITHUB_EVENT_NAME}" >&2
              exit 1
              ;;
          esac
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install offline pack tooling
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Bind exact source revision
        run: test "$(git rev-parse HEAD)" = "$AURION_RELEASE_SHA"
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify migration chain and apply schema
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .aurion-local-test-pack/evidence
          pnpm verify:migrations | tee .aurion-local-test-pack/evidence/migrations-verify.log
          node --test scripts/dispatch-aurion-schema-plan.test.mjs 2>&1 | tee .aurion-local-test-pack/evidence/schema-dispatch-contract.log
          pnpm exec drizzle-kit migrate 2>&1 | tee .aurion-local-test-pack/evidence/migrations-apply.log
      - name: Verify donor/runtime ownership ledger
        shell: bash
        run: |
          set -euo pipefail
          pnpm verify:donor-ledger 2>&1 | tee .aurion-local-test-pack/evidence/donor-ledger.log
      - name: Verify shared replay verdict semantics
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run \
            server/replayVerdictContract.test.ts \
            server/causality/causalReceiptV2.test.ts \
            server/causality/causalReceiptV2Persistence.test.ts \
            server/causality/causalTick.test.ts \
            server/questCompiler/replay.test.ts \
            server/worldContext/replay.test.ts \
            2>&1 | tee .aurion-local-test-pack/evidence/replay-verdict.log
      - name: Verify Wave 2 Step 22 world causal root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .aurion-local-test-pack/evidence
          env -u DATABASE_URL pnpm exec vitest run server/causality/worldCausalRootService.test.ts 2>&1 | tee .aurion-local-test-pack/evidence/wave2-step22-world-root.log
          env -u DATABASE_URL pnpm exec vitest run server/causality 2>&1 | tee .aurion-local-test-pack/evidence/wave2-step22-causality.log
          env -u DATABASE_URL pnpm exec vitest run server/causality server/replayVerdictContract.test.ts server/questCompiler/replay.test.ts server/worldContext/replay.test.ts 2>&1 | tee .aurion-local-test-pack/evidence/wave2-step22-replay.log
          pnpm exec tsx scripts/read-aurion-world-root.ts --fixture fixtures/causality/aurion-world-root-step22.json 2>&1 | tee .aurion-local-test-pack/evidence/wave2-step22-root-readback.log
          NODE_ENV=test AURION_WORLD_EPOCH_E2E=1 pnpm exec vitest run server/worldEpochReaction.e2e.test.ts 2>&1 | tee .aurion-local-test-pack/evidence/wave2-step22-mariadb-readback.log

      - name: Verify Wave 2 Step 23 cross-zone handover
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .aurion-local-test-pack/evidence
          env -u DATABASE_URL pnpm exec vitest run server/causality/crossZoneSynchronizationService.test.ts 2>&1 | tee .aurion-local-test-pack/evidence/wave2-step23-contract.log
          NODE_ENV=test AURION_CROSS_ZONE_E2E=1 AURION_STEP23_TRANSFER_ID_PATH=.aurion-local-test-pack/evidence/wave2-step23-transfer-id.txt pnpm exec vitest run server/causality/crossZoneHandoverMariaDb.test.ts 2>&1 | tee .aurion-local-test-pack/evidence/wave2-step23-mariadb.log
          transfer_id="$(cat .aurion-local-test-pack/evidence/wave2-step23-transfer-id.txt)"
          pnpm exec tsx scripts/read-aurion-cross-zone-transfer.ts --transfer "$transfer_id" 2>&1 | tee .aurion-local-test-pack/evidence/wave2-step23-transfer-readback.log

      - name: Verify Wave 2 Step 24 effect intent journal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .aurion-local-test-pack/evidence
          env -u DATABASE_URL pnpm exec vitest run server/effects/aurionEffectJournal.test.ts 2>&1 | tee .aurion-local-test-pack/evidence/wave2-step24-contract.log
          NODE_ENV=test AURION_EFFECT_E2E=1 AURION_STEP24_EFFECT_ID_PATH=.aurion-local-test-pack/evidence/wave2-step24-effect-id.txt pnpm exec vitest run server/effects/aurionEffectJournalMariaDb.test.ts 2>&1 | tee .aurion-local-test-pack/evidence/wave2-step24-mariadb.log
          effect_id="$(cat .aurion-local-test-pack/evidence/wave2-step24-effect-id.txt)"
          pnpm exec tsx scripts/read-aurion-effect-intent.ts --effect-id "$effect_id" 2>&1 | tee .aurion-local-test-pack/evidence/wave2-step24-effect-readback.log

      - name: Verify Wave 2 Step 25 headless causal oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .aurion-local-test-pack/evidence
          env -u DATABASE_URL pnpm exec vitest run server/causality/headlessCausalOracle.test.ts 2>&1 | tee .aurion-local-test-pack/evidence/wave2-step25-oracle-contract.log
          NODE_ENV=test AURION_ORACLE_E2E=1 AURION_STEP25_ZONE_ID_PATH=.aurion-local-test-pack/evidence/wave2-step25-zone-id.txt pnpm exec vitest run server/causality/headlessCausalOracleMariaDb.test.ts 2>&1 | tee .aurion-local-test-pack/evidence/wave2-step25-oracle-mariadb.log
          zone_id="$(cat .aurion-local-test-pack/evidence/wave2-step25-zone-id.txt)"
          pnpm exec tsx scripts/oracle-aurion-zone.ts --zone "$zone_id" --from-tick 3 --to-tick 4 2>&1 | tee .aurion-local-test-pack/evidence/wave2-step25-oracle-readback.log

      - name: Verify AIM-298 quest causal closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .aurion-local-test-pack/evidence
          env -u DATABASE_URL pnpm exec vitest run server/questCompiler/causalAnchor.test.ts server/questCompiler/causalClosure.test.ts 2>&1 | tee .aurion-local-test-pack/evidence/aim298-quest-causal-contract.log
          NODE_ENV=test AURION_ENCOUNTER_E2E=1 AURION_QUEST_CAUSAL_E2E=1 pnpm exec vitest run server/questCompiler/causalClosureMariaDb.test.ts 2>&1 | tee .aurion-local-test-pack/evidence/aim298-quest-causal-mariadb.log

      - name: Verify milestone gate evidence contract
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/aurion-milestone-gate-evidence.test.mjs 2>&1 | tee .aurion-local-test-pack/evidence/milestone-evidence-contract.log
      - name: Typecheck and classless regressions
        shell: bash
        run: |
          set -euo pipefail
          pnpm check 2>&1 | tee .aurion-local-test-pack/evidence/typecheck.log
          pnpm exec vitest run \
            server/progressionReceiptPersistence.test.ts \
            server/classlessProgressionMariaDb.test.ts \
            server/aurionClasslessBoundary.test.ts \
            client/src/xaurion/integration/authoritativeHudProjection.test.ts \
            client/src/xaurion/integration/AurionAuthorityHud.test.tsx \
            2>&1 | tee .aurion-local-test-pack/evidence/classless-regression.log
      - name: Run repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          # The real MariaDB classless contracts ran above. The repository-wide pass
          # intentionally clears DB opt-ins so unrelated E2E suites cannot share the
          # disposable classless database or manufacture cross-suite timing/state.
          env -u DATABASE_URL -u AURION_CLASSLESS_E2E pnpm test 2>&1 | tee .aurion-local-test-pack/evidence/full-vitest.log
      - name: Finalize revision-bound repository gate evidence
        shell: bash
        run: |
          set -euo pipefail
          GATE_EVIDENCE_PATH=.aurion-local-test-pack/evidence/gate-b8-repository.json node --input-type=module <<'NODE'
          import fs from "node:fs";
          const sha=process.env.AURION_RELEASE_SHA;
          const externalId=`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const checks=[
            ["migrationChain","PASS","PASS"],
            ["donorRuntimeOwnership","PASS","PASS"],
            ["sharedReplayVerdict","PASS","PASS"],
            ["evidenceContract","PASS","PASS"],
            ["typecheckAndClassless","PASS","PASS"],
            ["fullRepositoryRegression","PASS","PASS"],
          ].map(([name,expected,observed])=>({name,expected,observed,pass:expected===observed}));
          const receipt={
            schemaVersion:"aurion.milestone.gate-evidence.v1",
            gateId:"AURION-M21-B8-EVIDENCE",
            scope:"repository",
            passCriteria:["repository evidence is exact-revision bound","test source and reproducible command are archived","targeted/typecheck/full regression all completed before receipt creation","all constituent checks pass"],
            failCriteria:["missing evidence","stale revision","nonreproducible command","targeted/typecheck/full regression failure","constituent check failure"],
            sourceRevision:sha,
            workflow:".github/workflows/aurion-local-test-pack.yml",
            command:"pnpm verify:migrations && pnpm verify:donor-ledger && node --test scripts/aurion-milestone-gate-evidence.test.mjs && pnpm check && pnpm test",
            testSources:["scripts/aurion-milestone-gate-evidence.mjs","scripts/aurion-milestone-gate-evidence.test.mjs",".github/workflows/aurion-local-test-pack.yml"],
            externalId,
            reproducible:true,
            releaseIdentity:{sourceRevision:sha},
            expected:{migrationChain:"PASS",donorRuntimeOwnership:"PASS",sharedReplayVerdict:"PASS",evidenceContract:"PASS",typecheckAndClassless:"PASS",fullRepositoryRegression:"PASS"},
            observed:{migrationChain:"PASS",donorRuntimeOwnership:"PASS",sharedReplayVerdict:"PASS",evidenceContract:"PASS",typecheckAndClassless:"PASS",fullRepositoryRegression:"PASS"},
            checks,
            status:checks.every(check=>check.pass)?"PASS":"FAIL",
          };
          fs.writeFileSync(process.env.GATE_EVIDENCE_PATH,JSON.stringify(receipt,null,2)+"\n");
          NODE
          node scripts/aurion-milestone-gate-evidence.mjs verify .aurion-local-test-pack/evidence/gate-b8-repository.json --require-pass

      - name: Build schema-only MariaDB working copy and offline dependencies
        shell: bash
        run: |
          set -euo pipefail
          PACK=.aurion-local-test-pack
          DB_CONTAINER="$(docker ps --filter ancestor=mariadb:11.4.13 --format '{{.ID}}' | head -n1)"
          test -n "$DB_CONTAINER"
          docker exec "$DB_CONTAINER" mariadb-dump -uroot -paurion-disposable-classless-test \
            --no-data --routines --triggers aurion_classless_test > "$PACK/schema.sql"
          docker exec "$DB_CONTAINER" mariadb -uroot -paurion-disposable-classless-test -NBe \
            "SELECT TABLE_NAME,COLUMN_NAME,COLUMN_TYPE,IS_NULLABLE,COALESCE(COLUMN_DEFAULT,'<NULL>') FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='aurion_classless_test' ORDER BY TABLE_NAME,ORDINAL_POSITION" \
            > "$PACK/schema-columns.tsv"
          docker exec "$DB_CONTAINER" mariadb -uroot -paurion-disposable-classless-test -NBe "SELECT VERSION()" > "$PACK/mariadb-version.txt"
          git archive HEAD | zstd -T0 -10 -o "$PACK/aurion-source.tar.zst"
          tar --zstd -cf "$PACK/node_modules.tar.zst" node_modules
          docker save mariadb:11.4.13 | zstd -T0 -10 -o "$PACK/mariadb-11.4-image.tar.zst"
          cp scripts/bootstrap-aurion-local-test-pack.sh "$PACK/"
          cp package.json pnpm-lock.yaml "$PACK/"
          (cd "$PACK" && sha256sum schema.sql > schema.sha256)
          LOCK_SHA="$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)"
          SCHEMA_SHA="$(sha256sum "$PACK/schema.sql" | cut -d' ' -f1)"
          IMAGE_ID="$(docker image inspect mariadb:11.4.13 --format '{{.Id}}')"
          MARIADB_VERSION="$(cat "$PACK/mariadb-version.txt")"
          node -e 'const fs=require("fs"); const [sha,lock,schema,image,version]=process.argv.slice(1); fs.writeFileSync(".aurion-local-test-pack/manifest.json", JSON.stringify({recordType:"aurion_local_test_pack.v1",sourceRevision:sha,pnpmLockSha256:lock,schemaSha256:schema,mariaDbImage:"mariadb:11.4.13",mariaDbImageId:image,mariaDbVersion:version,productionDataIncluded:false},null,2)+"\n")' \
            "$AURION_RELEASE_SHA" "$LOCK_SHA" "$SCHEMA_SHA" "$IMAGE_ID" "$MARIADB_VERSION"
          (cd "$PACK" && sha256sum manifest.json aurion-source.tar.zst node_modules.tar.zst mariadb-11.4-image.tar.zst schema-columns.tsv mariadb-version.txt > artifact.sha256)
      - name: Upload exact offline pack
        uses: actions/upload-artifact@v4
        with:
          name: aurion-local-test-pack-${{ env.AURION_RELEASE_SHA }}
          path: .aurion-local-test-pack/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          include-hidden-files: true
      - name: Hash executable workspace subset
        shell: bash
        run: |
          set -euo pipefail
          cd .aurion-local-test-pack
          sha256sum manifest.json aurion-source.tar.zst node_modules.tar.zst package.json pnpm-lock.yaml > workspace.sha256
          sha256sum --check workspace.sha256
      - name: Upload executable workspace subset
        uses: actions/upload-artifact@v4
        with:
          name: aurion-local-workspace-${{ env.AURION_RELEASE_SHA }}
          path: |
            .aurion-local-test-pack/manifest.json
            .aurion-local-test-pack/workspace.sha256
            .aurion-local-test-pack/aurion-source.tar.zst
            .aurion-local-test-pack/node_modules.tar.zst
            .aurion-local-test-pack/package.json
            .aurion-local-test-pack/pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
          include-hidden-files: true
