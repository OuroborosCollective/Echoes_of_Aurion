name: Starter Village Pilot Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/starter-village-pilot.yml"
      - "server/starterVillagePilotHttp.test.ts"
      - "e2e/starterVillagePilot.spec.ts"
      - "server/db.ts"
      - "server/routers.ts"
      - "server/zone**"
      - "client/src/xaurion/**"
      - "drizzle/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starter-village-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: auriontest
          MARIADB_DATABASE: aurion_starter_pilot
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -pauriontest --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      DATABASE_URL: mysql://root:auriontest@127.0.0.1:3306/aurion_starter_pilot
      AURION_TEST_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AURION_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AURION_EVIDENCE_DIR: test-results/starter-village-pilot
      JWT_SECRET: starter-village-ci-disposable-never-production
      VITE_APP_ID: starter-village-pilot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 22, cache: pnpm }
      - name: Freeze revision, install and migrate isolated MariaDB
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AURION_RELEASE_SHA"
          pnpm install --frozen-lockfile
          pnpm verify:migrations
          pnpm exec drizzle-kit migrate
          pnpm check
          pnpm build
      - name: Canonical 10 Hz Return Stone and northward movement regressions
        run: pnpm exec vitest run server/returnStoneZoneRuntime.test.ts server/zoneGatewayPresence.test.ts server/zoneRuntime.test.ts --no-file-parallelism --reporter=verbose
      - name: Enforce local-only runtime network
        run: |
          set -euo pipefail
          sudo iptables -I OUTPUT 1 -o lo -j ACCEPT
          sudo iptables -I OUTPUT 2 -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo iptables -I OUTPUT 3 -j REJECT
          ! curl --max-time 3 --silent --show-error https://generativelanguage.googleapis.com/
          ! curl --max-time 3 --silent --show-error https://api.openai.com/
          ! curl --max-time 3 --silent --show-error https://api.anthropic.com/
          ! curl --max-time 3 --silent --show-error https://agent-zero.ai/
          ! curl --max-time 3 --silent --show-error https://bmad-method.org/
          mariadb-admin ping -h 127.0.0.1 -pauriontest --silent
      - name: Start exact runtime and execute authenticated HTTP/tRPC journey
        run: |
          set -euo pipefail
          HOST=127.0.0.1 PORT=3000 STRICT_PORT=true NODE_ENV=production node dist/index.js > test-results/starter-pilot-server-before.log 2>&1 &
          echo $! > /tmp/starter-pilot.pid
          for attempt in $(seq 1 60); do curl --fail --silent http://127.0.0.1:3000/healthz && break || sleep 1; done
          curl --fail --silent http://127.0.0.1:3000/healthz | tee test-results/starter-pilot-health-before.json
          AURION_STARTER_VILLAGE_HTTP_E2E=1 AURION_STARTER_VILLAGE_PHASE=journey pnpm exec vitest run server/starterVillagePilotHttp.test.ts --reporter=verbose
      - name: Restart application and independently read back quest and inventory
        run: |
          set -euo pipefail
          kill "$(cat /tmp/starter-pilot.pid)"
          wait "$(cat /tmp/starter-pilot.pid)" 2>/dev/null || test $? -eq 127
          HOST=127.0.0.1 PORT=3000 STRICT_PORT=true NODE_ENV=production node dist/index.js > test-results/starter-pilot-server-after.log 2>&1 &
          echo $! > /tmp/starter-pilot.pid
          for attempt in $(seq 1 60); do curl --fail --silent http://127.0.0.1:3000/healthz && break || sleep 1; done
          AURION_STARTER_VILLAGE_HTTP_E2E=1 AURION_STARTER_VILLAGE_PHASE=readback pnpm exec vitest run server/starterVillagePilotHttp.test.ts --reporter=verbose
      - name: Browser-emulated viewport acceptance (not physical Android/GPU proof)
        run: AURION_STARTER_VILLAGE_BROWSER_E2E=1 pnpm exec playwright test e2e/starterVillagePilot.spec.ts --reporter=list
      - name: Seal revision-bound evidence manifest
        if: always()
        run: |
          set -euo pipefail
          mkdir -p test-results/starter-village-pilot
          printf '%s  %s\n' "$AURION_RELEASE_SHA" revision > test-results/starter-village-pilot/REVISION
          find test-results/starter-village-pilot -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > test-results/starter-village-pilot/SHA256SUMS
          chmod -R a-w test-results/starter-village-pilot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starter-village-pilot-${{ env.AURION_RELEASE_SHA }}
          path: |
            test-results/starter-village-pilot
            test-results/starter-pilot-*.log
            test-results/starter-pilot-health-*.json
          if-no-files-found: error
          retention-days: 30
