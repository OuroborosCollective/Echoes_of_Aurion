name: Aurion Terrain3D G19 native proof
on:
  pull_request:
    paths:
      - 'godot-client/**'
      - 'scripts/godot/install-terrain3d.mjs'
      - '.github/workflows/aurion-terrain3d-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-native-terrain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install byte-pinned Terrain3D 1.0.2 native binaries
        run: node scripts/godot/install-terrain3d.mjs
      - name: Install pinned Godot 4.7.2
        run: node scripts/godot/bootstrap.mjs
      - name: Real headless native addon import
        run: |
          .aurion-godot/editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot-client --editor --import
      - name: Server-shaped native terrain and stale-session regressions
        run: |
          .aurion-godot/editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot-client --script tests/test_terrain3d_confirmed.gd
      - name: Existing G17 atlas and G18 authenticated chunk fallback regressions
        run: |
          .aurion-godot/editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot-client --script tests/test_material_projection.gd
          .aurion-godot/editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot-client --script tests/test_chunk_terrain.gd
