name: Manual Mobile GLB Asset Build

on:
  workflow_dispatch:
    inputs:
      source_path:
        description: 'Repository-relative source directory or .zip archive'
        required: true
        default: 'assets/mobile-source'
        type: string
      include_colliders:
        description: 'Generate separate convex-hull collider GLBs'
        required: true
        default: true
        type: boolean
      texture_size:
        description: 'Maximum texture dimension for mobile delivery'
        required: true
        default: '1024'
        type: string

permissions:
  contents: read

jobs:
  build-mobile-glb-assets:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4

      - name: Install Blender and GLB tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y blender unzip zip jq python3
          npm install --global @gltf-transform/cli@4.5.0

      - name: Resolve source directory
        id: source
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
        run: |
          set -euo pipefail
          test -e "$SOURCE_PATH"
          mkdir -p .asset-build/source
          if [[ "$SOURCE_PATH" == *.zip ]]; then
            unzip -q "$SOURCE_PATH" -d .asset-build/source
          else
            cp -a "$SOURCE_PATH/." .asset-build/source/
          fi
          echo "path=$PWD/.asset-build/source" >> "$GITHUB_OUTPUT"

      - name: Run LOD and optional collider build
        env:
          INCLUDE_COLLIDERS: ${{ inputs.include_colliders }}
        run: |
          set -euo pipefail
          args=(--source "${{ steps.source.outputs.path }}" --work "$PWD/.asset-build/work" --output "$PWD/.asset-build/output" --texture-size "${{ inputs.texture_size }}")
          if [[ "$INCLUDE_COLLIDERS" == 'true' ]]; then args+=(--colliders); fi
          python3 scripts/mobile_glb_asset_pipeline.py "${args[@]}"

      - name: Validate output GLBs and budgets
        run: |
          set -euo pipefail
          python3 scripts/validate_mobile_glb_assets.py \
            --root .asset-build/output \
            --manifest .asset-build/output/manifest.json

      - name: Package GLB deliverables
        run: |
          set -euo pipefail
          mkdir -p build
          cp .asset-build/output/manifest.json build/manifest.json
          python3 scripts/package_mobile_glb_assets.py \
            --root .asset-build/output \
            --zip build/echoes-of-aurion-mobile-glb-assets.zip
          unzip -t build/echoes-of-aurion-mobile-glb-assets.zip

      - name: Upload optimized asset package and audit
        uses: actions/upload-artifact@v4
        with:
          name: echoes-of-aurion-mobile-glb-assets-${{ github.run_number }}
          path: |
            build/echoes-of-aurion-mobile-glb-assets.zip
            build/manifest.json
          if-no-files-found: error
          retention-days: 30
