name: Temporary finish 0046 root apply
on:
  pull_request:
    paths:
      - ".github/workflows/_temporary-finish-0046-root-apply.yml"
permissions:
  contents: write
jobs:
  finish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Patch root apply proof to 0046
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/aurion-root-schema-apply-artifact-proof.yml')
          s=p.read_text()
          old='      - "drizzle/0045_aurion_deterministic_quest_compiler.sql"\n'
          if s.count(old)!=1: raise SystemExit(f'0045 path count={s.count(old)}')
          s=s.replace(old, old+'      - "drizzle/0046_aurion_semantic_node_history_key.sql"\n')
          old='Prove fixed runner creates a backup, restores it in isolation and applies exactly 0021 through 0045'
          if s.count(old)!=1: raise SystemExit(f'step count={s.count(old)}')
          s=s.replace(old,'Prove fixed runner creates a backup, restores it in isolation and applies exactly 0021 through 0046')
          old='"0044_aurion_semantic_memory_graph", "0045_aurion_deterministic_quest_compiler"];'
          if s.count(old)!=1: raise SystemExit(f'tag count={s.count(old)}')
          s=s.replace(old,'"0044_aurion_semantic_memory_graph", "0045_aurion_deterministic_quest_compiler", "0046_aurion_semantic_node_history_key"];')
          old='test "$rows" -eq 46'
          if s.count(old)!=1: raise SystemExit(f'rows count={s.count(old)}')
          s=s.replace(old,'test "$rows" -eq 47')
          p.write_text(s)
          PY
          git diff --check
      - name: Commit root apply mirror
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/aurion-root-schema-apply-artifact-proof.yml
          git commit -m 'fix(ci): extend root apply proof through 0046'
          git push origin "HEAD:${HEAD_BRANCH}"
