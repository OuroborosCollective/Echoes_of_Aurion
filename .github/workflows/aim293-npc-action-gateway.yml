name: AIM-293 NPC Action Gateway
on:
  pull_request:
    paths:
      - "server/npcActionGatewayPersistence.ts"
      - "server/ax1LivingWorldRuntime.ts"
      - "server/autonomousNpcLifeRuntime.ts"
      - "server/aim293NpcActionGateway*.test.ts"
      - "server/autonomousNpcLifeMariaDb.test.ts"
      - "shared/npcActionReadmodel.ts"
      - "client/src/xaurion/integration/NpcDecisionPanel*"
      - "e2e/aim292.npcMemory.spec.ts"
      - "scripts/seed-aim293-browser-evidence.ts"
      - "drizzle/**"
      - ".github/workflows/aim293-npc-action-gateway.yml"
  push:
    branches: [main]
    paths:
      - "server/npcActionGatewayPersistence.ts"
      - "server/ax1LivingWorldRuntime.ts"
      - "server/autonomousNpcLifeRuntime.ts"
      - "server/aim293NpcActionGateway*.test.ts"
      - "shared/npcActionReadmodel.ts"
      - "drizzle/**"
      - ".github/workflows/aim293-npc-action-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aim293-npc-action-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  transaction-proof:
    name: Real MariaDB rollback retry and memory-after-readback
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mariadb:
        image: mariadb:11.4.13
        env:
          MARIADB_ROOT_PASSWORD: aurion-aim293-proof
          MARIADB_DATABASE: aurion_aim293_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -paurion-aim293-proof --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      DATABASE_URL: mysql://root:aurion-aim293-proof@127.0.0.1:3306/aurion_aim293_test
      AURION_NPC_ACTION_E2E: "1"
      AURION_NPC_E2E: "1"
      AURION_E2E_ISOLATED: "1"
      AURION_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      JWT_SECRET: aurion-disposable-aim293-signing-key-never-production
      VITE_APP_ID: aurion-isolated-aim293
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply complete exact-head schema
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AURION_RELEASE_SHA"
          pnpm verify:migrations
          pnpm exec drizzle-kit migrate
      - name: Read back exact 0053 bootstrap epochs
        run: |
          mkdir -p test-results
          pnpm exec tsx scripts/verify-aim293-action-epoch-seed.ts | tee test-results/aim293-epoch-seed.json
      - name: Prove contract, rollback, deny, retry, concurrency and AIM-292 compatibility
        run: |
          set -euo pipefail
          pnpm check
          pnpm exec vitest run --no-file-parallelism             server/aim245LivingWorld.test.ts             server/aim293NpcActionGatewayContract.test.ts             server/aim293NpcActionGatewayMariaDb.test.ts             server/autonomousNpcLifeMariaDb.test.ts             server/aim292NpcMultiMemoryMariaDb.test.ts             client/src/xaurion/integration/NpcDecisionPanel.test.tsx             client/src/xaurion/integration/ax1FullCutover.test.tsx
          AURION_RECONCILIATION_SOURCE_SHA="$AURION_RELEASE_SHA" node --import tsx scripts/reconcile-aurion-production-schema.ts --require-match
      - name: Build production bundle
        run: pnpm build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aim293-transaction-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/
            dist/
          if-no-files-found: warn
          retention-days: 14
