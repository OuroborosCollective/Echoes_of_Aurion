name: Aurion tablet login proof
on:
  push:
    branches: ['test/tablet-godot-login-*']
    paths:
      - 'deploy/aurion-tablet-login/**'
      - '.github/workflows/aurion-tablet-login-proof.yml'
  pull_request:
    paths:
      - 'deploy/aurion-tablet-login/**'
      - '.github/workflows/aurion-tablet-login-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install frozen repository dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install official Chromium test runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Fetch pinned official noVNC test source
        run: |
          git clone --no-checkout https://github.com/novnc/noVNC.git "$RUNNER_TEMP/aurion-novnc"
          git -C "$RUNNER_TEMP/aurion-novnc" checkout --detach e91a095ad6751fdb9a7bd642ad9bc75afbdaac87
          test "$(git -C "$RUNNER_TEMP/aurion-novnc" rev-parse HEAD)" = e91a095ad6751fdb9a7bd642ad9bc75afbdaac87
          python3 deploy/aurion-tablet-login/build_page.py --novnc-source "$RUNNER_TEMP/aurion-novnc" --output "$RUNNER_TEMP/aurion-novnc-generated"
      - name: Browser-only positive and negative fixtures
        run: node deploy/aurion-tablet-login/browser-proof.mjs
        env:
          AURION_NOVNC_SOURCE: ${{ runner.temp }}/aurion-novnc
          AURION_NOVNC_GENERATED: ${{ runner.temp }}/aurion-novnc-generated
      - name: Canonical browser consent Origin regression
        run: node --test scripts/native-auth-browser-origin.test.mjs
      - name: Python helper syntax
        run: |
          python3 -m py_compile deploy/aurion-tablet-login/build_page.py deploy/aurion-tablet-login/one_attempt.py
          python3 deploy/aurion-tablet-login/build_page.py --self-test
      - name: Existing native authentication boundaries
        run: pnpm exec vitest run server/nativeAuthHttp.test.ts server/nativeAuthProtocol.test.ts server/nativeAuthStateSeal.test.ts server/_core/sdkNativeAuth.test.ts server/observability/otelBoundary.test.ts
      - name: Verify whitespace
        run: git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aurion-tablet-login-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: .aurion-tablet-login-proof/
          include-hidden-files: true
          retention-days: 7
  native-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: auriontest
          MARIADB_DATABASE: aurion_tablet_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -pauriontest --silent"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      DATABASE_URL: mysql://root:auriontest@127.0.0.1:3306/aurion_tablet_test
      AURION_NATIVE_AUTH_E2E: '1'
      JWT_SECRET: isolated-ci-tablet-fixture-never-production
      VITE_APP_ID: aurion-isolated-tablet-test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Migrate only disposable localhost test database
        run: |
          pnpm verify:migrations
          pnpm exec drizzle-kit migrate
          node scripts/prepare-native-auth-test-schema.mjs
      - name: Existing real MariaDB native auth replay and race regressions
        run: pnpm exec vitest run server/nativeAuthBrowserMariaDb.test.ts server/nativeAuthPersistenceMariaDb.test.ts
      - name: Install repository-pinned official Godot
        run: node scripts/godot/bootstrap.mjs
      - name: Existing native auth in minimal isolated Godot project
        run: |
          mkdir -p "$RUNNER_TEMP/aurion-native-fixture/tests"
          cp -r godot-client/net godot-client/config godot-client/platform "$RUNNER_TEMP/aurion-native-fixture/"
          cp godot-client/tests/test_native_auth_{flow,tokens,start_runtime}.gd "$RUNNER_TEMP/aurion-native-fixture/tests/"
          printf 'config_version=5\n[application]\nconfig/name="Native auth fixture"\n' > "$RUNNER_TEMP/aurion-native-fixture/project.godot"
          editor=.aurion-godot/editor/Godot_v4.7.2-stable_linux.x86_64
          "$editor" --headless --path "$RUNNER_TEMP/aurion-native-fixture" --script tests/test_native_auth_flow.gd
          "$editor" --headless --path "$RUNNER_TEMP/aurion-native-fixture" --script tests/test_native_auth_tokens.gd
          node scripts/godot/native-auth-start-runtime.mjs "$editor" "$RUNNER_TEMP/aurion-native-fixture"
