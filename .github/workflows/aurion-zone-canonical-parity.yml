name: Aurion canonical zone parity

on:
  pull_request:
    paths:
      - 'server/causality/zoneCanonicalState.ts'
      - 'server/causality/zoneCanonicalState.test.ts'
      - 'server/causality/zoneSnapshotCache.test.ts'
      - 'server/causality/headlessCausalOracle.test.ts'
      - '.github/workflows/aurion-zone-canonical-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify real Aurion deterministic behavior
        run: pnpm exec vitest run server/causality/zoneCanonicalState.test.ts server/causality/zoneSnapshotCache.test.ts server/causality/headlessCausalOracle.test.ts
