name: AIM224 Video State Machine Proof

on:
  push:
    branches:
      - fix/aim-224-video-state-machine
    paths:
      - .github/workflows/aim-224-video-fix-once.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/aim-224-video-state-machine
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply deterministic video-state fix
        run: |
          python scripts/aim224_video_state_fix.py
          python - <<'PY'
          from pathlib import Path
          p = Path("client/src/pages/Home.tsx")
          text = p.read_text()
          hud_old = '        onOpenDetails={() => setWorldDetailsOpen(true)}\n      />\n      {screen === "open_world" && worldDetailsOpen && ('
          hud_new = '        onOpenDetails={() => setWorldDetailsOpen(true)}\n      />}\n      {screen === "open_world" && worldDetailsOpen && ('
          if text.count(hud_old) != 1:
              raise SystemExit(f"expected one OpenWorldHud boundary, found {text.count(hud_old)}")
          text = text.replace(hud_old, hud_new, 1)
          drawer_old = '\n      )}}\n      {trailerOpen'
          if text.count(drawer_old) != 1:
              raise SystemExit(f"expected one drawer boundary, found {text.count(drawer_old)}")
          text = text.replace(drawer_old, '\n      )}\n      {trailerOpen', 1)
          p.write_text(text)
          PY
      - name: Verify patch integrity
        run: git diff --check
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Focused state contracts
        run: pnpm exec vitest run client/src/pages/Home.openWorldState.test.ts client/src/game/sceneCompanionAuthority.test.ts
      - name: Install Chromium proof browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Configure Playwright-managed Chromium
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("playwright.config.ts")
          text = p.read_text()
          start = text.index("    launchOptions: {")
          end = text.index("    headless: true,", start)
          p.write_text(text[:start] + '    launchOptions: { args: ["--use-angle=swiftshader", "--disable-dev-shm-usage"] },\n' + text[end:])
          PY
      - name: Reproduce the user video flow on phone and tablet
        run: |
          set -euo pipefail
          pnpm exec vite --host 127.0.0.1 --port 3000 >/tmp/aurion-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              pnpm exec playwright test e2e/aim224.videoFlow.spec.ts e2e/towerHome.mobile.spec.ts
              exit $?
            fi
            sleep 1
          done
          cat /tmp/aurion-vite.log
          exit 1
      - name: Commit verified product patch
        run: |
          git config user.name "Ouroboros Collective"
          git config user.email "projectouroboroscollective@gmail.com"
          git add client/src/pages/Home.tsx client/src/pages/Home.openWorldState.test.ts client/src/game/scene.ts client/src/game/sceneCompanionAuthority.test.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 1
          fi
          git commit -m "fix(frontend): enforce explicit Open World encounter states"
          git push origin HEAD:fix/aim-224-video-state-machine
