name: Aurion G09 independent readback regression

on:
  pull_request:
    paths:
      - ".github/workflows/aurion-0075-live-readback.yml"
      - ".github/workflows/aurion-g09-readback-contract.yml"
      - "scripts/aurion-live-schema-observation.mjs"
      - "scripts/aurion-live-schema-observation.test.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/aurion-0075-live-readback.yml"
      - ".github/workflows/aurion-g09-readback-contract.yml"
      - "scripts/aurion-live-schema-observation.mjs"
      - "scripts/aurion-live-schema-observation.test.mjs"

permissions:
  contents: read

jobs:
  exact-head-readback-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Prove exact candidate revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Run read-only observation regression
        run: |
          set -euo pipefail
          node --check scripts/aurion-live-schema-observation.mjs
          node --test scripts/aurion-live-schema-observation.test.mjs
