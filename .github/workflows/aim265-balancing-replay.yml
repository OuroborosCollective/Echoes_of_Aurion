name: AIM 265 exact balancing and spatial replay
on:
  pull_request:
    paths:
      - 'scripts/balancing/**'
      - 'docs/balancing/**'
      - 'server/aurion*Protocol.ts'
      - 'server/aurionRegionCatalog.ts'
      - 'server/aurionAx1ContentCatalog.ts'
      - 'server/*MasteryProtocol.ts'
      - 'server/wasdAurionSkillProgressionProtocol.ts'
      - 'server/wasdAurionWorldIntegrityProtocol.ts'
      - 'server/openWorldProtocol.ts'
      - 'server/globalWorldProtocol.ts'
      - 'server/guildBankProtocol.ts'
      - 'server/wolframCag*'
      - 'server/aurionCagDesign*'
      - 'server/neuralCapabilityCagVerifier.ts'
      - 'server/neuralCapabilityCagVerifier.test.ts'
      - 'server/neuralCapabilityDifferentialHarness.ts'
      - 'server/neuralCapabilityPromotionGate.ts'
      - 'server/neuralCapabilityPromotionGate.test.ts'
      - 'fixtures/neural-capability/**'
      - 'shared/aurionCagDesignProtocol.ts'
      - 'shared/neuralCapabilityCagProtocol.ts'
      - 'scripts/balancing/aurion-cag-design-canary.ts'
      - 'scripts/balancing/neural-capability-cag-canary.ts'
      - 'server/adminMcp*'
      - 'server/_core/index.ts'
      - 'server/aim265*'
      - 'shared/aurion*Catalog.json'
      - 'shared/worldChunk*Protocol.ts'
      - '.github/workflows/aim265-balancing-replay.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/balancing/**'
      - 'docs/balancing/**'
      - 'server/aurion*Protocol.ts'
      - 'server/aurionRegionCatalog.ts'
      - 'server/aurionAx1ContentCatalog.ts'
      - 'server/*MasteryProtocol.ts'
      - 'server/wasdAurionSkillProgressionProtocol.ts'
      - 'server/wasdAurionWorldIntegrityProtocol.ts'
      - 'server/openWorldProtocol.ts'
      - 'server/globalWorldProtocol.ts'
      - 'server/guildBankProtocol.ts'
      - 'server/wolframCag*'
      - 'server/aurionCagDesign*'
      - 'server/neuralCapabilityCagVerifier.ts'
      - 'server/neuralCapabilityCagVerifier.test.ts'
      - 'server/neuralCapabilityDifferentialHarness.ts'
      - 'server/neuralCapabilityPromotionGate.ts'
      - 'server/neuralCapabilityPromotionGate.test.ts'
      - 'fixtures/neural-capability/**'
      - 'shared/aurionCagDesignProtocol.ts'
      - 'shared/neuralCapabilityCagProtocol.ts'
      - 'scripts/balancing/aurion-cag-design-canary.ts'
      - 'scripts/balancing/neural-capability-cag-canary.ts'
      - 'server/adminMcp*'
      - 'server/_core/index.ts'
      - 'server/aim265*'
      - 'shared/aurion*Catalog.json'
      - 'shared/worldChunk*Protocol.ts'
      - '.github/workflows/aim265-balancing-replay.yml'
permissions:
  contents: read
jobs:
  independent-exact-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Run real TypeScript calculations and independent integer/rational oracle
        run: |
          set -euo pipefail
          node --import tsx scripts/balancing/replay-aim265.mjs /tmp/aurion-balancing-v2.json
          python scripts/balancing/verify-aim265.py /tmp/aurion-balancing-v2.json > /tmp/aurion-balancing-oracle.json
          diff -u docs/balancing/aim265-candidate.json /tmp/aurion-balancing-v2.json
          python -m unittest discover -s scripts/balancing -p 'test_*.py'
          pnpm exec vitest run server/aim249BalancingModel.test.ts server/aim250RegionProgression.test.ts server/aim265SpatialCalculation.test.ts server/wasdAurionWorldIntegrityProtocol.test.ts server/openWorldProtocol.test.ts server/wolframCag.test.ts server/wolframCagRuntimeReadback.test.ts server/aurionCagDesignOracle.test.ts server/neuralCapabilityCagVerifier.test.ts server/neuralCapabilityPromotionGate.test.ts server/adminMcp.test.ts
      - name: Prove neural CAG verifier stays off the runtime import path
        run: |
          set -euo pipefail
          unexpected="$(grep -R -n --include='*.ts' --include='*.tsx' -E 'neuralCapabilityCagVerifier|neuralCapabilityPromotionGate|neuralCapabilityDifferentialHarness' client server shared | grep -v '^server/neuralCapabilityCagVerifier.ts:' | grep -v '^server/neuralCapabilityCagVerifier.test.ts:' | grep -v '^server/neuralCapabilityPromotionGate.ts:' | grep -v '^server/neuralCapabilityPromotionGate.test.ts:' | grep -v '^server/neuralCapabilityDifferentialHarness.ts:' || true)"
          if [ -n "$unexpected" ]; then
            printf '%s\n' "$unexpected"
            exit 1
          fi
      - name: Run real Wolfram CAG canaries when CI has the provisioned key
        env:
          WOLFRAM_CAG_API_KEY: ${{ secrets.WOLFRAM_CAG_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${WOLFRAM_CAG_API_KEY:-}" ]; then
            printf '%s\n' '{"protocol":"aurion.wolfram-cag-ci.v1","status":"SECRET_NOT_AVAILABLE_IN_CI","providerCallExecuted":false}' | tee /tmp/aurion-wolfram-cag-canary.json
            printf '%s\n' '{"protocol":"aurion.cag-design-ci.v1","status":"SECRET_NOT_AVAILABLE_IN_CI","providerCallExecuted":false}' | tee /tmp/aurion-cag-design-canary.json
            printf '%s\n' '{"protocol":"aurion.neural-capability-cag-ci.v2","status":"SECRET_NOT_AVAILABLE_IN_CI","providerCallExecuted":false,"promotionStatus":"BLOCKED"}' | tee /tmp/aurion-neural-capability-cag-canary.json
          else
            pnpm exec tsx scripts/balancing/wolfram-cag-canary.ts | tee /tmp/aurion-wolfram-cag-canary.json
            pnpm exec tsx scripts/balancing/aurion-cag-design-canary.ts | tee /tmp/aurion-cag-design-canary.json
            pnpm exec tsx scripts/balancing/neural-capability-cag-canary.ts | tee /tmp/aurion-neural-capability-cag-canary.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aurion-balancing-v2-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/aurion-balancing-v2.json
            /tmp/aurion-balancing-oracle.json
            /tmp/aurion-wolfram-cag-canary.json
            /tmp/aurion-cag-design-canary.json
            /tmp/aurion-neural-capability-cag-canary.json
          if-no-files-found: error
          retention-days: 14
