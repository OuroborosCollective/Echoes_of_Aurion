name: Forum editor accessibility
on:
  pull_request:
    paths:
      - 'client/src/components/ForumAdminEditor*'
      - '.github/workflows/forum-editor-accessibility.yml'
      - 'tests/forum-preview/**'
permissions:
  contents: read
jobs:
  accessibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck and isolated component regression
        run: |
          pnpm check
          pnpm exec vitest run client/src/components/ForumAdminEditor.test.tsx
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify actual keyboard focus and selection in Chromium
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vite --config tests/forum-preview/vite.config.ts --host 127.0.0.1 --port 4174 --strictPort > /tmp/forum-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:4174/index.html >/dev/null; then break; fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then cat /tmp/forum-preview.log; exit 1; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:4174/index.html >/dev/null
          node tests/forum-preview/keyboard.mjs
