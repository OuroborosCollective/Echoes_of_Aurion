name: Temporary pnpm lock refresh

on:
  pull_request:
    paths:
      - ".github/workflows/_temporary-pnpm-lock-refresh.yml"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Regenerate lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Prove regenerated lock is frozen-install compatible
        run: pnpm install --frozen-lockfile --lockfile-only
      - name: Commit exact generated lock to this PR branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git diff --check -- pnpm-lock.yaml
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml
          git commit -m 'fix(deps): synchronize pnpm lockfile'
          git push origin "HEAD:${HEAD_BRANCH}"
