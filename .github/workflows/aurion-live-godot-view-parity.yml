name: Aurion / Godot first-start live parity

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurion-first-start-live-parity
  cancel-in-progress: false

jobs:
  first-start-live-parity:
    # Never run a PR or arbitrary dispatch ref with production browser access.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: production
    runs-on: [self-hosted, Linux, X64, aurion-static]
    timeout-minutes: 12
    env:
      AURION_EXPECTED_REVISION: ${{ github.sha }}
      AURION_PARITY_CDP_URL: ${{ vars.AURION_PARITY_CDP_URL }}
      AURION_PARITY_NATIVE_CDP_URL: ${{ vars.AURION_PARITY_NATIVE_CDP_URL }}
      AURION_GODOT_EXECUTABLE: ${{ vars.AURION_GODOT_EXECUTABLE }}
      DISPLAY: ${{ vars.AURION_PARITY_DISPLAY }}
      PARITY_OUTPUT: ${{ runner.temp }}/aurion-startup-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked capture dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          python -m pip install --disable-pip-version-check Pillow==12.0.0
      - name: Prepare byte-pinned game assets
        run: node scripts/godot/prepare-assets.mjs
      - name: Start fresh editor game and capture the paired live tick once
        run: node scripts/godot/capture-live-startup.mjs "$PARITY_OUTPUT"
      - name: Fail above 75 percent and explain the first-start differences
        if: always()
        run: python scripts/godot/startup_view_report.py --directory "$PARITY_OUTPUT"
      - name: Show diagnosis in workflow status
        if: always()
        shell: bash
        run: |
          if test -f "$PARITY_OUTPUT/report.md"; then
            cat "$PARITY_OUTPUT/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## ROT: Erststart-Bericht fehlt' >> "$GITHUB_STEP_SUMMARY"
            echo 'Capture-Abhängigkeiten und die vorherige fehlgeschlagene Workflow-Stufe prüfen.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aurion-godot-first-start-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.PARITY_OUTPUT }}/aurion.png
            ${{ env.PARITY_OUTPUT }}/godot.png
            ${{ env.PARITY_OUTPUT }}/difference.png
            ${{ env.PARITY_OUTPUT }}/report.html
            ${{ env.PARITY_OUTPUT }}/report.md
            ${{ env.PARITY_OUTPUT }}/parity.json
            ${{ env.PARITY_OUTPUT }}/capture-index.json
            ${{ env.PARITY_OUTPUT }}/*-observation.json
          if-no-files-found: error
          retention-days: 14
