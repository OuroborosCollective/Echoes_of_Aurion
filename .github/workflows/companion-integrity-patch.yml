name: Companion learning integrity patch

on:
  push:
    branches:
      - fix/companion-learning-causality-origin-20260828

permissions:
  contents: write

concurrency:
  group: companion-learning-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Apply exact self-removing integrity patch
        run: python3 .github/scripts/run-companion-integrity-patch.py

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify companion contracts
        run: |
          pnpm check
          pnpm vitest run \
            client/src/companionLearningProtocol.test.ts \
            client/src/lib/companionLearning.test.ts \
            client/src/lib/companionFrameCapture.test.ts \
            server/companionMemory.test.ts
          pnpm test
          git diff --check

      - name: Commit verified patch to the same branch
        run: |
          set -euo pipefail
          git config user.name "Ouroboros Collective"
          git config user.email "projectouroboroscollective@gmail.com"
          git add -A
          git diff --cached --quiet && { echo "Expected verified companion patch is empty" >&2; exit 1; }
          git commit -m "fix(companion): bind learning frames actions and authority"
          git push origin "HEAD:${GITHUB_REF_NAME}"
