name: Wave 3 Steps 35-37 Economic Ledger

on:
  pull_request:
    paths:
      - "shared/aurionEconomicEventContract.ts"
      - "server/economy/**"
      - "server/db.ts"
      - "server/history/**"
      - "scripts/read-aurion-economic-audit.ts"
      - "scripts/reconcile-aurion-economic-ledger.ts"
      - "drizzle/0057_aurion_economic_ledger_v2.sql"
      - "drizzle/aurionCausalitySchema.ts"
      - "drizzle/meta/_journal.json"
      - "config/aurion-migration-wave-manifest.json"
      - "scripts/aurionProductionSchemaReconciliation.ts"
      - ".github/workflows/wave3-economic-ledger.yml"
  push:
    branches: [main]
    paths:
      - "shared/aurionEconomicEventContract.ts"
      - "server/economy/**"
      - "server/db.ts"
      - "drizzle/0057_aurion_economic_ledger_v2.sql"
      - ".github/workflows/wave3-economic-ledger.yml"

permissions:
  contents: read

jobs:
  economic-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: auriontest
          MARIADB_DATABASE: aurion_wave3_economic_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -pauriontest --silent"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      DATABASE_URL: mysql://root:auriontest@127.0.0.1:3306/aurion_wave3_economic_test
      NODE_ENV: test
      AURION_WAVE3_ECONOMIC_E2E: "1"
      AURION_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      JWT_SECRET: aurion-wave3-economic-ci-disposable-never-production
      VITE_APP_ID: aurion-wave3-economic-ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Prove exact head and migration chain
        run: |
          test "$(git rev-parse HEAD)" = "$AURION_RELEASE_SHA"
          pnpm verify:migrations
          pnpm exec drizzle-kit migrate
      - name: Run economic contract and real MariaDB regression
        run: pnpm exec vitest run server/economy/economicLedgerContract.test.ts server/economy/economicLedgerMariaDb.test.ts --no-file-parallelism
      - name: Prove explicit reconcile replay in a fresh process
        run: pnpm exec tsx scripts/reconcile-aurion-economic-ledger.ts --world echoes-of-aurion-global --confirm RECONCILE_ECONOMIC_EVIDENCE
      - name: Read invariant audit through fresh read-only process
        run: pnpm exec tsx scripts/read-aurion-economic-audit.ts --world echoes-of-aurion-global
      - name: TypeScript and build
        run: |
          pnpm check
          pnpm build
