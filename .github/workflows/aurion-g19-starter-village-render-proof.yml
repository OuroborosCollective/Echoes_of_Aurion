name: Aurion G19 starter village real render proof
on:
  pull_request:
    paths:
      - 'godot-client/**'
      - 'scripts/godot/**'
      - 'server/aurionStarterVillageVisuals.ts'
      - '.github/workflows/aurion-g19-starter-village-render-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-starter-village:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source SHA and physical model bytes
        run: |
          node --test scripts/godot/check-starter-village-assets.test.mjs
          node scripts/godot/check-starter-village-assets.mjs
      - name: Install SHA-locked Godot editor
        run: node scripts/godot/bootstrap.mjs
      - name: Import actual eight embedded GLB models
        run: .aurion-godot/editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot-client --editor --import
      - name: Install software OpenGL display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Capture real Godot viewport pixels with server-shaped village plan
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          AURION_VILLAGE_CAPTURE_DIR: ${{ runner.temp }}/aurion-g19-village-pixels
        run: |
          xvfb-run -a -s '-screen 0 1280x800x24' .aurion-godot/editor/Godot_v4.7.2-stable_linux.x86_64 --path godot-client --rendering-method gl_compatibility --audio-driver Dummy --script tests/capture_starter_village.gd
      - name: Retain original before/after native pixel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g19-starter-village-pixels-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/aurion-g19-village-pixels/*.png
          if-no-files-found: warn
          retention-days: 7
