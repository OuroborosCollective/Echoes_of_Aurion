name: Temporary exact source contract repair

on:
  pull_request:
    paths:
      - ".github/workflows/_temporary-contract-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply exact source contract repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual}: {old[:120]!r}")
              p.write_text(text.replace(old, new))

          replace_exact(
              "client/src/xaurion/components/GameHUD.tsx",
              'import { useEffect, useState, type ReactNode } from "react";',
              'import { useEffect, useRef, useState, type ReactNode } from "react";',
          )

          ops = "client/src/pages/Operations.tsx"
          replace_exact(ops, "Active Hash", "Policy Hash")
          replace_exact(ops, "confirmedPolicy.data.activeHash", "confirmedPolicy.data.policyHash")
          replace_exact(ops, "WASD Capsule SHA", "Source SHA-256")
          replace_exact(ops, "confirmedPolicy.data.provenance.verifiedCapsuleHash", "confirmedPolicy.data.sourceSha256")
          replace_exact(ops, "Trigger Event", "Source Revision")
          replace_exact(ops, 'confirmedPolicy.data.provenance.triggerEvent.replace(/_/g, " ")', "confirmedPolicy.data.sourceRevision")
          replace_exact(ops, "Rules Snapshot (Skills & Preferences)", "Policy Payload")
          replace_exact(ops, "confirmedPolicy.data.rules", "confirmedPolicy.data.payload")
          replace_exact(ops, 'Version {h.version} (Event: {h.provenance.triggerEvent})', 'Version {h.version} (Source: {h.sourceRevision.slice(0, 8)}…)')
          replace_exact(ops, "{h.activeHash}", "{h.policyHash}")
          replace_exact(ops, '<b>Event:</b> {h.provenance.triggerEvent}', '<b>Source revision:</b> {h.sourceRevision}')
          replace_exact(
              ops,
              '''                          {h.provenance.rollbackReason && (\n                            <p className="text-[11px] text-amber-200/90 italic">\n                              <b>Rollback-Grund:</b> {h.provenance.rollbackReason}\n                            </p>\n                          )}''',
              '''                          <p className="text-[11px] text-slate-400 font-mono truncate">\n                            <b>Source SHA-256:</b> {h.sourceSha256}\n                          </p>''',
          )

          surfaces = "client/src/xaurion/components/Ax1WorldSurfaces.tsx"
          replace_exact(
              surfaces,
              '''}>;\nexport type Ax1ConfirmedWorld = Readonly<{\n  displayName: string;\n  epoch: number;\n  deterministicHash: string;\n  pointsOfInterest: readonly Ax1WorldPoi[];''',
              '''}>;\nexport type Ax1ConfirmedWorldPoi = Pick<Ax1WorldPoi, "id" | "kind" | "state" | "label">;\nexport type Ax1ConfirmedWorld = Readonly<{\n  displayName: string;\n  epoch: number;\n  deterministicHash: string;\n  pointsOfInterest: readonly Ax1ConfirmedWorldPoi[];''',
          )

          hud = "client/src/xaurion/integration/AurionAuthorityHud.tsx"
          replace_exact(
              hud,
              '''    <WorldMapModal \n        isOpen={panel === "map"} \n        onClose={() => openPanel(null)} \n        playerStats={{\n            x: position?.x ?? 0,\n            z: position?.z ?? 0,\n            hp: player.data?.stats.hp ?? 0,\n            maxHp: player.data?.stats.maxHp ?? 100,\n        } as any}\n        npcs={[]}\n        pois={world.data?.pointsOfInterest.map(poi => ({\n            id: poi.id,\n            kind: poi.kind as any,\n            state: poi.state,\n            label: poi.label,\n            x: 0,\n            z: 0,\n            unlocked: poi.state !== "locked"\n        })) ?? []}\n        onTeleport={async (poiId) => {\n            await onAction("T");\n        }}\n    />''',
              '''    <WorldMapModal\n      open={panel === "map"}\n      onClose={() => openPanel(null)}\n      world={worldProjection}\n      position={position}\n      remotePlayers={remotePlayers}\n      state={world.state}\n    />''',
          )

          perf = "client/src/xaurion/spatial/HighDensityPerformanceGate.ts"
          replace_exact(perf, "import { NatureLodSystem } from '../world/NatureLodSystem';\n", "")
          replace_exact(perf, "import { TerrainSplatting } from '../world/TerrainSplatting';\n", "")

          ecs = "client/src/xaurion/spatial/RenderEcsPilot.ts"
          replace_exact(ecs, "  IWorld,\n", "")
          replace_exact(ecs, "  public world: IWorld;", "  public world: ReturnType<typeof createWorld>;")
          PY
          git diff --check
      - name: Commit repaired source contracts to this PR branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            client/src/pages/Operations.tsx \
            client/src/xaurion/components/GameHUD.tsx \
            client/src/xaurion/components/Ax1WorldSurfaces.tsx \
            client/src/xaurion/integration/AurionAuthorityHud.tsx \
            client/src/xaurion/spatial/HighDensityPerformanceGate.ts \
            client/src/xaurion/spatial/RenderEcsPilot.ts
          git commit -m 'fix(runtime): reconcile merged contract drift'
          git push origin "HEAD:${HEAD_BRANCH}"
