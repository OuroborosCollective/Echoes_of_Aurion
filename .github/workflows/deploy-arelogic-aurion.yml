name: Deploy Echoes of Aurion to arelogic.space

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "server/**"
      - "shared/**"
      - "drizzle/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite*.ts"
      - ".github/workflows/deploy-arelogic-aurion.yml"
  workflow_dispatch:

concurrency:
  group: deploy-arelogic-aurion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Verify and build immutable Aurion static artifact
    runs-on: ubuntu-24.04
    env:
      AURION_STATIC_SOURCE: https://aurion3d-6hpapr2g.manus.space

    steps:
      - name: Guard repository scope
        run: test "${GITHUB_REPOSITORY}" = "OuroborosCollective/Echoes_of_Aurion"

      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify exact source revision
        run: |
          pnpm check
          pnpm test
          git diff --check

      - name: Build static Aurion release
        run: pnpm build:itch

      - name: Mirror only Aurion media into the static release
        run: |
          set -euo pipefail
          mkdir -p dist/itch/manus-storage
          for asset in \
            aurion-expedition-theme_e8a8afea.mp3 \
            aurion-social-keyframe_5edc4882.png \
            aurion-sigil_e1fd1a34.png \
            aurion-hero-trailer-en-de_c44ee2e1.mp4
          do
            curl --fail --location --retry 3 --retry-delay 2 \
              "${AURION_STATIC_SOURCE}/manus-storage/${asset}" \
              --output "dist/itch/manus-storage/${asset}"
          done
          printf '{"revision":"%s","runId":"%s","artifact":"aurion-static"}\n' \
            "${GITHUB_SHA}" "${GITHUB_RUN_ID}" > dist/itch/.aurion-release.json
          tar -C dist/itch -czf aurion-static-release.tgz .
          sha256sum aurion-static-release.tgz > aurion-static-release.tgz.sha256

      - name: Publish immutable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurion-static-${{ github.sha }}
          path: |
            aurion-static-release.tgz
            aurion-static-release.tgz.sha256
          if-no-files-found: error
          retention-days: 30

  promote-aurion-static:
    name: Promote verified Aurion static artifact
    needs: verify-and-build
    runs-on: [self-hosted, Linux, X64, aurion-static]
    environment: production
    env:
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}
      EXPECTED_SHA: ${{ github.sha }}

    steps:
      - name: Guard repository scope
        run: test "${GITHUB_REPOSITORY}" = "OuroborosCollective/Echoes_of_Aurion"

      - name: Download verified Aurion artifact
        uses: actions/download-artifact@v4
        with:
          name: aurion-static-${{ github.sha }}
          path: release-artifact

      - name: Promote Aurion release only
        run: |
          set -euo pipefail
          base=/var/www/echoes-of-aurion
          archive="${GITHUB_WORKSPACE}/release-artifact/aurion-static-release.tgz"
          checksum="${GITHUB_WORKSPACE}/release-artifact/aurion-static-release.tgz.sha256"
          test -d "${base}/releases"
          cd "${GITHUB_WORKSPACE}/release-artifact"
          sha256sum -c "${checksum}"
          release="${base}/releases/${RELEASE_ID}"
          test ! -e "${release}"
          install -d -m 0755 "${release}"
          tar -xzf "${archive}" -C "${release}"
          grep -F "${EXPECTED_SHA}" "${release}/.aurion-release.json"
          ln -sTfn "${release}" "${base}/current.next"
          mv -Tf "${base}/current.next" "${base}/current"
          test "$(readlink -f "${base}/current")" = "${release}"

      - name: Read back current Aurion release
        run: cat /var/www/echoes-of-aurion/current/.aurion-release.json

      - name: Verify public Aurion root
        run: |
          curl --fail --silent --show-error --location https://arelogic.space/ | grep -q "<div id=\"root\"></div>"
