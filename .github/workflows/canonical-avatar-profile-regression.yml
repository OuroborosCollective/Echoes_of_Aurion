name: Canonical avatar profile regression
on:
  pull_request:
    paths:
      - 'client/src/xaurion/core/CanonicalAvatarProfile*'
      - '.github/workflows/canonical-avatar-profile-regression.yml'
permissions:
  contents: read
jobs:
  avatar-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Avatar profile regression
        run: pnpm exec vitest run client/src/xaurion/core/CanonicalAvatarProfile.test.ts
