name: Aurion zone promote final main 2026-08-28

on:
  push:
    branches:
      - aurion/migration-truth-snapshot-20260828

concurrency:
  group: aurion-zone-promote-final-main-20260828
  cancel-in-progress: false

permissions:
  contents: read

env:
  EXPECTED_MAIN_SHA: 6f7dff90a8e0edf71f488d357836216f3f5d8142

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN_SHA }}
          fetch-depth: 0
      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_MAIN_SHA}"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Full exact-main verification
        run: |
          set -euo pipefail
          pnpm check
          pnpm test
          git diff --check
      - name: Build immutable zone artifact
        run: |
          set -euo pipefail
          pnpm build:zone-runtime
          printf '{"revision":"%s","runId":"%s","artifact":"aurion-zone-runtime"}\n' "${EXPECTED_MAIN_SHA}" "${GITHUB_RUN_ID}" > dist-zone/.aurion-zone-runtime-release.json
          tar -C dist-zone -czf aurion-zone-runtime-release.tgz .
          sha256sum aurion-zone-runtime-release.tgz > aurion-zone-runtime-release.tgz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: aurion-zone-runtime-${{ env.EXPECTED_MAIN_SHA }}
          path: |
            aurion-zone-runtime-release.tgz
            aurion-zone-runtime-release.tgz.sha256
            deploy/aurion-zone-runtime.service
            deploy/aurion-zone-runtime.environment.template
            deploy/arelogic-zone-runtime.nginx.conf
            deploy/arelogic-zone-runtime-rate-limit.nginx.conf
            deploy/promote-aurion-zone-runtime.sh
          if-no-files-found: error
          retention-days: 30

  promote:
    needs: verify-and-build
    runs-on: [self-hosted, Linux, X64, aurion-static]
    environment: production
    timeout-minutes: 10
    env:
      EXPECTED_SHA: 6f7dff90a8e0edf71f488d357836216f3f5d8142
      RELEASE_ID: 6f7dff90a8e0edf71f488d357836216f3f5d8142-${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aurion-zone-runtime-${{ env.EXPECTED_SHA }}
          path: runtime-artifact
      - name: Promote with installed root-bounded wrapper
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/promote-aurion-zone-runtime "${GITHUB_WORKSPACE}/runtime-artifact" "${EXPECTED_SHA}" "${RELEASE_ID}"
      - name: Verify local and public exact revision
        run: |
          set -euo pipefail
          local_health="$(curl --fail --silent --show-error http://127.0.0.1:3100/_runtime/healthz)"
          grep -Fq "${EXPECTED_SHA}" <<<"${local_health}"
          printf 'local=%s\n' "${local_health}"
          for attempt in $(seq 1 20); do
            public_health="$(curl --fail --silent --show-error https://arelogic.space/_runtime/healthz 2>/dev/null || true)"
            if grep -Fq "${EXPECTED_SHA}" <<<"${public_health}"; then
              printf 'public=%s\n' "${public_health}"
              exit 0
            fi
            sleep 1
          done
          exit 1
