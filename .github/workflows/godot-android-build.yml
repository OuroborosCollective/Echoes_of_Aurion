name: Godot Android Preview APK
on:
  push:
    branches:
      - main
    paths:
      - 'godot-client/**'
      - 'scripts/godot/**'
      - 'config/godot-toolchain.lock.json'
      - '.github/workflows/godot-android-build.yml'
      - 'Memory.md'
  pull_request:
    paths:
      - 'godot-client/**'
      - 'scripts/godot/**'
      - 'config/godot-toolchain.lock.json'
      - '.github/workflows/godot-android-build.yml'
      - 'Memory.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: APK readback regression
        run: node --test scripts/godot/export-assets.test.mjs scripts/godot/apk-readback.test.mjs scripts/godot/terrain3d-apk-readback.test.mjs scripts/godot/ci-autobuild-workflow.test.mjs scripts/godot/android-app-link.test.mjs scripts/godot/android-gradle-link.test.mjs scripts/godot/android-gradle-stage.test.mjs scripts/godot/gradle-prerequisites.test.mjs scripts/godot/login-gradle-export.test.mjs scripts/godot/login-release-gates.test.mjs
      - name: Install pinned build tools
        run: |
          node scripts/godot/bootstrap.mjs
          node scripts/godot/bootstrap-android.mjs
      - name: Verify pinned Godot Gradle source App Link manifest
        run: node scripts/godot/verify-gradle-template.mjs
      - name: Build and independently inspect APK
        env:
          AURION_EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          AURION_APK_OUTPUT: ${{ runner.temp }}/aurion-apk
        run: node scripts/godot/export-android.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Aurion-Preview-APK-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/aurion-apk/
          if-no-files-found: error
          retention-days: 30

      - name: Provision separate SDK for actual unsigned Login regression
        env:
          AURION_LOGIN_GRADLE_SDK_ROOT: ${{ runner.temp }}/aurion-login-sdk
        run: |
          set -euo pipefail
          mkdir -p "$AURION_LOGIN_GRADLE_SDK_ROOT"
          if [ -d "$ANDROID_HOME/licenses" ]; then cp -R "$ANDROID_HOME/licenses" "$AURION_LOGIN_GRADLE_SDK_ROOT/licenses"; fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$AURION_LOGIN_GRADLE_SDK_ROOT" "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865"
          node --input-type=module <<'NODE'
          import {cp} from 'node:fs/promises';
          import {join} from 'node:path';
          import {androidReport} from './scripts/godot/android-toolchain.mjs';
          const baseline=await androidReport();
          await cp(join(baseline.installation,'sdk/platform-tools'),join(process.env.AURION_LOGIN_GRADLE_SDK_ROOT,'platform-tools'),{recursive:true});
          NODE
      - name: Export real unsigned Login APK and verify packaged App Link
        env:
          AURION_EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          AURION_LOGIN_ALLOW_SIGNED_EXPORT: '1'
          AURION_LOGIN_GRADLE_SDK_ROOT: ${{ runner.temp }}/aurion-login-sdk
          AURION_LOGIN_APK_OUTPUT: ${{ runner.temp }}/aurion-login-regression
          AURION_LOGIN_SIGNER_SHA256: F2:E8:FA:1E:81:FB:DA:E5:2E:94:00:AF:32:29:A0:47:79:8D:EB:BE:A0:CF:36:80:A0:4B:E6:54:0D:EF:72:0A
        run: node scripts/godot/export-login-android.mjs --unsigned
      - name: Preserve actual Login manifest regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aurion-Login-unsigned-regression-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/aurion-login-regression/
          if-no-files-found: warn
          retention-days: 7

