name: Temporary companion causality repair

on:
  push:
    branches:
      - fix/companion-learning-causality-origin-20260828
    paths:
      - ".github/workflows/_companion-causality-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/companion-learning-causality-origin-20260828
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply companion causality repair
        run: python3 scripts/_patch_companion_causality.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test -- client/src/lib/companionLearning.test.ts client/src/lib/companionFrameCapture.test.ts shared/companionLearningProtocol.test.ts
      - run: pnpm build
      - run: git diff --check
      - name: Commit verified repair
        run: |
          git config user.name "aurion-release-bot"
          git config user.email "aurion-release-bot@users.noreply.github.com"
          git add -A
          git commit -m "fix(companion): bind demonstrations to fresh frames and receipts"
          git push origin HEAD:fix/companion-learning-causality-origin-20260828
