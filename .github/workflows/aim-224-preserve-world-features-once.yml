name: AIM224 Preserve Open World Features

on:
  push:
    branches: [fix/aim-224-open-world-mobile-close]
    paths: [.github/workflows/aim-224-preserve-world-features-once.yml]

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply deterministic feature-preservation patch
        run: python scripts/aim224_preserve_open_world_features.py
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify source and focused state contract
        run: |
          set -euo pipefail
          git diff --check
          pnpm check
          pnpm vitest run client/src/pages/Home.openWorldState.test.ts client/src/components/TowerHomePanel.test.tsx
      - name: Install proof browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Configure Playwright-managed Chromium
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("playwright.config.ts")
          text = p.read_text()
          start = text.index("    launchOptions: {")
          end = text.index("    headless: true,", start)
          p.write_text(text[:start] + "    launchOptions: { args: [\"--use-angle=swiftshader\", \"--disable-dev-shm-usage\"] },\n" + text[end:])
          PY
      - name: Re-prove phone and tablet UI after state change
        run: |
          set -euo pipefail
          pnpm exec vite --host 127.0.0.1 --port 3000 >/tmp/aurion-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              pnpm exec playwright test e2e/towerHome.mobile.spec.ts
              exit $?
            fi
            sleep 1
          done
          cat /tmp/aurion-vite.log
          exit 1
      - name: Commit verified product patch
        run: |
          set -euo pipefail
          git checkout -- playwright.config.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/Home.tsx client/src/pages/Home.openWorldState.test.ts
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(open-world): preserve world interactions outside arena mode"
          git push origin HEAD:fix/aim-224-open-world-mobile-close
