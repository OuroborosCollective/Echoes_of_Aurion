name: Temporary Aurion full-container cutover patch

on:
  push:
    branches:
      - fix/aurion-traefik-full-container-cutover-20260829
    paths:
      - ".github/workflows/_aurion-full-container-cutover-patch.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/aurion-traefik-full-container-cutover-20260829
          fetch-depth: 0

      - name: Apply exact workflow patch
        run: python3 scripts/_patch_aurion_full_container_workflow.py

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify full-container cutover contracts
        run: |
          set -euo pipefail
          pnpm check
          pnpm vitest run \
            server/aurionFullContainerCutover.test.ts \
            server/aurionZoneRuntimeSchemaBootstrap.test.ts \
            server/aurionProductionReadbackChain.test.ts
          bash -n deploy/promote-aurion-zone-runtime.sh
          bash -n deploy/promote-aurion-container-runtime.sh
          printf 'DATABASE_URL=mysql://user:pass@mariadb:3306/aurion\nJWT_SECRET=test-only\n' > /tmp/aurion.env
          AURION_IMAGE_TAG=sha-test \
          AURION_RUNTIME_REVISION=0000000000000000000000000000000000000000 \
          AURION_ENV_FILE=/tmp/aurion.env \
          TRAEFIK_NETWORK=areloria_arelorian-network \
          AURION_PRIVATE_NETWORK=echoes-of-aurion-internal \
          docker compose -f docker-compose.traefik.yml config --quiet
          git diff --check

      - name: Remove temporary patch surfaces
        run: |
          rm scripts/_patch_aurion_full_container_workflow.py
          rm .github/workflows/_aurion-full-container-cutover-patch.yml

      - name: Commit verified target change
        run: |
          set -euo pipefail
          git config user.name "Ouroboros Collective"
          git config user.email "projectouroboroscollective@gmail.com"
          git add -A
          git commit -m "fix(runtime): make Traefik full container the only public Aurion runtime"
          git push origin "HEAD:${GITHUB_REF_NAME}"
