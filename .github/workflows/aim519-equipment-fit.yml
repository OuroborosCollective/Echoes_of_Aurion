name: AIM-519 Equipment Fit Compiler

on:
  pull_request:
    paths:
      - ".github/workflows/aim519-equipment-fit.yml"
      - "client/src/xaurion/core/EquipmentFitCompiler.ts"
      - "client/src/xaurion/core/EquipmentFitCompiler.test.ts"
      - "client/src/xaurion/core/VisualItemGeometryCompiler.ts"
      - "client/src/xaurion/core/CanonicalAvatarProfile.ts"
      - "shared/aurionCanonicalAvatarContract.ts"
      - "shared/aurionBrowserHash.ts"
      - "shared/visualItemProtocol.ts"
      - "shared/glbImportContract.ts"
      - "client/src/xaurion/integration/EquipmentCatalogProjection.ts"
      - "client/src/xaurion/integration/aurionEquipmentRuntimeProof.test.ts"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aim-519-equipment-fit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  equipment-fit:
    name: Deterministic armor fit, runtime regression and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove exact checked-out head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Run equipment fit and visual runtime regressions
        run: >-
          pnpm exec vitest run
          client/src/xaurion/core/EquipmentFitCompiler.test.ts
          client/src/xaurion/core/VisualItemGeometryCompiler.test.ts
          client/src/xaurion/core/VisualItemMaterialCompiler.test.ts
          client/src/xaurion/integration/EquipmentCatalogProjection.test.ts
          client/src/xaurion/integration/aurionEquipmentRuntimeProof.test.ts

      - name: TypeScript check
        run: pnpm check

      - name: Build production runtime
        run: pnpm build
