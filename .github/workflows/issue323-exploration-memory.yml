name: Issue 323 Exploration Memory E2E
on:
  pull_request:
    paths:
      - "server/explorationMemoryPersistence.ts"
      - "server/explorationMemoryPersistence.test.ts"
      - "server/worldSlice.ts"
      - "shared/worldSliceProtocol.ts"
      - "scripts/world-slice/**"
      - "godot-client/**"
      - "scripts/godot/**"
      - "server/livingHistoryGodotMariaDb.test.ts"
      - "server/aurionCivilizationHistoryPersistence.ts"
      - "server/aurion/civilizationService.ts"
      - "server/glbSmartUpload.ts"
      - "server/causality/**"
      - "drizzle/aurionCausalitySchema.ts"
      - "shared/aurionCausalTickContract.ts"
      - "shared/worldCausalRootProtocol.ts"
      - "shared/worldChunkProtocol.ts"
      - "server/worldChunkProtocol.ts"
      - "shared/worldIdentity.ts"
      - "server/worldEpochReaction.e2e.test.ts"
      - "server/db.ts"
      - "server/questCompiler/**"
      - "server/questAbortRegression.e2e.test.ts"
      - "server/explorationActorObservation.ts"
      - "server/explorationActorObservation.test.ts"
      - "server/zoneRuntime.ts"
      - "shared/explorationMemoryProtocol.ts"
      - "drizzle/schema.ts"
      - "drizzle/0061_aurion_exploration_memory.sql"
      - "drizzle/0062_aurion_world_director.sql"
      - "drizzle/0063_aurion_npc_information_ecology.sql"
      - "drizzle/0064_aurion_world_entity_foundation.sql"
      - "drizzle/meta/_journal.json"
      - "config/aurion-migration-wave-manifest.json"
      - "server/routers.ts"
      - "client/src/xaurion/integration/ConfirmedChunkProjection.ts"
      - "client/src/xaurion/integration/AurionOpenWorldRuntime.tsx"
      - ".github/workflows/issue323-exploration-memory.yml"
      - "package.json"
      - "pnpm-lock.yaml"
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: auriontest
          MARIADB_DATABASE: aurion_exploration_memory_test
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -pauriontest --silent"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      DATABASE_URL: mysql://root:auriontest@127.0.0.1:3306/aurion_exploration_memory_test
      NODE_ENV: test
      AURION_WORLD_SLICE_GODOT_EDITOR: ${{ github.workspace }}/.aurion-godot/editor/Godot_v4.7.2-stable_linux.x86_64
      # Fixed isolated-test seal key; never a production credential.
      NATIVE_AUTH_STATE_SEAL_KEY: ERERERERERERERERERERERERERERERERERERERERERE
      JWT_SECRET: aurion-world-slice-isolated-fixture-key-never-production
      VITE_APP_ID: aurion-world-slice-isolated-http-fixture
      AURION_EXPLORATION_MEMORY_E2E: "1"
      AURION_WORLD_EPOCH_E2E: "1"
      AURION_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - run: pnpm verify:migrations
      - run: pnpm exec drizzle-kit migrate
      - run: node scripts/godot/bootstrap.mjs
      - run: .aurion-godot/editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot-client --editor --import
      - run: pnpm check
      - run: pnpm exec vitest run server/causality/headlessCausalOracle.test.ts --reporter=verbose
      - run: pnpm exec vitest run server/explorationMemoryPersistence.test.ts server/explorationActorObservation.test.ts server/livingHistoryGodotMariaDb.test.ts --reporter=verbose
      - run: pnpm exec vitest run server/worldEpochReaction.e2e.test.ts --reporter=verbose
      - run: AURION_ORACLE_E2E=1 pnpm exec vitest run server/causality/headlessCausalOracleMariaDb.test.ts --reporter=verbose
      - name: Full repository regression without integration-only environment
        env:
          AURION_EXPLORATION_MEMORY_E2E: "0"
          AURION_WORLD_EPOCH_E2E: "0"
        run: pnpm test
