name: One-shot Aurion production schema dispatch bridge

on:
  push:
    branches:
      - sovereign/aurion-schema-apply-dispatch-e2faafcc-final
    paths:
      - .github/workflows/aurion-production-schema-dispatch-bridge.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: one-shot-aurion-schema-apply-dispatch-e2faafcc-final
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch exact approved production schema apply
    if: >-
      github.repository == 'OuroborosCollective/Echoes_of_Aurion' &&
      github.ref == 'refs/heads/sovereign/aurion-schema-apply-dispatch-e2faafcc-final'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify exact bridge parent, successful ledger run and unchanged main
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REVISION: e2faafccaac6e7bd20c139d676bc737d335927ad
          LEDGER_RUN_ID: "33326153148"
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "OuroborosCollective/Echoes_of_Aurion"
          test "$GITHUB_REF" = "refs/heads/sovereign/aurion-schema-apply-dispatch-e2faafcc-final"

          commit_json="$(mktemp)"
          main_json="$(mktemp)"
          run_json="$(mktemp)"
          cleanup() {
            rm -f "$commit_json" "$main_json" "$run_json"
          }
          trap cleanup EXIT

          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" \
            --output "$commit_json"
          test "$(jq '.parents | length' "$commit_json")" = "1"
          test "$(jq -r '.parents[0].sha' "$commit_json")" = "$EXPECTED_REVISION"

          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main" \
            --output "$main_json"
          test "$(jq -r '.commit.sha' "$main_json")" = "$EXPECTED_REVISION"

          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${LEDGER_RUN_ID}" \
            --output "$run_json"
          test "$(jq -r '.head_sha' "$run_json")" = "$EXPECTED_REVISION"
          test "$(jq -r '.head_branch' "$run_json")" = "main"
          test "$(jq -r '.path' "$run_json")" = ".github/workflows/deploy-aurion-zone-runtime.yml"
          test "$(jq -r '.status' "$run_json")" = "completed"
          test "$(jq -r '.conclusion' "$run_json")" = "success"

      - name: Dispatch exact ledger and plan
        env:
          GH_TOKEN: ${{ github.token }}
          LEDGER_RUN_ID: "33326153148"
          PLAN_SHA256: "4f9ea6891ad3415e6312c2445b2ae14ce1e62718f581fdbc1fd6af7ab2207aa1"
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          cleanup() {
            rm -f "$response_file"
          }
          trap cleanup EXIT

          request_body="$(jq -cn \
            --arg ledger_run_id "$LEDGER_RUN_ID" \
            --arg plan_sha256 "$PLAN_SHA256" \
            '{ref:"main",inputs:{ledger_run_id:$ledger_run_id,plan_sha256:$plan_sha256}}')"
          status="$(curl --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$request_body" \
            --output "$response_file" \
            --write-out '%{http_code}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/aurion-production-schema-apply.yml/dispatches")"
          test "$status" = "204"
          test ! -s "$response_file"
