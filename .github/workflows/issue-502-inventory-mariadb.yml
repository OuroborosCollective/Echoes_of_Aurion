name: AIM-502 Inventory MariaDB Concurrency

on:
  pull_request:
    paths:
      - "server/aurionInventoryBackendAdapter.ts"
      - "server/aurionInventoryBackendAdapter.mariadb.test.ts"
      - "server/aurionInventoryTransactionProtocol.ts"
      - "server/aurionInventoryStackIdentity.ts"
      - "server/playerUiPersistence.ts"
      - "server/confirmedEquipmentVisualReadback.ts"
      - "server/confirmedEquipmentVisualReadback.mariadb.test.ts"
      - "e2e/issue502.inventory.spec.ts"
      - "server/playerUiMariaDb.test.ts"
      - "server/routers.ts"
      - "server/db.ts"
      - "shared/playerUiProtocol.ts"
      - "drizzle/**"
      - ".github/workflows/issue-502-inventory-mariadb.yml"
  push:
    branches: [main]
    paths:
      - "server/aurionInventoryBackendAdapter.ts"
      - "server/aurionInventoryBackendAdapter.mariadb.test.ts"
      - "server/aurionInventoryTransactionProtocol.ts"
      - "server/aurionInventoryStackIdentity.ts"
      - "server/playerUiPersistence.ts"
      - "e2e/issue502.inventory.spec.ts"
      - "drizzle/**"
      - ".github/workflows/issue-502-inventory-mariadb.yml"

permissions:
  contents: read

jobs:
  mariadb:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: auriontest
          MARIADB_DATABASE: aurion_ui_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -pauriontest --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    env:
      DATABASE_URL: mysql://root:auriontest@127.0.0.1:3306/aurion_ui_test
      NODE_ENV: test
      JWT_SECRET: issue502-ci-disposable-never-production
      VITE_APP_ID: issue502-ci
      AURION_INVENTORY_DB_E2E: "1"
      AURION_UI_E2E: "1"
      AURION_TEST_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AURION_TEST_SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "$AURION_TEST_SOURCE_SHA"
      - name: Enable project package manager
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          pnpm --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify migration chain and apply complete schema
        run: |
          set -euo pipefail
          pnpm verify:migrations
          pnpm exec drizzle-kit migrate
          node --input-type=module <<'NODE'
          import mysql from "mysql2/promise";
          const connection = await mysql.createConnection(process.env.DATABASE_URL);
          try {
            const [dbRows] = await connection.query("SELECT DATABASE() AS databaseName");
            const [itemRows] = await connection.query("SHOW TABLES LIKE 'itemInstances'");
            const [v2Rows] = await connection.query("SHOW TABLES LIKE 'aurionItemInstancesV2'");
            const [receiptRows] = await connection.query("SHOW TABLES LIKE 'aurionInventoryReceipts'");
            if (!dbRows?.[0]?.databaseName || itemRows.length !== 1 || v2Rows.length !== 1 || receiptRows.length !== 1) {
              throw new Error(JSON.stringify({ database: dbRows?.[0]?.databaseName ?? null, itemInstances: itemRows.length, aurionItemInstancesV2: v2Rows.length, aurionInventoryReceipts: receiptRows.length }));
            }
            console.log(JSON.stringify({ recordType: "aurion_502_schema_readback", ok: true, database: dbRows[0].databaseName, itemInstances: itemRows.length, aurionItemInstancesV2: v2Rows.length, aurionInventoryReceipts: receiptRows.length }));
          } finally {
            await connection.end();
          }
          NODE

      - name: Verify real inventory concurrency and rollback
        run: pnpm exec vitest run server/aurionInventoryBackendAdapter.mariadb.test.ts --no-file-parallelism
      - name: Verify existing UI/equipment database regressions
        run: pnpm exec vitest run server/playerUiMariaDb.test.ts server/confirmedEquipmentVisualReadback.mariadb.test.ts --no-file-parallelism
      - name: Build exact browser runtime
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start exact browser runtime
        run: |
          set -euo pipefail
          HOST=127.0.0.1 PORT=3000 STRICT_PORT=true NODE_ENV=production node dist/index.js >/tmp/issue-502-browser.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/issue-502-browser.log
          exit 1
      - name: Verify authenticated browser inventory evidence
        run: pnpm exec playwright test e2e/issue502.inventory.spec.ts --workers=1
      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-502-browser-evidence
          path: |
            test-results/
            /tmp/issue-502-browser.log
          if-no-files-found: warn
