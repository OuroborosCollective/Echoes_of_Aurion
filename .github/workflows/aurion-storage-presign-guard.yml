name: Aurion Private Storage Presign Guard

on:
  pull_request:
    paths:
      - "server/_core/storageAccessPolicy.ts"
      - "server/_core/storageAccessPolicy.test.ts"
      - "server/_core/storageProxy.ts"
      - ".github/workflows/aurion-storage-presign-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-storage-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run server/_core/storageAccessPolicy.test.ts --reporter=verbose
      - run: pnpm check
