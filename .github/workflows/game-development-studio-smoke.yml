name: Game Development Studio Smoke

on:
  pull_request:
    paths:
      - "scripts/install-game-development-studio.mjs"
      - ".github/workflows/game-development-studio-smoke.yml"
      - "server/gameDevelopmentStudioRuntime.ts"
      - "server/gameDevelopmentStudioRuntime.test.ts"
      - "server/gameDevelopmentStudioProduction.ts"
      - "server/gameDevelopmentStudioProduction.test.ts"
      - "server/devControlGdsBridge.ts"
      - "server/devControlGdsBridge.test.ts"
      - "server/devControlGdsBridge.runtime.test.ts"
      - "server/devControlChannel.ts"
      - "server/devControlChannel.test.ts"
      - "server/devControlProtocol.ts"
      - "server/adminMcpRoute.test.ts"
      - "server/openSource3dFallback.ts"
      - "server/openSource3dFallback.test.ts"
      - "shared/os3aFallbackCatalog.json"
      - "shared/glbPresentationBudget.ts"
      - "shared/glbExternalProvenanceContract.ts"
      - "drizzle/0055_aurion_glb_external_provenance.sql"
      - "drizzle/0056_aurion_temporal_history_v1.sql"
      - "drizzle/0057_aurion_economic_ledger_v2.sql"
      - "drizzle/0058_aurion_quest_causal_anchor.sql"
      - "server/liveDeveloperGenkit.ts"
      - "server/liveDeveloperProtocol.ts"
      - "server/liveDeveloperProtocol.test.ts"
      - "server/routers.ts"
      - "client/src/components/GameDevelopmentStudioWorkbench.tsx"
      - "client/src/pages/Operations.tsx"
      - "docker-compose.traefik.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-game-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Install and verify pinned Game Development Studio
        run: node scripts/install-game-development-studio.mjs
      - name: Install exact Aurion dependency graph
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Prove productive GDS authority boundaries
        run: |
          pnpm exec vitest run \
            server/gameDevelopmentStudioRuntime.test.ts \
            server/gameDevelopmentStudioProduction.test.ts \
            server/openSource3dFallback.test.ts \
            server/liveDeveloperProtocol.test.ts             server/devControlGdsBridge.test.ts             server/devControlGdsBridge.runtime.test.ts             server/devControlGdsBridge.realGds.test.ts
          pnpm check
      - name: Validate production compose with persistent GDS workspace
        env:
          AURION_IMAGE_TAG: ci
          AURION_ENV_FILE: /tmp/aurion-ci.env
          AURION_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AURION_BUILD_INPUT_DIGEST: sha256:1111111111111111111111111111111111111111111111111111111111111111
          AURION_ARTIFACT_DIGEST: sha256:2222222222222222222222222222222222222222222222222222222222222222
          AURION_RUNTIME_IMAGE_DIGEST: sha256:3333333333333333333333333333333333333333333333333333333333333333
          AURION_RELEASE_ARCHIVE_DIGEST: sha256:4444444444444444444444444444444444444444444444444444444444444444
        run: |
          : > "$AURION_ENV_FILE"
          docker compose -f docker-compose.traefik.yml config > /tmp/aurion-compose.yml
          grep -Fq "echoes-of-aurion-game-dev-workspace" /tmp/aurion-compose.yml
          grep -Fq "/var/lib/aurion/game-dev-workspace" /tmp/aurion-compose.yml
