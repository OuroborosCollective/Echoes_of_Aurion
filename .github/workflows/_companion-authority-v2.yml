name: Temporary Companion authority v2

on:
  push:
    branches:
      - fix/companion-learning-integrity-20260828
    paths:
      - ".github/workflows/_companion-authority-v2.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/companion-learning-integrity-20260828
          fetch-depth: 0
      - name: Integrate current main without publishing partial state
        run: |
          git config user.name "aurion-release-bot"
          git config user.email "aurion-release-bot@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply receipt-bound Companion authority patch
        run: python3 scripts/_apply_companion_authority_v2.py
      - run: pnpm install --frozen-lockfile
      - name: Type contract
        run: pnpm check
      - name: Focused Companion contracts
        run: pnpm vitest run client/src/companionLearningProtocol.test.ts client/src/lib/companionLearning.test.ts client/src/lib/companionFrameCapture.test.ts client/src/game/sceneCompanionAuthority.test.ts server/companionMemory.test.ts
      - name: Full regression suite
        run: pnpm test
      - name: Production bundle
        run: pnpm build
      - name: Diff whitespace
        run: git diff --check
      - name: Commit and publish only the verified candidate
        run: |
          git add -A
          git commit -m "fix(companion): require receipts before gameplay presentation"
          git push origin HEAD:fix/companion-learning-integrity-20260828
