name: Aurion Investigation Journal
on:
  pull_request:
    paths:
      - "client/src/components/InvestigationJournalModal*"
      - "client/src/components/ui/dialog.tsx"
      - "client/src/xaurion/components/GameHUD.tsx"
      - "client/src/xaurion/components/MobileGameHUD.tsx"
      - "client/src/xaurion/components/hud/**"
      - "client/src/xaurion/integration/AurionAuthorityHud.tsx"
      - "server/investigationJournal*.ts"
      - "server/routers.ts"
      - "shared/investigation*Protocol*"
      - "shared/investigationClientContract.ts"
      - "shared/rumorProjectionProtocol*"
      - ".github/workflows/aurion-investigation-journal.yml"
      - "package.json"
      - "pnpm-lock.yaml"
permissions:
  contents: read
jobs:
  journal-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Journal and neighboring protocol regressions
        run: pnpm exec vitest run client/src/components/InvestigationJournalModal.test.tsx shared/investigationJournalProtocol.test.ts shared/investigationGraphProtocol.test.ts server/causalRumorInvestigationEvidence.test.ts server/investigationJournalRouter.test.ts
      - name: Typecheck
        run: pnpm check
