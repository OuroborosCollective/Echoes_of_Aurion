name: Aurion Visual Comparator UNIT (synthetic only, NOT live parity)

on:
  pull_request:
    paths:
      - "scripts/godot/live_visual_parity.py"
      - "scripts/godot/test_live_visual_parity.py"
      - ".github/workflows/aurion-live-visual-parity.yml"
      - ".github/workflows/aurion-live-visual-parity-unit.yml"

permissions:
  contents: read

jobs:
  comparator-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "Pillow>=10,<12"
      - name: Synthetic checks of fail-closed comparison code, never production evidence
        run: python -m unittest discover -s scripts/godot -p "test_live_visual_parity.py" -v
