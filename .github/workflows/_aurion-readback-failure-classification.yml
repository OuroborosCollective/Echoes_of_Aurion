name: Temporary Aurion readback failure classification patch

on:
  push:
    branches:
      - fix/aurion-readback-safe-error-classification-20260828
    paths:
      - ".github/workflows/_aurion-readback-failure-classification.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/aurion-readback-safe-error-classification-20260828
          fetch-depth: 0

      - name: Apply exact receipt patch
        run: python3 scripts/_patch_aurion_readback_failure_receipt.py

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify classifier and reconciliation bundle
        env:
          AURION_RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pnpm check
          pnpm vitest run \
            server/aurionProductionReadbackFailure.test.ts \
            server/aurionProductionSchemaReconciliation.test.ts
          node scripts/build-aurion-production-reconcile-artifact.mjs
          (cd dist-production-reconcile && sha256sum --strict -c checksums.sha256)
          git diff --check
          test "$(git diff --name-only)" = "scripts/reconcile-aurion-production-schema.ts"

      - name: Commit verified target change
        run: |
          set -euo pipefail
          git config user.name "Ouroboros Collective"
          git config user.email "projectouroboroscollective@gmail.com"
          git add scripts/reconcile-aurion-production-schema.ts
          git commit -m "fix(db): expose secret-safe production readback failure category"
          git push origin "HEAD:${GITHUB_REF_NAME}"
