name: Regenerate AIM-265 candidate

on:
  push:
    branches: [feat/599-deterministic-terrain-pipeline]
    paths:
      - .github/workflows/_oneoff-aim265-regenerate.yml
permissions:
  contents: write
# one-shot deterministic fixture regeneration

jobs:
  regenerate:
    if: github.event.head_commit.message != 'chore: regenerate AIM-265 balancing candidate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --import tsx scripts/balancing/replay-aim265.mjs docs/balancing/aim265-candidate.json
      - run: git diff --check
      - name: Commit regenerated candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/balancing/aim265-candidate.json
          if git diff --cached --quiet; then
            echo "AIM265 candidate already matches current protocols"
            exit 0
          fi
          git commit -m "chore: regenerate AIM-265 balancing candidate"
          git push origin HEAD:feat/599-deterministic-terrain-pipeline
