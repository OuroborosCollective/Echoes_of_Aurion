name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "client/**"
      - "shared/**"
      - "scripts/**"
      - "capacitor.config.ts"
      - "vite.itch.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-apk.yml"
  push:
    branches: [main]
    paths:
      - "client/**"
      - "shared/**"
      - "scripts/**"
      - "capacitor.config.ts"
      - "vite.itch.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  package-debug-apk:
    name: Package Aurion debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-node evaluates `cache: pnpm` immediately, so pnpm must already be on PATH.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build budget-checked HTML5 client
        env:
          # Owner-approved temporary Android-only deferral. The trailer becomes
          # mandatory again after the complete migration; every other manifest
          # asset remains hash-bound by the verification step below.
          AURION_ALLOW_MISSING_RELEASE_ASSETS: "true"
        run: pnpm build:itch

      - name: Verify non-deferred Android release assets
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile, stat } from "node:fs/promises";
          import path from "node:path";

          const deferredTrailer = "aurion-hero-trailer-en-de_c44ee2e1.mp4";
          const manifest = JSON.parse(await readFile("shared/releaseAssetIntegrity.json", "utf8"));
          if (manifest.schemaVersion !== 1 || !Array.isArray(manifest.assets) || manifest.assets.length === 0) {
            throw new Error("Android release asset manifest is invalid or empty.");
          }
          if (!manifest.assets.some((asset) => asset.target === deferredTrailer)) {
            throw new Error(`Deferred Android trailer is not present in the immutable manifest: ${deferredTrailer}`);
          }

          for (const asset of manifest.assets) {
            if (asset.target === deferredTrailer) {
              console.log(`android_release_asset_deferred target=${asset.target} reason=owner-approved-until-post-migration`);
              continue;
            }
            const outputPath = path.join("dist", "itch", "aurion-assets", asset.target);
            const fileStat = await stat(outputPath);
            if (fileStat.size !== asset.bytes) {
              throw new Error(`${asset.target}: Android package byte mismatch; expected ${asset.bytes}, observed ${fileStat.size}.`);
            }
            const digest = createHash("sha256").update(await readFile(outputPath)).digest("hex");
            if (digest !== asset.sha256) {
              throw new Error(`${asset.target}: Android package SHA-256 mismatch; expected ${asset.sha256}, observed ${digest}.`);
            }
            console.log(`android_release_asset_verified target=${asset.target} bytes=${asset.bytes} sha256=${asset.sha256}`);
          }
          NODE

      - name: Create and synchronize Android shell
        run: |
          if [ ! -d android ]; then pnpm exec cap add android; fi
          pnpm exec cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: echoes-of-aurion-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
