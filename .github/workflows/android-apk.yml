name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "shared/**"
      - "scripts/**"
      - "capacitor.config.ts"
      - "vite.itch.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  package-debug-apk:
    name: Package Aurion debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build budget-checked HTML5 client
        run: pnpm build:itch

      - name: Create and synchronize Android shell
        run: |
          if [ ! -d android ]; then pnpm exec cap add android; fi
          pnpm exec cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: echoes-of-aurion-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
