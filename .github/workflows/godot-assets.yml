name: Godot 3D source asset audit
on:
  pull_request:
    paths:
      - 'assets/**'
      - 'godot-client/**'
      - 'scripts/godot/**'
      - 'scripts/glb_shipping_contract.py'
      - 'shared/aurionMonsterAssetRegistry.ts'
      - 'config/godot-toolchain.lock.json'
      - '.github/workflows/godot-assets.yml'
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'godot-client/**'
      - 'scripts/godot/**'
      - 'scripts/glb_shipping_contract.py'
      - 'shared/aurionMonsterAssetRegistry.ts'
      - 'config/godot-toolchain.lock.json'
      - '.github/workflows/godot-assets.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import-and-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AURION_EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      AURION_ASSET_EVIDENCE: .aurion-godot/asset-evidence
      AURION_PREPARED_ASSET_MANIFEST: godot-client/assets/generated/manifest.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source inventory and hostile-input regressions
        run: node --test scripts/godot/audit-assets.test.mjs
      - name: Deterministic Godot compatibility outputs
        run: |
          node --test scripts/godot/prepare-assets.test.mjs
          node scripts/godot/prepare-assets.mjs
          mkdir -p "$AURION_ASSET_EVIDENCE"
          cp "$AURION_PREPARED_ASSET_MANIFEST" "$AURION_ASSET_EVIDENCE/preparation-first.json"
          node scripts/godot/prepare-assets.mjs
          cmp "$AURION_PREPARED_ASSET_MANIFEST" "$AURION_ASSET_EVIDENCE/preparation-first.json"
      - name: Install verified pinned Godot editor
        run: node scripts/godot/bootstrap.mjs
      - name: Real GLTF imports, skeleton motion and causal negative controls
        run: node scripts/godot/asset-import-runtime.mjs
      - name: Verify confirmed actor component with real imported models
        run: |
          node --test scripts/godot/actor-runtime.test.mjs
          node scripts/godot/actor-runtime.mjs
      - name: Render actual source meshes and two Walk poses with software OpenGL
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
          xvfb-run -a -s '-screen 0 1280x1024x24' node scripts/godot/asset-import-runtime.mjs --render
          xvfb-run -a -s '-screen 0 1280x720x24' node scripts/godot/actor-runtime.mjs --render
      - name: Preserve source-bound asset evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-3d-source-assets-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .aurion-godot/asset-evidence/*.json
            .aurion-godot/asset-evidence/*.log
            .aurion-godot/asset-evidence/renders/*.png
            godot-client/assets/generated/manifest.json
            .aurion-godot/actor-evidence/
          if-no-files-found: error
          retention-days: 14
