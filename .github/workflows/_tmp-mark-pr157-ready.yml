name: Temporary mark Aurion PR 157 ready

on:
  push:
    branches:
      - fix/aurion-openhands-runner-temp-context

permissions:
  contents: read
  pull-requests: write

jobs:
  ready:
    if: github.repository == 'OuroborosCollective/Echoes_of_Aurion'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Mark exact PR ready
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          pr_json="$(gh api repos/OuroborosCollective/Echoes_of_Aurion/pulls/157)"
          test "$(jq -r '.draft' <<<"$pr_json")" = "true"
          test "$(jq -r '.head.sha' <<<"$pr_json")" = "$EXPECTED_HEAD"
          node_id="$(jq -r '.node_id' <<<"$pr_json")"
          test -n "$node_id"
          gh api graphql \
            -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{number isDraft headRefOid}}}' \
            -F id="$node_id" \
            --jq '.data.markPullRequestReadyForReview.pullRequest | select(.number==157 and .isDraft==false and .headRefOid==env.EXPECTED_HEAD)'
