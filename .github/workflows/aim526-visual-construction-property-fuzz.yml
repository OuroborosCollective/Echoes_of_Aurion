name: AIM-526 Visual Construction Property Fuzz

on:
  pull_request:
    paths:
      - ".github/workflows/aim526-visual-construction-property-fuzz.yml"
      - "client/src/xaurion/core/VisualConstructionPropertyFuzz.test.ts"
      - "client/src/xaurion/core/VisualConstructionRuntimeCache.ts"
      - "client/src/xaurion/core/VisualItemMorphologyCompiler.ts"
      - "client/src/xaurion/core/VisualItemGeometryCompiler.ts"
      - "client/src/xaurion/core/VisualItemMaterialCompiler.ts"
      - "client/src/xaurion/core/VisualItemGlbOverrideResolver.ts"
      - "client/src/xaurion/core/VisualItemAttachmentController.ts"
      - "client/src/xaurion/core/EquipmentFitCompiler.ts"
      - "client/src/xaurion/core/EquipmentSkinningCompiler.ts"
      - "shared/visualItemProtocol.ts"
      - "shared/aurionCanonicalAvatarContract.ts"
      - "shared/glbImportContract.ts"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aim-526-visual-property-fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  property-fuzz:
    name: Deterministic visual property and fuzz gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove exact checked-out head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Run canonical property and fuzz suite
        run: >-
          pnpm exec vitest run
          client/src/xaurion/core/VisualConstructionPropertyFuzz.test.ts
          client/src/xaurion/core/VisualConstructionRuntimeCache.test.ts
          client/src/xaurion/core/EquipmentFitCompiler.test.ts
          client/src/xaurion/core/EquipmentSkinningCompiler.test.ts
          client/src/xaurion/core/VisualItemGeometryCompiler.test.ts
          client/src/xaurion/core/VisualItemMaterialCompiler.test.ts
          client/src/xaurion/core/VisualItemGlbOverrideResolver.test.ts
          client/src/xaurion/core/VisualItemAttachmentController.test.ts
          client/src/xaurion/integration/EquipmentCatalogProjection.test.ts
          client/src/xaurion/integration/aurionEquipmentRuntimeProof.test.ts

      - name: TypeScript check
        run: pnpm check

      - name: Build production runtime
        run: pnpm build
