name: Apply companion learning evidence fix

on:
  push:
    branches:
      - fix/companion-learning-evidence-20260828

permissions:
  contents: write

concurrency:
  group: apply-companion-learning-evidence-fix
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Guard repository and branch
        run: |
          test "${GITHUB_REPOSITORY}" = "OuroborosCollective/Echoes_of_Aurion"
          test "${GITHUB_REF_NAME}" = "fix/companion-learning-evidence-20260828"

      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/companion-learning-evidence-20260828

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Repair patcher type-only return
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply_companion_learning_evidence_fix.py")
          source = path.read_text(encoding="utf-8")
          old = '.catch(() => respond({ requestId: detail.requestId, error: "capture_failed" }));'
          new = '.catch(() => {\n          respond({ requestId: detail.requestId, error: "capture_failed" });\n        });'
          if source.count(old) != 1:
              raise SystemExit("expected exactly one patcher return expression")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Apply deterministic source patch
        run: python3 scripts/apply_companion_learning_evidence_fix.py

      - name: Format touched files
        run: |
          pnpm exec prettier --write \
            client/src/components/GameCanvas.tsx \
            client/src/lib/companionFrameCapture.ts \
            client/src/lib/companionFrameCapture.test.ts \
            client/src/lib/companionLearning.ts \
            client/src/lib/companionLearning.test.ts \
            client/src/pages/Home.tsx

      - name: Verify companion contracts
        run: |
          set -euo pipefail
          pnpm check
          pnpm vitest run \
            client/src/lib/companionLearning.test.ts \
            client/src/lib/companionFrameCapture.test.ts
          git diff --check

      - name: Commit verified fix to the same branch
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No source changes remain to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(companion): bind learning samples to real frames"
          git push origin HEAD:fix/companion-learning-evidence-20260828
