name: Aurion zone promote one-shot 2026-08-28

on:
  push:
    branches:
      - aurion/migration-truth-snapshot-20260828

concurrency:
  group: aurion-zone-promote-one-shot-20260828
  cancel-in-progress: false

permissions:
  contents: read

env:
  EXPECTED_MAIN_SHA: c0ad8967046c52141cf1b5f69874a0c53117fbe2

jobs:
  verify-and-build:
    name: Verify and build exact main zone runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Guard scope
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "OuroborosCollective/Echoes_of_Aurion"
          test "${GITHUB_REF_NAME}" = "aurion/migration-truth-snapshot-20260828"

      - name: Check out exact main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN_SHA }}
          fetch-depth: 0

      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_MAIN_SHA}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify exact source revision
        run: |
          set -euo pipefail
          pnpm check
          pnpm test
          git diff --check

      - name: Build immutable zone artifact
        run: |
          set -euo pipefail
          pnpm build:zone-runtime
          printf '{"revision":"%s","runId":"%s","artifact":"aurion-zone-runtime"}\n' \
            "${EXPECTED_MAIN_SHA}" "${GITHUB_RUN_ID}" > dist-zone/.aurion-zone-runtime-release.json
          tar -C dist-zone -czf aurion-zone-runtime-release.tgz .
          sha256sum aurion-zone-runtime-release.tgz > aurion-zone-runtime-release.tgz.sha256

      - name: Publish exact artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurion-zone-runtime-${{ env.EXPECTED_MAIN_SHA }}
          path: |
            aurion-zone-runtime-release.tgz
            aurion-zone-runtime-release.tgz.sha256
            deploy/aurion-zone-runtime.service
            deploy/aurion-zone-runtime.environment.template
            deploy/arelogic-zone-runtime.nginx.conf
            deploy/arelogic-zone-runtime-rate-limit.nginx.conf
            deploy/promote-aurion-zone-runtime.sh
          if-no-files-found: error
          retention-days: 30

  promote:
    name: Promote exact main zone runtime
    needs: verify-and-build
    runs-on: [self-hosted, Linux, X64, aurion-static]
    environment: production
    timeout-minutes: 10
    env:
      RELEASE_ID: c0ad8967046c52141cf1b5f69874a0c53117fbe2-${{ github.run_id }}
      EXPECTED_SHA: c0ad8967046c52141cf1b5f69874a0c53117fbe2
    steps:
      - name: Guard scope
        run: test "${GITHUB_REPOSITORY}" = "OuroborosCollective/Echoes_of_Aurion"

      - name: Download verified artifact
        uses: actions/download-artifact@v4
        with:
          name: aurion-zone-runtime-${{ env.EXPECTED_SHA }}
          path: runtime-artifact

      - name: Promote through installed root-bounded wrapper
        run: |
          set -euo pipefail
          artifact="${GITHUB_WORKSPACE}/runtime-artifact"
          sudo /usr/local/sbin/promote-aurion-zone-runtime "${artifact}" "${EXPECTED_SHA}" "${RELEASE_ID}"

      - name: Verify local and public exact revision
        run: |
          set -euo pipefail
          local_health="$(curl --fail --silent --show-error http://127.0.0.1:3100/_runtime/healthz)"
          grep -Fq "${EXPECTED_SHA}" <<<"${local_health}"
          printf 'local=%s\n' "${local_health}"
          public_ready=0
          for _attempt in $(seq 1 20); do
            if public_health="$(curl --fail --silent --show-error https://arelogic.space/_runtime/healthz 2>/dev/null)"; then
              if grep -Fq "${EXPECTED_SHA}" <<<"${public_health}"; then
                printf 'public=%s\n' "${public_health}"
                public_ready=1
                break
              fi
            fi
            sleep 1
          done
          [[ "$public_ready" -eq 1 ]]
