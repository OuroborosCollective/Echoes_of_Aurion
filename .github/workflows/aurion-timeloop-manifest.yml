name: Aurion Timeloop Manifest Gate

on:
  pull_request:
    paths:
      - "tools/timeloop/**"
      - "package.json"
      - ".github/workflows/aurion-timeloop-manifest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify Timeloop provenance boundary
        run: node tools/timeloop/verify-manifest.mjs
