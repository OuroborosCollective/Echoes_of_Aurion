name: Aurion OpenCourant BoxLite runtime proof

on:
  pull_request:
    paths:
      - ".github/workflows/aurion-opencourant-boxlite-runtime-proof.yml"
      - "scripts/run-opencourant-boxlite.py"
      - "server/aurionOpenCourantBoxliteAdapter.ts"
      - "server/aurionOpenCourantBoxliteAdapter.test.ts"
      - "shared/aurionImpactBakeProtocol.ts"
      - "docs/architecture/AURION_OPENCOURANT_BOXLITE_WORLD_IMPACT.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/aurion-opencourant-boxlite-runtime-proof.yml"
      - "scripts/run-opencourant-boxlite.py"
      - "server/aurionOpenCourantBoxliteAdapter.ts"
      - "shared/aurionImpactBakeProtocol.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boxlite-opencourant-runtime:
    name: BoxLite KVM + OpenCourant runtime smoke
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENCOURANT_RELEASE_COMMIT: 33e685176cccf0c539a3ce07aa2096985a284e2a
      OPENCOURANT_RELEASE_TAG: latest-20261006
      OPENCOURANT_PACKAGE_HASH: sha256:905bd73b4daf5c7762c18a50d4dc5db4c06b496811e6e0ab27c583d04578bd66
      BOXLITE_VERSION: 0.10.5
      BOXLITE_BASE_TAG: v0.1.0
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Require real KVM access
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          python3 -c "open('/dev/kvm','rb').close(); print('KVM_READBACK_OK')"

      - name: Install pinned BoxLite
        shell: bash
        run: |
          set -euo pipefail
          VENV="${RUNNER_TEMP}/aurion-boxlite-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 -m venv "${VENV}"
          "${VENV}/bin/pip" install --disable-pip-version-check "boxlite==${BOXLITE_VERSION}"
          "${VENV}/bin/python" -c "import boxlite; print('BOXLITE_IMPORT_OK')"
          echo "BOXLITE_PYTHON=${VENV}/bin/python" >> "${GITHUB_ENV}"

      - name: Diagnose host namespace boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          for key in kernel/apparmor_restrict_unprivileged_userns kernel/unprivileged_userns_clone user/max_user_namespaces; do
            if test -f "/proc/sys/${key}"; then
              echo "${key}=$(cat "/proc/sys/${key}")"
            fi
          done
          "${BOXLITE_PYTHON}" - <<'PYTHON'
          import boxlite
          import pathlib
          import shutil
          import subprocess
          root = pathlib.Path(boxlite.__file__).parent
          paths = list(root.rglob("bwrap"))
          if shutil.which("bwrap"):
              paths.insert(0, pathlib.Path(shutil.which("bwrap")))
          for path in paths:
              probe = subprocess.run([str(path), "--unshare-user", "--ro-bind", "/", "/", "--", "true"], capture_output=True, text=True)
              print(f"BWRAP_PROBE path={path} exit={probe.returncode} stderr={probe.stderr.strip()}", flush=True)
          print(f"BWRAP_CANDIDATES={len(paths)}", flush=True)
          PYTHON
          sudo journalctl -k --since '-5 minutes' --no-pager | tail -80

      - name: Install distribution Bubblewrap and require namespace isolation
        shell: bash
        run: |
          set -euo pipefail
          # BoxLite 0.10.5 prefers PATH bwrap. Ubuntu's distribution binary has
          # the matching AppArmor userns profile; never disable host restrictions.
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          command -v bwrap
          bwrap --version
          bwrap --unshare-user --ro-bind / / -- true
          echo BWRAP_USERNS_READBACK_OK

      - name: Resolve BoxLite base to immutable GHCR digest
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(curl -fsSL 'https://ghcr.io/token?scope=repository:boxlite-ai/boxlite-agent-base:pull' | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
          DIGEST="$(curl -fsSI \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json' \
            "https://ghcr.io/v2/boxlite-ai/boxlite-agent-base/manifests/${BOXLITE_BASE_TAG}" \
            | tr -d '\r' \
            | awk 'tolower($1)=="docker-content-digest:" {print $2}' \
            | tail -n 1)"
          echo "${DIGEST}" | grep -Eq '^sha256:[a-f0-9]{64}$'
          echo "BOXLITE_PROOF_IMAGE=ghcr.io/boxlite-ai/boxlite-agent-base@${DIGEST}" >> "${GITHUB_ENV}"

      - name: Fetch exact OpenCourant package and MiniQA deck pair
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${GITHUB_WORKSPACE}/.tmp/opencourant-smoke"
          mkdir -p "${ROOT}"
          PACKAGE="${ROOT}/OpenCourant_linux64.zip"
          curl -fsSL -L \
            "https://github.com/OpenCourant/OpenCourant/releases/download/${OPENCOURANT_RELEASE_TAG}/OpenCourant_linux64.zip" \
            -o "${PACKAGE}"
          test "sha256:$(sha256sum "${PACKAGE}" | awk '{print $1}')" = "${OPENCOURANT_PACKAGE_HASH}"
          BASE="https://raw.githubusercontent.com/OpenCourant/OpenCourant/${OPENCOURANT_RELEASE_COMMIT}/qa-tests/miniqa/ACCELEROMETRES/data"
          curl -fsSL "${BASE}/ACCELERO_0000.rad" -o "${ROOT}/ACCELERO_0000.rad"
          curl -fsSL "${BASE}/ACCELERO_0001.rad" -o "${ROOT}/ACCELERO_0001.rad"
          echo "OPENCOURANT_PACKAGE_PATH=${PACKAGE}" >> "${GITHUB_ENV}"
          echo "AURION_STARTER_DECK_HASH=sha256:$(sha256sum "${ROOT}/ACCELERO_0000.rad" | awk '{print $1}')" >> "${GITHUB_ENV}"
          echo "AURION_ENGINE_DECK_HASH=sha256:$(sha256sum "${ROOT}/ACCELERO_0001.rad" | awk '{print $1}')" >> "${GITHUB_ENV}"

      - name: Execute verified OpenCourant package inside BoxLite micro-VM
        shell: bash
        run: |
          set -euo pipefail
          export AURION_IMPACT_WORK_ID="ci.opencourant.smoke"
          export AURION_SOURCE_REVISION="${SOURCE_SHA}"
          export AURION_LOGICAL_TICK="0"
          export AURION_SCENARIO="MATERIAL_CALIBRATION"
          export OPENCOURANT_COMMIT="${OPENCOURANT_RELEASE_COMMIT}"
          export BOXLITE_IMAGE="${BOXLITE_PROOF_IMAGE}"
          export BOXLITE_CPUS="2"
          export BOXLITE_MEMORY_MIB="4096"
          "${BOXLITE_PYTHON}" scripts/run-opencourant-boxlite.py \
            --starter-deck .tmp/opencourant-smoke/ACCELERO_0000.rad \
            --engine-deck .tmp/opencourant-smoke/ACCELERO_0001.rad \
            --solver-package "${OPENCOURANT_PACKAGE_PATH}" \
            --output .aurion-impact-results/ci.opencourant.smoke

      - name: Read back solver evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s .aurion-impact-results/ci.opencourant.smoke/runtime-evidence.json
          grep -R -q "NORMAL TERMINATION" .aurion-impact-results/ci.opencourant.smoke/solver-work
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(".aurion-impact-results/ci.opencourant.smoke/runtime-evidence.json")
          data = json.loads(path.read_text())
          assert data["protocol"] == "aurion.world-impact-bake.runtime-evidence.v1"
          assert data["boxliteImage"].startswith("ghcr.io/boxlite-ai/boxlite-agent-base@sha256:")
          assert data["solverPackageHash"] == "sha256:905bd73b4daf5c7762c18a50d4dc5db4c06b496811e6e0ab27c583d04578bd66"
          assert data["solverCommit"] == "33e685176cccf0c539a3ce07aa2096985a284e2a"
          assert data["boxliteVersion"] == "0.10.5"
          assert data["sourceRevision"] == os.environ["SOURCE_SHA"]
          print(json.dumps(data, sort_keys=True))
          PY

      - name: Upload bounded runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: aurion-opencourant-boxlite-${{ github.sha }}
          path: .aurion-impact-results/ci.opencourant.smoke
          if-no-files-found: error
          retention-days: 7
