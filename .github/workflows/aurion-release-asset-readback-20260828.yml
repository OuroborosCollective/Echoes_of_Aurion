name: Aurion release asset readback 2026-08-28

on:
  push:
    branches:
      - fix/android-pnpm-setup-order-20260828
    paths:
      - ".github/workflows/aurion-release-asset-readback-20260828.yml"

permissions:
  contents: read

jobs:
  asset-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read deployed Aurion release asset hashes
        shell: bash
        run: |
          set -euo pipefail
          base=https://arelogic.space/aurion-assets
          assets=(
            aurion-wayfinder-animated_6bf370ef.glb
            aurion-veilguard-animated_d6b28a5b.glb
            env_asterion_floor_kit_a01.glb
            env_asterion_archway_a01.glb
            aurion-expedition-theme_a8401a12.mp3
            aurion-hero-trailer-en-de_c44ee2e1.mp4
            aurion-social-keyframe_5edc4882.png
          )
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          for asset in "${assets[@]}"; do
            curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
              --output "$work/$asset" "$base/$asset"
            bytes="$(stat -c '%s' "$work/$asset")"
            hash="$(sha256sum "$work/$asset" | awk '{print $1}')"
            printf 'asset=%s bytes=%s sha256=%s\n' "$asset" "$bytes" "$hash"
          done
