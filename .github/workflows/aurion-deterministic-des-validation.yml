name: Aurion Deterministic DES Validation

on:
  pull_request:
    paths:
      - "server/validation/**"
      - "shared/aurionSimulationWorkOrderProtocol.ts"
      - "server/causality/**"
      - "server/zoneRuntime.ts"
      - "package.json"
      - ".github/workflows/aurion-deterministic-des-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  des-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Deterministic DES validation
        run: pnpm des:validate
