name: Deploy Aurion zone runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-aurion-zone-runtime.yml"
      - ".github/workflows/aurion-zone-schema-bootstrap-proof.yml"
      - ".github/workflows/aurion-root-reconciliation-artifact-proof.yml"
      - ".github/workflows/aurion-production-schema-readback.yml"
      - "deploy/promote-aurion-zone-runtime.sh"
      - "deploy/aurion-production-schema-reconcile"
      - "deploy/aurion-production-schema-reconcile.sudoers"
      - "deploy/install-aurion-production-schema-reconcile"
      - "deploy/aurion-reconcile-runtime-image.conf"
      - "deploy/aurion-reconcile-runtime-network.conf"
      - "deploy/verify-aurion-production-schema-reconcile-artifact.mjs"
      - "deploy/aurion-zone-runtime.service"
      - "deploy/aurion-zone-runtime.environment.template"
      - "server/zoneService.ts"
      - "server/zoneServiceRuntime.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/build-aurion-production-reconcile-artifact.mjs"
      - "scripts/aurionProductionSchemaReconciliation.ts"
      - "scripts/aurionProductionReadbackErrors.ts"
      - "scripts/reconcile-aurion-production-schema.ts"
      - "server/aurionProductionSchemaReconciliation.test.ts"
      - "server/aurionProductionSchemaReconcileDockerRunner.test.ts"
      - "server/aurionProductionReadbackChain.test.ts"
      - "server/aurionZoneRuntimeSchemaBootstrap.test.ts"
      - "drizzle/meta/_journal.json"
      - "drizzle/0021_aurion_global_world_state.sql"
      - "drizzle/0022_aurion_world_chunk_deltas.sql"
      - "drizzle/0023_aurion_world_presence_epochs.sql"
      - "drizzle/0024_aurion_world_epoch_reactions.sql"
      - "drizzle/0025_aurion_loot_mastery_ethos.sql"
      - "drizzle/0026_aurion_faction_questline_state.sql"
      - "drizzle/0027_aurion_faction_questline_rewards.sql"
      - "Dockerfile"
      - "docker-compose.traefik.yml"
      - "client/**"
      - "server/**"
      - "shared/**"
      - "game-data/**"
      - "public/**"
      - "deploy/**"
      - "scripts/**"
      - "patches/**"
      - "vite.config.ts"
      - "tsconfig.json"
  workflow_dispatch:

concurrency:
  group: deploy-aurion-runtime
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify-and-build:
    name: Verify and build immutable Aurion runtimes
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Guard repository scope
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "OuroborosCollective/Echoes_of_Aurion"
          test "${GITHUB_REF}" = "refs/heads/main"
          [[ "${GITHUB_SHA}" =~ ^[a-f0-9]{40}$ ]]

      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify exact source revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          pnpm check
          pnpm test
          bash -n deploy/promote-aurion-zone-runtime.sh
          bash -n deploy/promote-aurion-container-runtime.sh
          bash -n deploy/aurion-production-schema-reconcile
          bash -n deploy/install-aurion-production-schema-reconcile
          sudo visudo -cf deploy/aurion-production-schema-reconcile.sudoers
          git diff --check

      - name: Build full runtime, zone fallback and bounded schema runner
        env:
          AURION_RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pnpm build:runtime-artifact
          pnpm build:zone-runtime
          node scripts/build-aurion-production-reconcile-artifact.mjs
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const runtime=JSON.parse(fs.readFileSync("dist/.aurion-runtime-build.json","utf8"));
          if(runtime.revision!==process.env.GITHUB_SHA) throw new Error("full runtime revision mismatch");
          const schema=JSON.parse(fs.readFileSync("dist-production-reconcile/manifest.json","utf8"));
          if(schema.schemaVersion!==1) throw new Error("unexpected schema artifact version");
          if(schema.recordType!=="aurion_production_schema_reconcile_artifact") throw new Error("unexpected schema artifact type");
          if(schema.revision!==process.env.GITHUB_SHA) throw new Error("schema artifact revision mismatch");
          if(schema.mode!=="read_only"||schema.moduleFormat!=="commonjs") throw new Error("schema artifact boundary mismatch");
          for(const file of [
            "deploy/aurion-production-schema-reconcile",
            "deploy/aurion-reconcile-runtime-image.conf",
            "deploy/aurion-reconcile-runtime-network.conf",
            "deploy/verify-aurion-production-schema-reconcile-artifact.mjs",
          ]) if(!schema.files?.[file]) throw new Error(`schema artifact is missing ${file}`);
          NODE
          (cd dist-production-reconcile && sha256sum --strict -c checksums.sha256)
          node dist-production-reconcile/deploy/verify-aurion-production-schema-reconcile-artifact.mjs dist-production-reconcile "$GITHUB_SHA"
          printf '{"revision":"%s","runId":"%s","artifact":"aurion-zone-runtime"}\n' \
            "${GITHUB_SHA}" "${GITHUB_RUN_ID}" > dist-zone/.aurion-zone-runtime-release.json
          tar -C dist-zone -czf aurion-zone-runtime-release.tgz .
          sha256sum aurion-zone-runtime-release.tgz > aurion-zone-runtime-release.tgz.sha256

      - name: Build revision-labelled full container image
        env:
          AURION_RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="echoes-of-aurion:sha-${GITHUB_SHA}"
          docker build \
            --platform linux/amd64 \
            --pull \
            --build-arg "AURION_RELEASE_SHA=${GITHUB_SHA}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$image" \
            .
          image_id="$(docker image inspect --format='{{.Id}}' "$image")"
          revision="$(docker image inspect --format='{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")"
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$revision" = "$GITHUB_SHA"
          IMAGE_ID="$image_id" IMAGE_REF="$image" node -e '
            const fs=require("node:fs");
            fs.writeFileSync("aurion-full-runtime-image.json",JSON.stringify({
              schemaVersion:1,
              recordType:"aurion_full_runtime_image",
              revision:process.env.GITHUB_SHA,
              imageReference:process.env.IMAGE_REF,
              imageId:process.env.IMAGE_ID,
            },null,2)+"\n");
          '
          docker save "$image" | gzip -1 > aurion-full-runtime-image.tar.gz
          sha256sum aurion-full-runtime-image.tar.gz > aurion-full-runtime-image.tar.gz.sha256

      - name: Publish immutable runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurion-zone-runtime-${{ github.sha }}
          path: |
            aurion-zone-runtime-release.tgz
            aurion-zone-runtime-release.tgz.sha256
            aurion-full-runtime-image.tar.gz
            aurion-full-runtime-image.tar.gz.sha256
            aurion-full-runtime-image.json
            docker-compose.traefik.yml
            deploy/aurion-zone-runtime.service
            deploy/aurion-zone-runtime.environment.template
            deploy/promote-aurion-zone-runtime.sh
            deploy/promote-aurion-container-runtime.sh
            dist-production-reconcile
          if-no-files-found: error
          retention-days: 30

  root-reconciliation-proof:
    name: Prove private Docker schema readback
    needs: verify-and-build
    uses: ./.github/workflows/aurion-root-reconciliation-artifact-proof.yml
    with:
      use_uploaded_artifact: true

  promote-zone-runtime:
    name: Promote verified full Aurion runtime
    needs: [verify-and-build, root-reconciliation-proof]
    runs-on: [self-hosted, Linux, X64, aurion-static]
    environment: production
    timeout-minutes: 20
    env:
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}
      EXPECTED_SHA: ${{ github.sha }}

    steps:
      - name: Guard repository scope
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "OuroborosCollective/Echoes_of_Aurion"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_SHA}" = "${EXPECTED_SHA}"

      - name: Reset workflow-owned artifact directory
        run: rm -rf runtime-artifact

      - name: Download verified runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: aurion-zone-runtime-${{ github.sha }}
          path: runtime-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Promote full container, fallback zone and bounded schema runner
        run: |
          set -euo pipefail
          artifact="${GITHUB_WORKSPACE}/runtime-artifact"

          # The first invocation may replace an older promoter with this revision.
          # Re-run the exact, idempotent promotion so its newly installed identity
          # checks execute before the workflow accepts the release.
          set +e
          sudo /usr/local/sbin/promote-aurion-zone-runtime "${artifact}" "${EXPECTED_SHA}" "${RELEASE_ID}"
          bootstrap_status=$?
          set -e
          cmp -s "${artifact}/deploy/promote-aurion-zone-runtime.sh" /usr/local/sbin/promote-aurion-zone-runtime
          if [[ "$bootstrap_status" -ne 0 ]]; then
            printf 'LEGACY_PROMOTER_REPLACED status=%s\n' "$bootstrap_status"
          fi
          sudo /usr/local/sbin/promote-aurion-zone-runtime "${artifact}" "${EXPECTED_SHA}" "${RELEASE_ID}"

          test -x /usr/local/sbin/aurion-production-schema-reconcile
          test -f /opt/echoes-of-aurion-schema-reconcile/current/manifest.json
          grep -Fq "${EXPECTED_SHA}" /opt/echoes-of-aurion-schema-reconcile/current/manifest.json
          test -f "/opt/echoes-of-aurion/releases/${RELEASE_ID}/deployment-receipt.json"
          grep -Fq "${EXPECTED_SHA}" "/opt/echoes-of-aurion/releases/${RELEASE_ID}/deployment-receipt.json"

      - name: Read back installed release identities
        run: |
          set -euo pipefail
          artifact="${GITHUB_WORKSPACE}/runtime-artifact/dist-production-reconcile"
          installed_root=/opt/echoes-of-aurion-schema-reconcile/current
          runner=/usr/local/sbin/aurion-production-schema-reconcile
          verifier=/usr/local/lib/echoes-of-aurion/verify-aurion-production-schema-reconcile-artifact.mjs
          cat /opt/aurion-zone-runtime/current/.aurion-zone-runtime-release.json
          cat "/opt/echoes-of-aurion/releases/${RELEASE_ID}/deployment-receipt.json"
          (cd "$artifact" && sha256sum --strict -c checksums.sha256)
          (cd "$installed_root" && sha256sum --strict -c checksums.sha256)
          node "${artifact}/deploy/verify-aurion-production-schema-reconcile-artifact.mjs" "$artifact" "$EXPECTED_SHA"
          node "$verifier" "$installed_root" "$EXPECTED_SHA"
          cmp -s "$artifact/manifest.json" "$installed_root/manifest.json"
          cmp -s "$artifact/checksums.sha256" "$installed_root/checksums.sha256"
          test -f "$runner"
          test ! -L "$runner"
          test "$(stat -c '%U:%G:%a' "$runner")" = "root:root:755"
          cmp -s "$artifact/deploy/aurion-production-schema-reconcile" "$runner"
          test -f "$verifier"
          test ! -L "$verifier"
          test "$(stat -c '%U:%G:%a' "$verifier")" = "root:root:755"
          cmp -s "$artifact/deploy/verify-aurion-production-schema-reconcile-artifact.mjs" "$verifier"
          node --input-type=module -e '
            import fs from "node:fs";
            const manifest=JSON.parse(fs.readFileSync("/opt/echoes-of-aurion-schema-reconcile/current/manifest.json","utf8"));
            if(manifest.revision!==process.env.EXPECTED_SHA||manifest.mode!=="read_only") throw new Error("installed schema runner identity mismatch");
            console.log(JSON.stringify({revision:manifest.revision,mode:manifest.mode,recordType:manifest.recordType}));
          '

      - name: Verify public full-runtime health
        run: |
          set -euo pipefail
          public_ready=0
          for _attempt in $(seq 1 20); do
            if health_json="$(curl --fail --silent --show-error --max-time 10 https://arelogic.space/healthz 2>/dev/null)"; then
              if EXPECTED_SHA="$EXPECTED_SHA" HEALTH_JSON="$health_json" node -e '
                const body=JSON.parse(process.env.HEALTH_JSON);
                if(body.ok!==true||body.status!=="ok"||body.service!=="echoes-of-aurion"||body.revision!==process.env.EXPECTED_SHA) process.exit(1);
              '; then
                printf '%s\n' "$health_json"
                public_ready=1
                break
              fi
            fi
            sleep 2
          done
          [[ "$public_ready" -eq 1 ]]

  production-schema-readback:
    name: Require production schema readback receipt
    needs: promote-zone-runtime
    uses: ./.github/workflows/aurion-production-schema-readback.yml
    with:
      expected_sha: ${{ github.sha }}
      upstream_run_id: ${{ github.run_id }}
