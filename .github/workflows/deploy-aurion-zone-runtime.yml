name: Deploy Aurion zone runtime

on:
  # Die separate Zonenruntime bleibt ein expliziter Fallback.
  # Die maßgebliche Aurion-Laufzeit wird containerisiert ausgeliefert.
  workflow_dispatch:

concurrency:
  group: deploy-aurion-zone-runtime
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Verify and build immutable Aurion zone runtime
    runs-on: ubuntu-24.04

    steps:
      - name: Guard repository scope
        run: test "${GITHUB_REPOSITORY}" = "OuroborosCollective/Echoes_of_Aurion"

      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify exact source revision
        run: |
          pnpm check
          pnpm test
          git diff --check

      - name: Build zone runtime
        run: |
          pnpm build:zone-runtime
          printf '{"revision":"%s","runId":"%s","artifact":"aurion-zone-runtime"}\n' \
            "${GITHUB_SHA}" "${GITHUB_RUN_ID}" > dist-zone/.aurion-zone-runtime-release.json
          tar -C dist-zone -czf aurion-zone-runtime-release.tgz .
          sha256sum aurion-zone-runtime-release.tgz > aurion-zone-runtime-release.tgz.sha256

      - name: Publish immutable runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurion-zone-runtime-${{ github.sha }}
          path: |
            aurion-zone-runtime-release.tgz
            aurion-zone-runtime-release.tgz.sha256
            deploy/aurion-zone-runtime.service
            deploy/aurion-zone-runtime.environment.template
            deploy/arelogic-zone-runtime.nginx.conf
            deploy/arelogic-zone-runtime-rate-limit.nginx.conf
            deploy/promote-aurion-zone-runtime.sh
          if-no-files-found: error
          retention-days: 30

  promote-zone-runtime:
    name: Promote verified Aurion zone runtime
    needs: verify-and-build
    runs-on: [self-hosted, Linux, X64, aurion-static]
    environment: production
    env:
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}
      EXPECTED_SHA: ${{ github.sha }}

    steps:
      - name: Guard repository scope
        run: test "${GITHUB_REPOSITORY}" = "OuroborosCollective/Echoes_of_Aurion"

      - name: Download verified runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: aurion-zone-runtime-${{ github.sha }}
          path: runtime-artifact

      - name: Promote node runtime and routing
        run: |
          set -euo pipefail
          artifact="${GITHUB_WORKSPACE}/runtime-artifact"
          sudo /usr/local/sbin/promote-aurion-zone-runtime "${artifact}" "${EXPECTED_SHA}" "${RELEASE_ID}"

      - name: Verify public runtime health
        run: |
          set -euo pipefail
          public_ready=0
          for _attempt in $(seq 1 20); do
            if health_json="$(curl --fail --silent --show-error https://arelogic.space/_runtime/healthz 2>/dev/null)"; then
              if grep -Fq "${EXPECTED_SHA}" <<<"$health_json"; then
                printf '%s\n' "$health_json"
                public_ready=1
                break
              fi
            fi
            sleep 1
          done
          [[ "$public_ready" -eq 1 ]]
