name: Deploy Aurion Traefik runtime

on:
  push:
    branches: [main]
    # Documentation and local visual-tooling changes are non-runtime surfaces.
    # Mixed commits still deploy because paths-ignore applies only when every
    # changed path matches one of these patterns.
    paths-ignore:
      - "docs/**"
      - "SUMMARY.md"
      - "Memory.md"
      - ".game-dev/**"
      - ".gitignore"
      - ".github/workflows/game-development-studio-smoke.yml"
      - "scripts/install-game-development-studio.mjs"
  pull_request:
    paths:
      - ".github/workflows/deploy-aurion-zone-runtime.yml"
      - ".github/workflows/aurion-wasd-migration-ledger.yml"
      - "scripts/build-aurion-wasd-migration-ledger.mjs"
      - "scripts/build-aurion-wasd-migration-ledger.test.mjs"
      - "Dockerfile"
      - "docker-compose.traefik.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "patches/**"
      - "deploy/aurion-traefik-runtime.environment.template"
      - "deploy/promote-aurion-zone-runtime.sh"
      - "deploy/verify-aurion-runtime-database.mjs"
      - "scripts/build-aurion-traefik-runtime-artifact.mjs"
      - "server/_core/vite.ts"
      - "server/aurionTraefikRuntimeDeployment.test.ts"
      - "deploy/aurion-revision-alignment-controller.py"
      - "deploy/aurion-revision-alignment-controller.service"
      - "deploy/aurion-revision-alignment-controller.timer"
      - "deploy/aurion-revision-alignment-controller.env.template"
  workflow_dispatch:

concurrency:
  # A push and a trusted manual dispatch for main must never promote in
  # parallel. Pull-request refs remain isolated from the production queue.
  group: deploy-aurion-zone-runtime-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

# Production verification may restore trusted caches but never publishes cache
# entries. Reusable workflows inherit a boundary no more permissive than this.
cache-mode: read

jobs:
  migration-ledger:
    name: Bind historical WASD provenance to Aurion
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/aurion-wasd-migration-ledger.yml
    with:
      source_ref: eb20a85b305612eaf01c560ad0c89af96ed03295
      target_ref: ${{ github.sha }}

  verify-and-build:
    name: Verify and build immutable Aurion Traefik runtime
    # Pull-request verification runs only for branches in this repository.
    # Root proofs and promotion remain limited to trusted pushes on main.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: migration-ledger
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Guard repository scope
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "${{ github.repository }}"
          case "${GITHUB_EVENT_NAME}" in
            push|workflow_dispatch)
              test "${GITHUB_REF_NAME}" = "main"
              ;;
            pull_request)
              ;;
            *)
              echo "unsupported event: ${GITHUB_EVENT_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify exact source revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "${{ needs.migration-ledger.outputs.target_sha }}" = "$GITHUB_SHA"
          [[ "${{ needs.migration-ledger.outputs.source_sha }}" =~ ^[a-f0-9]{40}$ ]]
          test "${{ needs.migration-ledger.outputs.source_sha }}" = "eb20a85b305612eaf01c560ad0c89af96ed03295"
          [[ "${{ needs.migration-ledger.outputs.plan_sha256 }}" =~ ^[a-f0-9]{64}$ ]]
          pnpm check
          pnpm test
          node --test \
            scripts/dispatch-aurion-schema-plan.test.mjs \
            scripts/aurion-build-input-manifest.test.mjs \
            scripts/aurion-release-attestation.test.mjs \
            scripts/scan-aurion-release-secrets.test.mjs \
            scripts/aurion-milestone-gate-evidence.test.mjs
          bash -n deploy/promote-aurion-zone-runtime.sh
          node --check deploy/verify-aurion-runtime-database.mjs
          node --check scripts/build-aurion-traefik-runtime-artifact.mjs
          node --check scripts/build-aurion-promoter-bootstrap-artifact.mjs
          python3 -m py_compile deploy/aurion-revision-alignment-controller.py
          test -f deploy/aurion-revision-alignment-controller.service
          test -f deploy/aurion-revision-alignment-controller.timer
          grep -Fq 'OnUnitActiveSec=2min' deploy/aurion-revision-alignment-controller.timer
          grep -Fq 'NoNewPrivileges=true' deploy/aurion-revision-alignment-controller.service
          bash -n deploy/aurion-production-schema-reconcile
          bash -n deploy/install-aurion-production-schema-reconcile
          bash -n deploy/aurion-production-schema-apply
          bash -n deploy/aurion-production-schema-apply-core
          bash -n deploy/install-aurion-production-schema-apply
          sudo visudo -cf deploy/aurion-production-schema-reconcile.sudoers
          sudo visudo -cf deploy/aurion-production-schema-apply.sudoers
          git diff --check

      - name: Record workflow provenance
        env:
          AURION_JOB_WORKFLOW_REF: ${{ job.workflow_ref || github.workflow_ref }}
          AURION_JOB_WORKFLOW_SHA: ${{ job.workflow_sha || github.workflow_sha }}
          AURION_JOB_WORKFLOW_REPOSITORY: ${{ job.workflow_repository || github.repository }}
          AURION_JOB_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path || '.github/workflows/deploy-aurion-zone-runtime.yml' }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const receipt = {
            schemaVersion: 1,
            recordType: "aurion_workflow_provenance",
            revision: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            workflowRef: process.env.AURION_JOB_WORKFLOW_REF,
            workflowSha: process.env.AURION_JOB_WORKFLOW_SHA,
            workflowRepository: process.env.AURION_JOB_WORKFLOW_REPOSITORY,
            workflowFilePath: process.env.AURION_JOB_WORKFLOW_FILE_PATH,
            runner: {
              name: process.env.RUNNER_NAME,
              os: process.env.RUNNER_OS,
              arch: process.env.RUNNER_ARCH,
            },
            cacheMode: "read",
          };
          if (!/^[a-f0-9]{40}$/.test(receipt.revision ?? "")) throw new Error("workflow provenance revision missing");
          if (!/^[a-f0-9]{40}$/.test(receipt.workflowSha ?? "")) throw new Error("workflow provenance SHA missing");
          if (receipt.workflowRepository !== process.env.GITHUB_REPOSITORY) throw new Error("workflow provenance repository mismatch");
          if (receipt.workflowFilePath !== ".github/workflows/deploy-aurion-zone-runtime.yml") throw new Error("workflow provenance path mismatch");
          fs.writeFileSync("aurion-workflow-provenance.json", `${JSON.stringify(receipt, null, 2)}\n`);
          NODE

      - name: Build revision-bound Traefik runtime and compatibility bootstrap
        env:
          AURION_RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pnpm build:runtime-artifact
          node scripts/build-aurion-traefik-runtime-artifact.mjs
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const manifest=JSON.parse(fs.readFileSync("dist-traefik-runtime/manifest.json","utf8"));
          if(manifest.schemaVersion!==1||manifest.recordType!=="aurion_traefik_runtime_artifact") throw new Error("unexpected Traefik runtime artifact");
          if(manifest.revision!==process.env.GITHUB_SHA) throw new Error("Traefik runtime revision mismatch");
          if(manifest.buildInputManifest!=="build-input-manifest.json"||!/^sha256:[a-f0-9]{64}$/.test(manifest.buildInputDigest??"")) throw new Error("Traefik runtime build input identity missing");
          for(const file of ["Dockerfile","docker-compose.traefik.yml","deploy/promote-aurion-zone-runtime.sh","deploy/aurion-traefik-runtime.environment.template","deploy/verify-aurion-runtime-database.mjs","dist/.aurion-runtime-build.json","build-input-manifest.json","release-secret-scan.json","runtime-node_modules.tgz"]) if(!manifest.files?.[file]) throw new Error(`Traefik runtime artifact is missing ${file}`);
          NODE
          (cd dist-traefik-runtime && sha256sum --strict -c checksums.sha256)
          runtime_verify_image="echoes-of-aurion:verify-${GITHUB_SHA}"
          runtime_verify_container="aurion-runtime-verify-${GITHUB_RUN_ID}"
          runtime_verify_db_container="aurion-runtime-db-verify-${GITHUB_RUN_ID}"
          runtime_verify_public_network="aurion-runtime-public-verify-${GITHUB_RUN_ID}"
          runtime_verify_database_network="aurion-runtime-database-verify-${GITHUB_RUN_ID}"
          runtime_verify_glb_volume="aurion-glb-verify-${GITHUB_RUN_ID}"
          runtime_verify_db_password="$(openssl rand -hex 24)"
          runtime_verify_cleanup() {
            docker rm --force "${runtime_verify_container}" >/dev/null 2>&1 || true
            docker rm --force "${runtime_verify_db_container}" >/dev/null 2>&1 || true
            docker volume rm "${runtime_verify_glb_volume}" >/dev/null 2>&1 || true
            docker network rm "${runtime_verify_public_network}" >/dev/null 2>&1 || true
            docker network rm "${runtime_verify_database_network}" >/dev/null 2>&1 || true
          }
          trap runtime_verify_cleanup EXIT
          docker volume create "${runtime_verify_glb_volume}" >/dev/null
          docker network create "${runtime_verify_public_network}" >/dev/null
          docker network create "${runtime_verify_database_network}" >/dev/null
          docker run --detach \
            --name "${runtime_verify_db_container}" \
            --network "${runtime_verify_database_network}" \
            --network-alias mariadb \
            -e MARIADB_ROOT_PASSWORD="${runtime_verify_db_password}" \
            -e MARIADB_DATABASE=aurion_runtime \
            -e MARIADB_USER=aurion_runtime \
            -e MARIADB_PASSWORD="${runtime_verify_db_password}" \
            mariadb:11.4.13@sha256:80494b9810694179889f7281ec44ca928241df577159c0356a1070e2e94616a1 >/dev/null
          runtime_verify_db_ready=0
          for _attempt in $(seq 1 60); do
            if docker exec -e MYSQL_PWD="${runtime_verify_db_password}" "${runtime_verify_db_container}" \
              mariadb --protocol=socket -uroot -e 'SELECT 1' >/dev/null 2>&1; then
              runtime_verify_db_ready=1
              break
            fi
            sleep 2
          done
          if [[ "${runtime_verify_db_ready}" -ne 1 ]]; then
            echo "aurion-runtime-database-verify failed category=database_not_ready" >&2
            exit 1
          fi
          docker build --pull=false --build-arg "AURION_RELEASE_SHA=${GITHUB_SHA}" --tag "${runtime_verify_image}" dist-traefik-runtime
          docker run --detach \
            --name "${runtime_verify_container}" \
            --mount "type=volume,source=${runtime_verify_glb_volume},destination=/var/lib/aurion/glb" \
            -e AURION_GLB_STORAGE_DIR=/var/lib/aurion/glb \
            --network "${runtime_verify_database_network}" \
            -e "DATABASE_URL=mysql://aurion_runtime:${runtime_verify_db_password}@mariadb:3306/aurion_runtime" \
            "${runtime_verify_image}" >/dev/null
          docker network connect "${runtime_verify_public_network}" "${runtime_verify_container}"
          docker inspect --format '{{range $network, $_ := .NetworkSettings.Networks}}{{println $network}}{{end}}' "${runtime_verify_container}" | grep -Fxq "${runtime_verify_public_network}"
          docker inspect --format '{{range $network, $_ := .NetworkSettings.Networks}}{{println $network}}{{end}}' "${runtime_verify_container}" | grep -Fxq "${runtime_verify_database_network}"
          runtime_verify_ready=0
          runtime_verify_probe_status=0
          for _attempt in $(seq 1 60); do
            if [[ "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "${runtime_verify_container}")" == "healthy" ]]; then
              if docker exec -e "EXPECTED_SHA=${GITHUB_SHA}" "${runtime_verify_container}" node --input-type=module -e '
                const healthResponse = await fetch("http://127.0.0.1:3000/healthz");
                let health;
                try {
                  health = await healthResponse.json();
                } catch {
                  process.exit(10);
                }
                if (!healthResponse.ok || health.status !== "ok" || health.service !== "echoes-of-aurion" || health.revision !== process.env.EXPECTED_SHA) process.exit(10);
                const pageResponse = await fetch("http://127.0.0.1:3000/");
                const page = await pageResponse.text();
                if (!pageResponse.ok || !pageResponse.headers.get("content-type")?.includes("text/html")) process.exit(11);
                const assetPath = page.match(/(?:src|href)="(\/assets\/[A-Za-z0-9._/-]+)"/)?.[1];
                if (!assetPath) process.exit(11);
                const assetResponse = await fetch(new URL(assetPath, "http://127.0.0.1:3000"));
                if (!assetResponse.ok || (await assetResponse.arrayBuffer()).byteLength < 1) process.exit(12);
              '; then
                runtime_verify_ready=1
                break
              else
                runtime_verify_probe_status=$?
                break
              fi
            fi
            if [[ "$(docker inspect --format '{{.State.Status}}' "${runtime_verify_container}")" != "running" ]]; then
              break
            fi
            sleep 2
          done
          if [[ "${runtime_verify_ready}" -ne 1 ]]; then
            runtime_state="$(docker inspect --format '{{.State.Status}}' "${runtime_verify_container}")"
            runtime_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "${runtime_verify_container}")"
            case "${runtime_verify_probe_status}" in
              10) runtime_category="health_body_invalid" ;;
              11) runtime_category="static_index_invalid" ;;
              12) runtime_category="static_asset_invalid" ;;
              *) runtime_category="$(docker logs --tail 200 "${runtime_verify_container}" 2>&1 | node --input-type=module -e '
                let raw = "";
                for await (const chunk of process.stdin) raw += chunk;
                let category = "unclassified";
                const quote = String.fromCharCode(39);
                const missing = raw.match(new RegExp("Cannot find (?:package|module) " + quote + "([^" + quote + "]+)" + quote));
                const packageName = missing?.[1] ?? "";
                const safePackageName = new RegExp("^(?:@[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]+$").test(packageName) ? packageName : "unknown";
                if (/ERR_MODULE_NOT_FOUND|Cannot find (package|module)/.test(raw)) category = `module_not_found:${safePackageName}`;
                else if (/ERR_DLOPEN_FAILED/.test(raw)) category = "native_module_load_failed";
                else if (/EACCES/.test(raw)) category = "permission_denied";
                else if (/Could not find the build directory/.test(raw)) category = "static_build_missing";
                else if (/AURION_RELEASE_SHA must be/.test(raw)) category = "release_revision_invalid";
                else if (/Server running on http/.test(raw)) category = "server_started_but_health_unhealthy";
                process.stdout.write(category);
              ')" ;;
            esac
            printf 'aurion-runtime-container-verify failed state=%s health=%s category=%s\n' "${runtime_state}" "${runtime_health}" "${runtime_category}" >&2
            exit 1
          fi
          if ! docker exec "${runtime_verify_container}" node /app/deploy/verify-aurion-runtime-database.mjs >/dev/null 2>&1; then
            echo "aurion-runtime-database-verify failed category=authenticated_select_failed" >&2
            exit 1
          fi
          docker exec "${runtime_verify_container}" node -e 'require("node:fs").writeFileSync("/var/lib/aurion/glb/.ci-persistence-proof", process.env.AURION_RELEASE_SHA)'
          docker run --rm --network none \
            --mount "type=volume,source=${runtime_verify_glb_volume},destination=/var/lib/aurion/glb" \
            "${runtime_verify_image}" node -e 'const fs=require("node:fs"); if(fs.readFileSync("/var/lib/aurion/glb/.ci-persistence-proof","utf8")!==process.env.AURION_RELEASE_SHA) process.exit(1); fs.unlinkSync("/var/lib/aurion/glb/.ci-persistence-proof")'
          trap - EXIT
          runtime_verify_cleanup
          tar -C dist-traefik-runtime -czf aurion-traefik-runtime-release.tgz .
          sha256sum aurion-traefik-runtime-release.tgz > aurion-traefik-runtime-release.tgz.sha256

          pnpm build:zone-runtime
          node scripts/build-aurion-production-reconcile-artifact.mjs
          node scripts/build-aurion-production-apply-artifact.mjs
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const manifest=JSON.parse(fs.readFileSync("dist-production-reconcile/manifest.json","utf8"));
          if(manifest.schemaVersion!==1) throw new Error("unexpected schema artifact version");
          if(manifest.recordType!=="aurion_production_schema_reconcile_artifact") throw new Error("unexpected schema artifact type");
          if(manifest.revision!==process.env.GITHUB_SHA) throw new Error("schema artifact revision mismatch");
          if(manifest.mode!=="read_only"||manifest.moduleFormat!=="commonjs") throw new Error("schema artifact boundary mismatch");
          for(const file of [
            "deploy/aurion-production-schema-reconcile",
            "deploy/aurion-reconcile-runtime-image.conf",
            "deploy/aurion-reconcile-runtime-network.conf",
            "deploy/verify-aurion-production-schema-reconcile-artifact.mjs",
          ]) if(!manifest.files?.[file]) throw new Error(`schema artifact is missing ${file}`);
          NODE
          (cd dist-production-reconcile && sha256sum --strict -c checksums.sha256)
          node dist-production-reconcile/deploy/verify-aurion-production-schema-reconcile-artifact.mjs dist-production-reconcile "$GITHUB_SHA"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const manifest=JSON.parse(fs.readFileSync("dist-production-apply/manifest.json","utf8"));
          if(manifest.schemaVersion!==1||manifest.recordType!=="aurion_production_schema_apply_artifact") throw new Error("unexpected schema apply artifact type");
          if(manifest.revision!==process.env.GITHUB_SHA||manifest.mode!=="backup_recovery_apply"||manifest.moduleFormat!=="commonjs") throw new Error("schema apply artifact boundary mismatch");
          for(const file of [
            "bin/apply.cjs","bin/mysql-client-config.cjs","bin/reconcile.cjs","drizzle/meta/_journal.json",
            "deploy/aurion-production-schema-apply","deploy/aurion-production-schema-apply-core","deploy/install-aurion-production-schema-apply","deploy/verify-aurion-production-schema-apply-artifact.mjs",
          ]) if(!manifest.files?.[file]) throw new Error(`schema apply artifact is missing ${file}`);
          NODE
          (cd dist-production-apply && sha256sum --strict -c checksums.sha256)
          node dist-production-apply/deploy/verify-aurion-production-schema-apply-artifact.mjs dist-production-apply "$GITHUB_SHA"
          printf '{"revision":"%s","runId":"%s","artifact":"aurion-zone-runtime"}\n' \
            "${GITHUB_SHA}" "${GITHUB_RUN_ID}" > dist-zone/.aurion-zone-runtime-release.json
          tar -C dist-zone -czf aurion-zone-runtime-release.tgz .
          sha256sum aurion-zone-runtime-release.tgz > aurion-zone-runtime-release.tgz.sha256

          mkdir -p runtime-artifact/deploy
          cp -a \
            aurion-zone-runtime-release.tgz \
            aurion-zone-runtime-release.tgz.sha256 \
            aurion-traefik-runtime-release.tgz \
            aurion-traefik-runtime-release.tgz.sha256 \
            runtime-artifact/
          cp -a \
            deploy/aurion-zone-runtime.service \
            deploy/aurion-zone-runtime.environment.template \
            deploy/arelogic-zone-runtime.nginx.conf \
            deploy/arelogic-zone-runtime-rate-limit.nginx.conf \
            deploy/aurion-traefik-runtime.environment.template \
            deploy/promote-aurion-zone-runtime.sh \
            runtime-artifact/deploy/
          cp -a dist-production-reconcile runtime-artifact/
          cp -a dist-production-apply runtime-artifact/
          node scripts/build-aurion-promoter-bootstrap-artifact.mjs runtime-artifact runtime-bootstrap-artifact
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const canonical=JSON.parse(fs.readFileSync("runtime-artifact/dist-production-reconcile/deploy/aurion-reconcile-runtime-image.conf","utf8"));
          const bootstrap=JSON.parse(fs.readFileSync("runtime-bootstrap-artifact/dist-production-reconcile/deploy/aurion-reconcile-runtime-image.conf","utf8"));
          const identity=JSON.parse(fs.readFileSync("runtime-bootstrap-artifact/bootstrap-identity.json","utf8"));
          if(canonical.imageDigest!=="sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5") throw new Error("unexpected canonical bootstrap input");
          if(bootstrap.imageDigest!=="sha256:4d676821dff059fd00d277ee4261ef34ea712317fed0737c03941481b5760c96") throw new Error("unexpected amd64 bootstrap image");
          if(identity.schemaVersion!==1||identity.recordType!=="aurion_legacy_promoter_bootstrap_identity"||identity.sourceRevision!==process.env.GITHUB_SHA||!/^([a-f0-9]{40})$/.test(identity.bootstrapRevision)||identity.bootstrapRevision===process.env.GITHUB_SHA||identity.mode!=="bootstrap_only") throw new Error("unexpected bootstrap identity");
          NODE
          bootstrap_runtime_entries="$(tar -tzf runtime-bootstrap-artifact/aurion-traefik-runtime-release.tgz)"
          if grep -Fq '@' <<<"$bootstrap_runtime_entries"; then
            echo "bootstrap runtime archive contains a legacy-incompatible path" >&2
            exit 1
          fi
          grep -Fxq './patches/wouter-3.7.1.patch' <<<"$bootstrap_runtime_entries"
          (cd runtime-bootstrap-artifact && sha256sum --strict -c bootstrap-identity.json.sha256)
          bootstrap_revision="$(node --input-type=module -e '
            import fs from "node:fs";
            const [file, expected]=process.argv.slice(1);
            const identity=JSON.parse(fs.readFileSync(file,"utf8"));
            if(identity.schemaVersion!==1||identity.recordType!=="aurion_legacy_promoter_bootstrap_identity"||identity.sourceRevision!==expected||!/^([a-f0-9]{40})$/.test(identity.bootstrapRevision)||identity.bootstrapRevision===expected||identity.mode!=="bootstrap_only") process.exit(2);
            process.stdout.write(identity.bootstrapRevision);
          ' runtime-bootstrap-artifact/bootstrap-identity.json "$GITHUB_SHA")"
          (cd runtime-bootstrap-artifact/dist-production-reconcile && sha256sum --strict -c checksums.sha256)
          node runtime-bootstrap-artifact/dist-production-reconcile/deploy/verify-aurion-production-schema-reconcile-artifact.mjs runtime-bootstrap-artifact/dist-production-reconcile "$bootstrap_revision"
          bootstrap_image="node:22.23.2-bookworm-slim@sha256:4d676821dff059fd00d277ee4261ef34ea712317fed0737c03941481b5760c96"
          docker pull "$bootstrap_image"
          bootstrap_image_id="$(docker image inspect --format '{{.Id}}' "$bootstrap_image")"
          [[ "$bootstrap_image_id" =~ ^sha256:[a-f0-9]{64}$ ]]

      - name: Prepare canonical release artifact attestation predicate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import fs from "node:fs";
          import { buildArtifactAttestationPredicate } from "./scripts/aurion-release-attestation.mjs";
          const sha256=file=>`sha256:${createHash("sha256").update(fs.readFileSync(file)).digest("hex")}`;
          const runtime=JSON.parse(fs.readFileSync("dist-traefik-runtime/manifest.json","utf8"));
          const build=JSON.parse(fs.readFileSync("dist-traefik-runtime/build-input-manifest.json","utf8"));
          if(runtime.revision!==process.env.GITHUB_SHA||runtime.buildInputDigest!==build.buildInputDigest) throw new Error("BUILD_INPUT_IDENTITY_MISMATCH");
          const predicate=buildArtifactAttestationPredicate({
            sourceRevision:process.env.GITHUB_SHA,
            buildInputDigest:runtime.buildInputDigest,
            artifactDigest:sha256("dist-traefik-runtime/checksums.sha256"),
            releaseArchiveDigest:sha256("aurion-traefik-runtime-release.tgz"),
            secretScanReceiptDigest:`sha256:${runtime.secretScan?.receiptSha256 ?? ""}`,
            secretValuesReturned:runtime.secretScan?.secretValuesReturned,
            workflow:".github/workflows/deploy-aurion-zone-runtime.yml",
            workflowRunId:process.env.GITHUB_RUN_ID,
          });
          fs.writeFileSync("aurion-release-artifact-predicate.json",JSON.stringify(predicate,null,2)+"\n");
          fs.writeFileSync("aurion-release-artifact-subject.sha256",`${predicate.releaseArchiveDigest.slice(7)}  aurion-traefik-runtime-release.tgz\n`);
          NODE
          sha256sum --strict -c aurion-release-artifact-subject.sha256

      - name: Attest finalized Aurion runtime release archive
        id: attest-release-artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: aurion-traefik-runtime-release.tgz
          predicate-type: https://arelogic.space/attestations/aurion-release-artifact/v1
          predicate-path: aurion-release-artifact-predicate.json

      - name: Verify detached artifact attestation and tamper rejection
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.attest-release-artifact.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.attest-release-artifact.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest-release-artifact.outputs.attestation-url }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "${ATTESTATION_BUNDLE}"
          cp "${ATTESTATION_BUNDLE}" aurion-release-artifact-attestation.sigstore.json
          verify_artifact() {
            gh attestation verify aurion-traefik-runtime-release.tgz \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/deploy-aurion-zone-runtime.yml" \
              --source-digest "${GITHUB_SHA}" \
              --source-ref "refs/heads/main" \
              --predicate-type "https://arelogic.space/attestations/aurion-release-artifact/v1" \
              --deny-self-hosted-runners \
              --bundle aurion-release-artifact-attestation.sigstore.json
          }
          verify_artifact
          cp aurion-traefik-runtime-release.tgz aurion-traefik-runtime-release.tgz.untampered
          printf '\0' >> aurion-traefik-runtime-release.tgz
          set +e
          verify_artifact >/dev/null 2>&1
          tamper_status=$?
          set -e
          test "${tamper_status}" -ne 0
          mv aurion-traefik-runtime-release.tgz.untampered aurion-traefik-runtime-release.tgz
          sha256sum --strict -c aurion-release-artifact-subject.sha256
          verify_artifact
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import fs from "node:fs";
          const bundle=fs.readFileSync("aurion-release-artifact-attestation.sigstore.json");
          const predicate=JSON.parse(fs.readFileSync("aurion-release-artifact-predicate.json","utf8"));
          const metadata={
            schemaVersion:"aurion.release-artifact-attestation-metadata.v1",
            sourceRevision:predicate.sourceRevision,
            attestationId:process.env.ATTESTATION_ID,
            attestationUrl:process.env.ATTESTATION_URL,
            bundleSha256:`sha256:${createHash("sha256").update(bundle).digest("hex")}`,
            releaseArchiveDigest:predicate.releaseArchiveDigest,
            verified:true,
            tamperRejected:true,
          };
          if(!/^[1-9][0-9]*$/.test(metadata.attestationId??"")||!/^https:\/\/github\.com\//.test(metadata.attestationUrl??"")) throw new Error("ATTESTATION_IDENTITY_INVALID");
          fs.writeFileSync("aurion-release-artifact-attestation.json",JSON.stringify(metadata,null,2)+"\n");
          NODE

      - name: Publish immutable runtime artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aurion-zone-runtime-${{ github.sha }}
          path: |
            aurion-zone-runtime-release.tgz
            aurion-zone-runtime-release.tgz.sha256
            aurion-traefik-runtime-release.tgz
            aurion-traefik-runtime-release.tgz.sha256
            "runtime-node_modules.tgz"
            deploy/aurion-zone-runtime.service
            deploy/aurion-zone-runtime.environment.template
            deploy/arelogic-zone-runtime.nginx.conf
            deploy/arelogic-zone-runtime-rate-limit.nginx.conf
            deploy/aurion-traefik-runtime.environment.template
            deploy/promote-aurion-zone-runtime.sh
            dist-production-reconcile
            dist-production-apply
            aurion-workflow-provenance.json
            aurion-release-artifact-predicate.json
            aurion-release-artifact-subject.sha256
            aurion-release-artifact-attestation.sigstore.json
            aurion-release-artifact-attestation.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish one-time promoter bootstrap artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aurion-zone-runtime-bootstrap-${{ github.sha }}
          path: runtime-bootstrap-artifact
          if-no-files-found: error
          retention-days: 30

  root-reconciliation-proof:
    name: Prove private Docker schema readback
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: verify-and-build
    uses: ./.github/workflows/aurion-root-reconciliation-artifact-proof.yml
    with:
      use_uploaded_artifact: true

  root-schema-apply-proof:
    name: Prove backup, recovery and bounded schema apply
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: verify-and-build
    uses: ./.github/workflows/aurion-root-schema-apply-artifact-proof.yml
    with:
      use_uploaded_artifact: true

  promote-zone-runtime:
    name: Promote verified Aurion Traefik runtime
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [verify-and-build, root-reconciliation-proof, root-schema-apply-proof]
    runs-on: [self-hosted, Linux, X64, aurion-static]
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}
      EXPECTED_SHA: ${{ github.sha }}

    steps:
      - name: Guard repository scope
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "${{ github.repository }}"
          test "${GITHUB_REF_NAME}" = "main"
          test "${GITHUB_SHA}" = "${EXPECTED_SHA}"

      - name: Check out exact production source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Reset workflow-owned artifact directories
        run: rm -rf runtime-artifact runtime-bootstrap-artifact

      - name: Download verified runtime artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aurion-zone-runtime-${{ github.sha }}
          path: runtime-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Download one-time promoter bootstrap artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aurion-zone-runtime-bootstrap-${{ github.sha }}
          path: runtime-bootstrap-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Record legacy promoter compatibility (read-only)
        run: |
          set -euo pipefail
          artifact="${GITHUB_WORKSPACE}/runtime-artifact"
          installed=/usr/local/sbin/promote-aurion-zone-runtime
          if ! sudo cmp -s "${artifact}/deploy/promote-aurion-zone-runtime.sh" "$installed"; then
            printf 'legacy promoter sha256: '
            sudo sha256sum "$installed"
            sudo grep -nE 'pinned_image|image_digest|RepoDigests|docker image inspect|A-Za-z0-9|exit [0-9]+' "$installed" || true
          fi

      - name: Bootstrap and promote labelled Traefik container
        run: |
          set -euo pipefail
          artifact="${GITHUB_WORKSPACE}/runtime-artifact"
          bootstrap_artifact="${GITHUB_WORKSPACE}/runtime-bootstrap-artifact"
          test -f "${bootstrap_artifact}/aurion-traefik-runtime-release.tgz"
          test -f "${bootstrap_artifact}/dist-production-reconcile/manifest.json"
          test -f "${bootstrap_artifact}/bootstrap-identity.json"
          test -f "${bootstrap_artifact}/bootstrap-identity.json.sha256"
          (cd "${bootstrap_artifact}" && sha256sum --strict -c bootstrap-identity.json.sha256)
          bootstrap_expected_sha="$(node --input-type=module -e '
            import fs from "node:fs";
            const [file, expected]=process.argv.slice(1);
            const identity=JSON.parse(fs.readFileSync(file,"utf8"));
            if(identity.schemaVersion!==1||identity.recordType!=="aurion_legacy_promoter_bootstrap_identity"||identity.sourceRevision!==expected||!/^([a-f0-9]{40})$/.test(identity.bootstrapRevision)||identity.bootstrapRevision===expected||identity.mode!=="bootstrap_only") process.exit(2);
            process.stdout.write(identity.bootstrapRevision);
          ' "${bootstrap_artifact}/bootstrap-identity.json" "${EXPECTED_SHA}")"

          installed=/usr/local/sbin/promote-aurion-zone-runtime
          legacy_promoter_sha256=4e0a5f6d8829397923a37edaf36d52b0c0fc479e0e9b7e55e5c44f8366de69ad
          promoter_needs_readback_replay=0
          if ! sudo cmp -s "${artifact}/deploy/promote-aurion-zone-runtime.sh" "$installed"; then
            installed_promoter_sha256="$(sudo sha256sum "$installed" | awk '{print $1}')"
            if [[ "$installed_promoter_sha256" == "$legacy_promoter_sha256" ]]; then
              bootstrap_release_id="${bootstrap_expected_sha}-0"
              set +e
              sudo /usr/local/sbin/promote-aurion-zone-runtime "${bootstrap_artifact}" "${bootstrap_expected_sha}" "${bootstrap_release_id}"
              bootstrap_status=$?
              set -e
              printf 'legacy promoter bootstrap status=%s\n' "$bootstrap_status"
              sudo test -x "$installed"
              sudo cmp -s "${artifact}/deploy/promote-aurion-zone-runtime.sh" "$installed"
            elif sudo grep -Fqx '# aurion-traefik-promoter-protocol: 2' "$installed" || { sudo grep -Fq 'runtime_base=/opt/aurion-traefik-runtime' "$installed" && sudo grep -Fq 'image_id="$(docker image inspect' "$installed"; }; then
              printf 'compatible promoter %s will receive the canonical artifact directly\n' "$installed_promoter_sha256"
            else
              printf 'refusing to invoke an unrecognized promoter: %s\n' "$installed_promoter_sha256" >&2
              exit 70
            fi
          fi
          sudo /usr/local/sbin/promote-aurion-zone-runtime "${artifact}" "${EXPECTED_SHA}" "${RELEASE_ID}"

          if [[ "$promoter_needs_readback_replay" -eq 1 ]]; then
            printf 'promoter readback replay required for revision=%s\n' "${EXPECTED_SHA}"
          fi

          bash "$artifact/dist-production-reconcile/deploy/verify-aurion-installed-schema-tool" "$artifact/dist-production-reconcile/deploy/aurion-production-schema-reconcile" /usr/local/sbin/aurion-production-schema-reconcile
          sudo -n test -f /opt/echoes-of-aurion-schema-reconcile/current/manifest.json
          sudo -n grep -Fq "${EXPECTED_SHA}" /opt/echoes-of-aurion-schema-reconcile/current/manifest.json
          bash "$artifact/dist-production-apply/deploy/verify-aurion-installed-schema-tool" "$artifact/dist-production-apply/deploy/aurion-production-schema-apply" /usr/local/sbin/aurion-production-schema-apply
          sudo -n test -f /opt/echoes-of-aurion-schema-apply/current/manifest.json
          sudo -n grep -Fq "${EXPECTED_SHA}" /opt/echoes-of-aurion-schema-apply/current/manifest.json

      - name: Read back installed container and schema identities
        run: |
          set -euo pipefail
          artifact="${GITHUB_WORKSPACE}/runtime-artifact/dist-production-reconcile"
          apply_artifact="${GITHUB_WORKSPACE}/runtime-artifact/dist-production-apply"
          runtime_archive="${GITHUB_WORKSPACE}/runtime-artifact/aurion-traefik-runtime-release.tgz"
          readback=/var/lib/aurion-traefik-runtime-readback/current.json
          runner=/usr/local/sbin/aurion-production-schema-reconcile
          verifier=/usr/local/lib/echoes-of-aurion/verify-aurion-production-schema-reconcile-artifact.mjs
          apply_runner=/usr/local/sbin/aurion-production-schema-apply
          apply_verifier=/usr/local/lib/echoes-of-aurion/verify-aurion-production-schema-apply-artifact.mjs
          test -f "$readback"
          runtime_manifest_sha256="$(tar -xOzf "$runtime_archive" ./manifest.json | sha256sum | awk '{print $1}')"
          schema_manifest_sha256="$(sha256sum "$artifact/manifest.json" | awk '{print $1}')"
          node --input-type=module -e '
            import fs from "node:fs";
            const [file, expected, releaseId, runtimeManifest, schemaManifest]=process.argv.slice(1);
            const receipt=JSON.parse(fs.readFileSync(file,"utf8"));
            if(receipt.recordType!=="aurion_traefik_runtime_readback"||receipt.revision!==expected||receipt.releaseId!==releaseId||!/^sha256:[a-f0-9]{64}$/.test(receipt.imageId)||!/^[a-f0-9]{64}$/.test(receipt.containerId)||receipt.domain!=="arelogic.space"||receipt.traefikNetwork!=="areloria_arelorian-network"||receipt.databaseNetwork!=="echoes-of-aurion-internal"||receipt.databaseConnectivity!=="authenticated_select_1"||receipt.runtimeManifestSha256!==runtimeManifest||receipt.schemaManifestSha256!==schemaManifest||receipt.schemaMode!=="read_only") throw new Error("Traefik runtime readback mismatch");
            console.log(JSON.stringify({revision:receipt.revision,releaseId:receipt.releaseId,imageId:receipt.imageId,containerId:receipt.containerId,domain:receipt.domain,traefikNetwork:receipt.traefikNetwork,databaseNetwork:receipt.databaseNetwork,databaseConnectivity:receipt.databaseConnectivity}));
          ' "$readback" "$EXPECTED_SHA" "$RELEASE_ID" "$runtime_manifest_sha256" "$schema_manifest_sha256"
          (cd "$artifact" && sha256sum --strict -c checksums.sha256)
          node "${artifact}/deploy/verify-aurion-production-schema-reconcile-artifact.mjs" "$artifact" "$EXPECTED_SHA"
          (cd "$apply_artifact" && sha256sum --strict -c checksums.sha256)
          node "${apply_artifact}/deploy/verify-aurion-production-schema-apply-artifact.mjs" "$apply_artifact" "$EXPECTED_SHA"
          bash "$artifact/deploy/verify-aurion-installed-schema-tool" "$artifact/deploy/aurion-production-schema-reconcile" "$runner"
          bash "$artifact/deploy/verify-aurion-installed-schema-tool" "$artifact/deploy/verify-aurion-production-schema-reconcile-artifact.mjs" "$verifier"
          bash "$artifact/deploy/verify-aurion-installed-schema-tool" "$apply_artifact/deploy/aurion-production-schema-apply" "$apply_runner"
          bash "$artifact/deploy/verify-aurion-installed-schema-tool" "$apply_artifact/deploy/verify-aurion-production-schema-apply-artifact.mjs" "$apply_verifier"
      - name: Prepare fully bound runtime release identity
        shell: bash
        run: |
          set -euo pipefail
          artifact="${GITHUB_WORKSPACE}/runtime-artifact"
          readback=/var/lib/aurion-traefik-runtime-readback/current.json
          test -f "${readback}"
          test -f "${artifact}/aurion-release-artifact-predicate.json"
          test -f "${artifact}/aurion-release-artifact-attestation.json"
          cp "${readback}" aurion-installed-runtime-readback.json
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import fs from "node:fs";
          import { buildRuntimeReleaseIdentity, scanReleaseMetadataForSecrets } from "./scripts/aurion-release-attestation.mjs";
          const sha256=file=>`sha256:${createHash("sha256").update(fs.readFileSync(file)).digest("hex")}`;
          const artifact=process.env.GITHUB_WORKSPACE+"/runtime-artifact";
          const predicate=JSON.parse(fs.readFileSync(artifact+"/aurion-release-artifact-predicate.json","utf8"));
          const attestation=JSON.parse(fs.readFileSync(artifact+"/aurion-release-artifact-attestation.json","utf8"));
          const readback=JSON.parse(fs.readFileSync("aurion-installed-runtime-readback.json","utf8"));
          const archiveDigest=sha256(artifact+"/aurion-traefik-runtime-release.tgz");
          if(predicate.sourceRevision!==process.env.EXPECTED_SHA||predicate.releaseArchiveDigest!==archiveDigest) throw new Error("ARTIFACT_ATTESTATION_BINDING_MISMATCH");
          if(attestation.sourceRevision!==process.env.EXPECTED_SHA||attestation.releaseArchiveDigest!==archiveDigest||attestation.verified!==true||attestation.tamperRejected!==true) throw new Error("ARTIFACT_ATTESTATION_NOT_VERIFIED");
          if(readback.revision!==process.env.EXPECTED_SHA||readback.releaseId!==process.env.RELEASE_ID||readback.databaseConnectivity!=="authenticated_select_1") throw new Error("PROMOTION_READBACK_IDENTITY_MISMATCH");
          const identity=buildRuntimeReleaseIdentity({
            sourceRevision:process.env.EXPECTED_SHA,
            mergeSha:process.env.EXPECTED_SHA,
            releaseId:process.env.RELEASE_ID,
            buildInputDigest:predicate.buildInputDigest,
            artifactDigest:predicate.artifactDigest,
            runtimeImageDigest:readback.imageId,
            releaseArchiveDigest:archiveDigest,
            containerId:readback.containerId,
            artifactAttestationId:attestation.attestationId,
            artifactAttestationUrl:attestation.attestationUrl,
          });
          scanReleaseMetadataForSecrets(identity);
          fs.writeFileSync("aurion-runtime-release-identity.json",JSON.stringify(identity,null,2)+"\n");
          NODE

      - name: Attest inspected production runtime identity
        id: attest-runtime-identity
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: aurion-runtime-release-identity.json
          predicate-type: https://arelogic.space/attestations/aurion-runtime-release/v1
          predicate-path: aurion-runtime-release-identity.json

      - name: Seal runtime attestation metadata
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest-runtime-identity.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.attest-runtime-identity.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest-runtime-identity.outputs.attestation-url }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "${ATTESTATION_BUNDLE}"
          cp "${ATTESTATION_BUNDLE}" aurion-runtime-release-attestation.sigstore.json
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import fs from "node:fs";
          const identity=JSON.parse(fs.readFileSync("aurion-runtime-release-identity.json","utf8"));
          const bundle=fs.readFileSync("aurion-runtime-release-attestation.sigstore.json");
          const metadata={
            schemaVersion:"aurion.runtime-release-attestation-metadata.v1",
            sourceRevision:identity.sourceRevision,
            runtimeImageDigest:identity.runtimeImageDigest,
            attestationId:process.env.ATTESTATION_ID,
            attestationUrl:process.env.ATTESTATION_URL,
            bundleSha256:`sha256:${createHash("sha256").update(bundle).digest("hex")}`,
          };
          if(!/^[1-9][0-9]*$/.test(metadata.attestationId??"")||!/^https:\/\/github\.com\//.test(metadata.attestationUrl??"")) throw new Error("RUNTIME_ATTESTATION_IDENTITY_INVALID");
          fs.writeFileSync("aurion-runtime-release-attestation.json",JSON.stringify(metadata,null,2)+"\n");
          NODE

      - name: Publish detached production runtime attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aurion-runtime-attestation-${{ github.sha }}
          path: |
            aurion-runtime-release-identity.json
            aurion-runtime-release-attestation.sigstore.json
            aurion-runtime-release-attestation.json
            aurion-installed-runtime-readback.json
          if-no-files-found: error
          retention-days: 30

      - name: Independently verify public Traefik runtime health
        run: |
          set -euo pipefail
          public_ready=0
          for _attempt in $(seq 1 20); do
            if health_json="$(curl --fail --silent --show-error "https://arelogic.space/healthz?revision=${EXPECTED_SHA}" 2>/dev/null)"; then
              if printf '%s' "$health_json" | node --input-type=module -e '
                let raw="";
                for await (const chunk of process.stdin) raw+=chunk;
                const health=JSON.parse(raw);
                if(health.status!=="ok"||health.service!=="echoes-of-aurion"||health.revision!==process.argv[1]) process.exit(1);
              ' "${EXPECTED_SHA}"; then
                printf '%s\n' "$health_json"
                public_ready=1
                break
              fi
            fi
            sleep 1
          done
          [[ "$public_ready" -eq 1 ]]
  verify-release-attestations:
    name: Verify detached Aurion release attestations
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [verify-and-build, promote-zone-runtime]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - name: Check out exact attested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download attested build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aurion-zone-runtime-${{ github.sha }}
          path: runtime-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Download attested production runtime identity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aurion-runtime-attestation-${{ github.sha }}
          path: runtime-attestation
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Verify signer, source, predicates and tamper rejection
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          signer="${GITHUB_REPOSITORY}/.github/workflows/deploy-aurion-zone-runtime.yml"
          artifact="runtime-artifact/aurion-traefik-runtime-release.tgz"
          identity="runtime-attestation/aurion-runtime-release-identity.json"
          verify_artifact() {
            gh attestation verify "${artifact}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${signer}" \
              --source-digest "${GITHUB_SHA}" \
              --source-ref "refs/heads/main" \
              --predicate-type "https://arelogic.space/attestations/aurion-release-artifact/v1" \
              --deny-self-hosted-runners
          }
          verify_runtime() {
            gh attestation verify "${identity}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${signer}" \
              --source-digest "${GITHUB_SHA}" \
              --source-ref "refs/heads/main" \
              --predicate-type "https://arelogic.space/attestations/aurion-runtime-release/v1"
          }
          verify_artifact
          verify_runtime

          cp "${identity}" "${identity}.untampered"
          printf '\0' >> "${identity}"
          set +e
          verify_runtime >/dev/null 2>&1
          tamper_status=$?
          set -e
          test "${tamper_status}" -ne 0
          mv "${identity}.untampered" "${identity}"
          verify_runtime
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const receipt={
            schemaVersion:"aurion.detached-attestation-verification.v1",
            sourceRevision:process.env.GITHUB_SHA,
            signerWorkflow:`${process.env.GITHUB_REPOSITORY}/.github/workflows/deploy-aurion-zone-runtime.yml`,
            sourceRef:"refs/heads/main",
            artifactPredicateType:"https://arelogic.space/attestations/aurion-release-artifact/v1",
            runtimePredicateType:"https://arelogic.space/attestations/aurion-runtime-release/v1",
            artifactVerified:true,
            runtimeVerified:true,
            runtimeTamperRejected:true,
          };
          fs.writeFileSync("aurion-detached-attestation-verification.json",JSON.stringify(receipt,null,2)+"\n");
          NODE

          node --test scripts/aurion-build-input-manifest.test.mjs scripts/aurion-release-attestation.test.mjs scripts/aurion-milestone-gate-evidence.test.mjs

      - name: Emit Blocker 2 attestation gate receipt
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { scanReleaseMetadataForSecrets } from "./scripts/aurion-release-attestation.mjs";
          const identity=JSON.parse(fs.readFileSync("runtime-attestation/aurion-runtime-release-identity.json","utf8"));
          const runtimeMeta=JSON.parse(fs.readFileSync("runtime-attestation/aurion-runtime-release-attestation.json","utf8"));
          const artifactMeta=JSON.parse(fs.readFileSync("runtime-artifact/aurion-release-artifact-attestation.json","utf8"));
          const verification=JSON.parse(fs.readFileSync("aurion-detached-attestation-verification.json","utf8"));
          scanReleaseMetadataForSecrets({identity,runtimeMeta,artifactMeta,verification});
          const expected={
            sourceRevision:process.env.GITHUB_SHA,
            artifactAttestationVerified:true,
            runtimeAttestationVerified:true,
            artifactTamperRejected:true,
            runtimeTamperRejected:true,
            signerWorkflow:`${process.env.GITHUB_REPOSITORY}/.github/workflows/deploy-aurion-zone-runtime.yml`,
          };
          const observed={
            sourceRevision:identity.sourceRevision,
            artifactAttestationVerified:artifactMeta.verified===true,
            runtimeAttestationVerified:verification.runtimeVerified===true && /^[1-9][0-9]*$/.test(runtimeMeta.attestationId??""),
            artifactTamperRejected:artifactMeta.tamperRejected===true && verification.artifactVerified===true,
            runtimeTamperRejected:verification.runtimeTamperRejected===true,
            signerWorkflow:verification.signerWorkflow,
          };
          const checks=Object.keys(expected).map(name=>({name,expected:expected[name],observed:observed[name],pass:expected[name]===observed[name]}));
          const receipt={
            schemaVersion:"aurion.milestone.gate-evidence.v1",
            gateId:"AURION-M21-B2-ATTESTATION",
            scope:"runtime",
            passCriteria:["final artifact is signed only after finalization","runtime identity binds docker-inspected immutable image digest","GitHub OIDC/Sigstore signer workflow and exact source are verified","tampered subjects fail verification","release metadata secret scan passes"],
            failCriteria:["missing detached attestation","wrong signer/source/predicate","runtime image digest missing","tampered subject verifies","secret-like metadata detected"],
            sourceRevision:identity.sourceRevision,
            workflow:".github/workflows/deploy-aurion-zone-runtime.yml",
            command:"gh attestation verify --signer-workflow ... --source-digest ... --source-ref refs/heads/main --predicate-type ...",
            testSources:["scripts/aurion-build-input-manifest.mjs","scripts/aurion-build-input-manifest.test.mjs","scripts/aurion-release-attestation.mjs","scripts/aurion-release-attestation.test.mjs",".github/workflows/deploy-aurion-zone-runtime.yml"],
            externalId:runtimeMeta.attestationUrl,
            reproducible:true,
            releaseIdentity:{
              sourceRevision:identity.sourceRevision,
              buildInputDigest:identity.buildInputDigest,
              artifactDigest:identity.artifactDigest,
              runtimeImageDigest:identity.runtimeImageDigest,
            },
            expected,
            observed,
            checks,
            status:checks.every(check=>check.pass)?"PASS":"FAIL",
          };
          fs.writeFileSync("aurion-gate-b2-attestation.json",JSON.stringify(receipt,null,2)+"\n");
          NODE
          node scripts/aurion-milestone-gate-evidence.mjs verify aurion-gate-b2-attestation.json --require-pass

      - name: Upload Blocker 2 attestation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aurion-gate-b2-attestation-${{ github.sha }}
          path: |
            aurion-gate-b2-attestation.json
            aurion-detached-attestation-verification.json
          if-no-files-found: error
          retention-days: 30

  apply-reviewed-schema-plan:
    name: Apply reviewed 0021–0049 plan through the existing OIDC workflow
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [migration-ledger, promote-zone-runtime, verify-release-attestations]
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Dispatch and wait for the exact reviewed schema plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AURION_EXPECTED_SHA: ${{ github.sha }}
          AURION_PLAN_SHA256: ${{ needs.migration-ledger.outputs.plan_sha256 }}
          AURION_LEDGER_RUN_ID: ${{ github.run_id }}
        run: node scripts/dispatch-aurion-schema-plan.mjs

  production-schema-readback:
    name: Require production schema readback receipt
    needs: [promote-zone-runtime, apply-reviewed-schema-plan]
    uses: ./.github/workflows/aurion-production-schema-readback.yml
    with:
      expected_sha: ${{ github.sha }}
      upstream_run_id: ${{ github.run_id }}