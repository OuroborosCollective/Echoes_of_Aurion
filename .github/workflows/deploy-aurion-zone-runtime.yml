name: Deploy Aurion Traefik runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-aurion-zone-runtime.yml"
      - ".github/workflows/aurion-zone-schema-bootstrap-proof.yml"
      - ".github/workflows/aurion-root-reconciliation-artifact-proof.yml"
      - ".github/workflows/aurion-root-schema-apply-artifact-proof.yml"
      - ".github/workflows/aurion-production-schema-readback.yml"
      - "deploy/promote-aurion-zone-runtime.sh"
      - "deploy/aurion-traefik-runtime.environment.template"
      - "deploy/aurion-production-schema-reconcile"
      - "deploy/aurion-production-schema-reconcile.sudoers"
      - "deploy/install-aurion-production-schema-reconcile"
      - "deploy/aurion-production-schema-apply"
      - "deploy/aurion-production-schema-apply-core"
      - "deploy/aurion-production-schema-apply.environment.template"
      - "deploy/aurion-production-schema-apply.sudoers"
      - "deploy/install-aurion-production-schema-apply"
      - "deploy/verify-aurion-production-schema-apply-artifact.mjs"
      - "deploy/aurion-reconcile-runtime-image.conf"
      - "deploy/aurion-reconcile-runtime-network.conf"
      - "deploy/verify-aurion-production-schema-reconcile-artifact.mjs"
      - "deploy/aurion-zone-runtime.service"
      - "deploy/aurion-zone-runtime.environment.template"
      - "deploy/arelogic-zone-runtime.nginx.conf"
      - "deploy/arelogic-zone-runtime-rate-limit.nginx.conf"
      - "server/zoneService.ts"
      - "server/zoneServiceRuntime.ts"
      - "server/_core/index.ts"
      - "Dockerfile"
      - "docker-compose.traefik.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/build-aurion-production-reconcile-artifact.mjs"
      - "scripts/build-aurion-production-apply-artifact.mjs"
      - "scripts/build-aurion-traefik-runtime-artifact.mjs"
      - "scripts/build-aurion-promoter-bootstrap-artifact.mjs"
      - "scripts/aurionProductionSchemaReconciliation.ts"
      - "scripts/aurionProductionReadbackErrors.ts"
      - "scripts/reconcile-aurion-production-schema.ts"
      - "scripts/apply-aurion-production-schema.ts"
      - "scripts/aurionProductionDatabaseClientConfig.ts"
      - "server/aurionProductionSchemaReconciliation.test.ts"
      - "server/aurionProductionSchemaReconcileDockerRunner.test.ts"
      - "server/aurionProductionSchemaApplyDockerRunner.test.ts"
      - "server/aurionProductionReadbackChain.test.ts"
      - "server/aurionTraefikRuntimeDeployment.test.ts"
      - "server/aurionZoneRuntimeSchemaBootstrap.test.ts"
      - "server/auth.local.test.ts"
      - "drizzle/meta/_journal.json"
      - "drizzle/0021_aurion_global_world_state.sql"
      - "drizzle/0022_aurion_world_chunk_deltas.sql"
      - "drizzle/0023_aurion_world_presence_epochs.sql"
      - "drizzle/0024_aurion_world_epoch_reactions.sql"
      - "drizzle/0025_aurion_loot_mastery_ethos.sql"
      - "drizzle/0026_aurion_faction_questline_state.sql"
      - "drizzle/0027_aurion_faction_questline_rewards.sql"
  pull_request:
    paths:
      - ".github/workflows/deploy-aurion-zone-runtime.yml"
      - "Dockerfile"
      - "docker-compose.traefik.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "patches/**"
      - "deploy/promote-aurion-zone-runtime.sh"
      - "scripts/build-aurion-traefik-runtime-artifact.mjs"
      - "server/_core/vite.ts"
      - "server/aurionTraefikRuntimeDeployment.test.ts"
  workflow_dispatch:

concurrency:
  # PR validation must never occupy the production promotion queue.
  group: deploy-aurion-zone-runtime-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  verify-and-build:
    name: Verify and build immutable Aurion Traefik runtime
    # Pull-request verification runs only for branches in this repository.
    # Root proofs and promotion remain limited to trusted pushes on main.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04

    steps:
      - name: Guard repository scope
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "OuroborosCollective/Echoes_of_Aurion"
          case "${GITHUB_EVENT_NAME}" in
            push|workflow_dispatch)
              test "${GITHUB_REF}" = "refs/heads/main"
              ;;
            pull_request)
              ;;
            *)
              echo "unsupported event: ${GITHUB_EVENT_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify exact source revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          pnpm check
          pnpm test
          bash -n deploy/promote-aurion-zone-runtime.sh
          node --check scripts/build-aurion-traefik-runtime-artifact.mjs
          node --check scripts/build-aurion-promoter-bootstrap-artifact.mjs
          bash -n deploy/aurion-production-schema-reconcile
          bash -n deploy/install-aurion-production-schema-reconcile
          bash -n deploy/aurion-production-schema-apply
          bash -n deploy/aurion-production-schema-apply-core
          bash -n deploy/install-aurion-production-schema-apply
          sudo visudo -cf deploy/aurion-production-schema-reconcile.sudoers
          sudo visudo -cf deploy/aurion-production-schema-apply.sudoers
          git diff --check

      - name: Build revision-bound Traefik runtime and compatibility bootstrap
        env:
          AURION_RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pnpm build:runtime-artifact
          node scripts/build-aurion-traefik-runtime-artifact.mjs
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const manifest=JSON.parse(fs.readFileSync("dist-traefik-runtime/manifest.json","utf8"));
          if(manifest.schemaVersion!==1||manifest.recordType!=="aurion_traefik_runtime_artifact") throw new Error("unexpected Traefik runtime artifact");
          if(manifest.revision!==process.env.GITHUB_SHA) throw new Error("Traefik runtime revision mismatch");
          for(const file of ["Dockerfile","docker-compose.traefik.yml","deploy/promote-aurion-zone-runtime.sh","deploy/aurion-traefik-runtime.environment.template","dist/.aurion-runtime-build.json","runtime-node_modules.tgz"]) if(!manifest.files?.[file]) throw new Error(`Traefik runtime artifact is missing ${file}`);
          NODE
          (cd dist-traefik-runtime && sha256sum --strict -c checksums.sha256)
          runtime_verify_image="echoes-of-aurion:verify-${GITHUB_SHA}"
          runtime_verify_container="aurion-runtime-verify-${GITHUB_RUN_ID}"
          docker build --pull=false --build-arg "AURION_RELEASE_SHA=${GITHUB_SHA}" --tag "${runtime_verify_image}" dist-traefik-runtime
          docker run --detach --name "${runtime_verify_container}" "${runtime_verify_image}" >/dev/null
          runtime_verify_cleanup() {
            docker rm --force "${runtime_verify_container}" >/dev/null 2>&1 || true
          }
          trap runtime_verify_cleanup EXIT
          runtime_verify_ready=0
          for _attempt in $(seq 1 60); do
            if [[ "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "${runtime_verify_container}")" == "healthy" ]]; then
              docker exec -e "EXPECTED_SHA=${GITHUB_SHA}" "${runtime_verify_container}" node --input-type=module -e '
                const response = await fetch("http://127.0.0.1:3000/healthz");
                const body = await response.json();
                if (!response.ok || body.status !== "ok" || body.service !== "echoes-of-aurion" || body.revision !== process.env.EXPECTED_SHA) process.exit(1);
              '
              runtime_verify_ready=1
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Status}}' "${runtime_verify_container}")" != "running" ]]; then
              break
            fi
            sleep 2
          done
          if [[ "${runtime_verify_ready}" -ne 1 ]]; then
            runtime_state="$(docker inspect --format '{{.State.Status}}' "${runtime_verify_container}")"
            runtime_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "${runtime_verify_container}")"
            runtime_category="$(docker logs --tail 200 "${runtime_verify_container}" 2>&1 | node --input-type=module -e '
              let raw = "";
              for await (const chunk of process.stdin) raw += chunk;
              let category = "unclassified";
              const missing = raw.match(/Cannot find (?:package|module) '([^']+)'/);
              const packageName = missing?.[1] ?? "";
              const safePackageName = /^(?:@[A-Za-z0-9._-]+\\/)?[A-Za-z0-9._-]+$/.test(packageName) ? packageName : "unknown";
              if (/ERR_MODULE_NOT_FOUND|Cannot find (package|module)/.test(raw)) category = `module_not_found:${safePackageName}`;
              else if (/ERR_DLOPEN_FAILED/.test(raw)) category = "native_module_load_failed";
              else if (/EACCES/.test(raw)) category = "permission_denied";
              else if (/Could not find the build directory/.test(raw)) category = "static_build_missing";
              else if (/AURION_RELEASE_SHA must be/.test(raw)) category = "release_revision_invalid";
              else if (/Server running on http/.test(raw)) category = "server_started_but_health_unhealthy";
              process.stdout.write(category);
            ')"
            printf 'aurion-runtime-container-verify failed state=%s health=%s category=%s\\n' "${runtime_state}" "${runtime_health}" "${runtime_category}" >&2
            exit 1
          fi
          trap - EXIT
          runtime_verify_cleanup
          tar -C dist-traefik-runtime -czf aurion-traefik-runtime-release.tgz .
          sha256sum aurion-traefik-runtime-release.tgz > aurion-traefik-runtime-release.tgz.sha256

          # Keep this one compatibility payload for the first invocation on the
          # existing root entrypoint. That invocation installs the Traefik
          # promoter; the second, byte-checked invocation below performs the
          # actual container promotion.
          pnpm build:zone-runtime
          node scripts/build-aurion-production-reconcile-artifact.mjs
          node scripts/build-aurion-production-apply-artifact.mjs
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const manifest=JSON.parse(fs.readFileSync("dist-production-reconcile/manifest.json","utf8"));
          if(manifest.schemaVersion!==1) throw new Error("unexpected schema artifact version");
          if(manifest.recordType!=="aurion_production_schema_reconcile_artifact") throw new Error("unexpected schema artifact type");
          if(manifest.revision!==process.env.GITHUB_SHA) throw new Error("schema artifact revision mismatch");
          if(manifest.mode!=="read_only"||manifest.moduleFormat!=="commonjs") throw new Error("schema artifact boundary mismatch");
          for(const file of [
            "deploy/aurion-production-schema-reconcile",
            "deploy/aurion-reconcile-runtime-image.conf",
            "deploy/aurion-reconcile-runtime-network.conf",
            "deploy/verify-aurion-production-schema-reconcile-artifact.mjs",
          ]) if(!manifest.files?.[file]) throw new Error(`schema artifact is missing ${file}`);
          NODE
          (cd dist-production-reconcile && sha256sum --strict -c checksums.sha256)
          node dist-production-reconcile/deploy/verify-aurion-production-schema-reconcile-artifact.mjs dist-production-reconcile "$GITHUB_SHA"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const manifest=JSON.parse(fs.readFileSync("dist-production-apply/manifest.json","utf8"));
          if(manifest.schemaVersion!==1||manifest.recordType!=="aurion_production_schema_apply_artifact") throw new Error("unexpected schema apply artifact type");
          if(manifest.revision!==process.env.GITHUB_SHA||manifest.mode!=="backup_recovery_apply"||manifest.moduleFormat!=="commonjs") throw new Error("schema apply artifact boundary mismatch");
          for(const file of [
            "bin/apply.cjs","bin/mysql-client-config.cjs","bin/reconcile.cjs","drizzle/meta/_journal.json",
            "deploy/aurion-production-schema-apply","deploy/aurion-production-schema-apply-core","deploy/install-aurion-production-schema-apply","deploy/verify-aurion-production-schema-apply-artifact.mjs",
          ]) if(!manifest.files?.[file]) throw new Error(`schema apply artifact is missing ${file}`);
          NODE
          (cd dist-production-apply && sha256sum --strict -c checksums.sha256)
          node dist-production-apply/deploy/verify-aurion-production-schema-apply-artifact.mjs dist-production-apply "$GITHUB_SHA"
          printf '{"revision":"%s","runId":"%s","artifact":"aurion-zone-runtime"}\n' \
            "${GITHUB_SHA}" "${GITHUB_RUN_ID}" > dist-zone/.aurion-zone-runtime-release.json
          tar -C dist-zone -czf aurion-zone-runtime-release.tgz .
          sha256sum aurion-zone-runtime-release.tgz > aurion-zone-runtime-release.tgz.sha256

          # Assemble the same closed file set that the self-hosted job receives,
          # then derive a one-time amd64 image-contract variant. That variant is
          # used only when the host still has the pre-Traefik promoter and lets
          # it install the canonical promoter before the real promotion begins.
          mkdir -p runtime-artifact/deploy
          cp -a \
            aurion-zone-runtime-release.tgz \
            aurion-zone-runtime-release.tgz.sha256 \
            aurion-traefik-runtime-release.tgz \
            aurion-traefik-runtime-release.tgz.sha256 \
            runtime-artifact/
          cp -a \
            deploy/aurion-zone-runtime.service \
            deploy/aurion-zone-runtime.environment.template \
            deploy/arelogic-zone-runtime.nginx.conf \
            deploy/arelogic-zone-runtime-rate-limit.nginx.conf \
            deploy/aurion-traefik-runtime.environment.template \
            deploy/promote-aurion-zone-runtime.sh \
            runtime-artifact/deploy/
          cp -a dist-production-reconcile runtime-artifact/
          cp -a dist-production-apply runtime-artifact/
          node scripts/build-aurion-promoter-bootstrap-artifact.mjs runtime-artifact runtime-bootstrap-artifact
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const canonical=JSON.parse(fs.readFileSync("runtime-artifact/dist-production-reconcile/deploy/aurion-reconcile-runtime-image.conf","utf8"));
          const bootstrap=JSON.parse(fs.readFileSync("runtime-bootstrap-artifact/dist-production-reconcile/deploy/aurion-reconcile-runtime-image.conf","utf8"));
          const identity=JSON.parse(fs.readFileSync("runtime-bootstrap-artifact/bootstrap-identity.json","utf8"));
          if(canonical.imageDigest!=="sha256:f5a0871ab03b035c58bdb3007c3d177b001c2145c18e81817b71624dcf7d8bff") throw new Error("unexpected canonical bootstrap input");
          if(bootstrap.imageDigest!=="sha256:87608ec5109795be954baa2f5b0b6da1911423d8b44b58fecda31f81d28bfc0f") throw new Error("unexpected amd64 bootstrap image");
          if(identity.schemaVersion!==1||identity.recordType!=="aurion_legacy_promoter_bootstrap_identity"||identity.sourceRevision!==process.env.GITHUB_SHA||!/^([a-f0-9]{40})$/.test(identity.bootstrapRevision)||identity.bootstrapRevision===process.env.GITHUB_SHA||identity.mode!=="bootstrap_only") throw new Error("unexpected bootstrap identity");
          NODE
          bootstrap_runtime_entries="$(tar -tzf runtime-bootstrap-artifact/aurion-traefik-runtime-release.tgz)"
          if grep -Fq '@' <<<"$bootstrap_runtime_entries"; then
            echo "bootstrap runtime archive contains a legacy-incompatible path" >&2
            exit 1
          fi
          grep -Fxq './patches/wouter-3.7.1.patch' <<<"$bootstrap_runtime_entries"
          (cd runtime-bootstrap-artifact && sha256sum --strict -c bootstrap-identity.json.sha256)
          bootstrap_revision="$(node --input-type=module -e '
            import fs from "node:fs";
            const [file, expected]=process.argv.slice(1);
            const identity=JSON.parse(fs.readFileSync(file,"utf8"));
            if(identity.schemaVersion!==1||identity.recordType!=="aurion_legacy_promoter_bootstrap_identity"||identity.sourceRevision!==expected||!/^([a-f0-9]{40})$/.test(identity.bootstrapRevision)||identity.bootstrapRevision===expected||identity.mode!=="bootstrap_only") process.exit(2);
            process.stdout.write(identity.bootstrapRevision);
          ' runtime-bootstrap-artifact/bootstrap-identity.json "$GITHUB_SHA")"
          (cd runtime-bootstrap-artifact/dist-production-reconcile && sha256sum --strict -c checksums.sha256)
          node runtime-bootstrap-artifact/dist-production-reconcile/deploy/verify-aurion-production-schema-reconcile-artifact.mjs runtime-bootstrap-artifact/dist-production-reconcile "$bootstrap_revision"
          bootstrap_image="node:22.13.0-bookworm-slim@sha256:87608ec5109795be954baa2f5b0b6da1911423d8b44b58fecda31f81d28bfc0f"
          docker pull "$bootstrap_image"
          bootstrap_image_id="$(docker image inspect --format '{{.Id}}' "$bootstrap_image")"
          [[ "$bootstrap_image_id" =~ ^sha256:[a-f0-9]{64}$ ]]

      - name: Publish immutable runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurion-zone-runtime-${{ github.sha }}
          path: |
            aurion-zone-runtime-release.tgz
            aurion-zone-runtime-release.tgz.sha256
            aurion-traefik-runtime-release.tgz
            aurion-traefik-runtime-release.tgz.sha256
            deploy/aurion-zone-runtime.service
            deploy/aurion-zone-runtime.environment.template
            deploy/arelogic-zone-runtime.nginx.conf
            deploy/arelogic-zone-runtime-rate-limit.nginx.conf
            deploy/aurion-traefik-runtime.environment.template
            deploy/promote-aurion-zone-runtime.sh
            dist-production-reconcile
            dist-production-apply
          if-no-files-found: error
          retention-days: 30

      - name: Publish one-time promoter bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurion-zone-runtime-bootstrap-${{ github.sha }}
          path: runtime-bootstrap-artifact
          if-no-files-found: error
          retention-days: 30

  root-reconciliation-proof:
    name: Prove private Docker schema readback
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-and-build
    uses: ./.github/workflows/aurion-root-reconciliation-artifact-proof.yml
    with:
      use_uploaded_artifact: true

  root-schema-apply-proof:
    name: Prove backup, recovery and bounded schema apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-and-build
    uses: ./.github/workflows/aurion-root-schema-apply-artifact-proof.yml
    with:
      use_uploaded_artifact: true

  promote-zone-runtime:
    name: Promote verified Aurion Traefik runtime
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify-and-build, root-reconciliation-proof, root-schema-apply-proof]
    runs-on: [self-hosted, Linux, X64, aurion-static]
    environment: production
    env:
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}
      EXPECTED_SHA: ${{ github.sha }}

    steps:
      - name: Guard repository scope
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "OuroborosCollective/Echoes_of_Aurion"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_SHA}" = "${EXPECTED_SHA}"

      - name: Reset workflow-owned artifact directories
        run: rm -rf runtime-artifact runtime-bootstrap-artifact

      - name: Download verified runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: aurion-zone-runtime-${{ github.sha }}
          path: runtime-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Download one-time promoter bootstrap artifact
        uses: actions/download-artifact@v4
        with:
          name: aurion-zone-runtime-bootstrap-${{ github.sha }}
          path: runtime-bootstrap-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Record legacy promoter compatibility (read-only)
        run: |
          set -euo pipefail
          artifact="${GITHUB_WORKSPACE}/runtime-artifact"
          installed=/usr/local/sbin/promote-aurion-zone-runtime
          if ! cmp -s "${artifact}/deploy/promote-aurion-zone-runtime.sh" "$installed"; then
            printf 'legacy promoter sha256: '
            sha256sum "$installed"
            grep -nE 'pinned_image|image_digest|RepoDigests|docker image inspect|A-Za-z0-9|exit [0-9]+' "$installed" || true
          fi

      - name: Bootstrap and promote labelled Traefik container
        run: |
          set -euo pipefail
          artifact="${GITHUB_WORKSPACE}/runtime-artifact"
          bootstrap_artifact="${GITHUB_WORKSPACE}/runtime-bootstrap-artifact"
          test -f "${bootstrap_artifact}/aurion-traefik-runtime-release.tgz"
          test -f "${bootstrap_artifact}/dist-production-reconcile/manifest.json"
          test -f "${bootstrap_artifact}/bootstrap-identity.json"
          test -f "${bootstrap_artifact}/bootstrap-identity.json.sha256"
          (cd "${bootstrap_artifact}" && sha256sum --strict -c bootstrap-identity.json.sha256)
          bootstrap_expected_sha="$(node --input-type=module -e '
            import fs from "node:fs";
            const [file, expected]=process.argv.slice(1);
            const identity=JSON.parse(fs.readFileSync(file,"utf8"));
            if(identity.schemaVersion!==1||identity.recordType!=="aurion_legacy_promoter_bootstrap_identity"||identity.sourceRevision!==expected||!/^([a-f0-9]{40})$/.test(identity.bootstrapRevision)||identity.bootstrapRevision===expected||identity.mode!=="bootstrap_only") process.exit(2);
            process.stdout.write(identity.bootstrapRevision);
          ' "${bootstrap_artifact}/bootstrap-identity.json" "${EXPECTED_SHA}")"

          # A legacy fixed entrypoint cannot safely replace itself before it
          # validates a Docker image. Use the separately verified, one-time
          # amd64 bootstrap artifact only while that byte comparison differs.
          # Its distinct identity and legacy-safe path permit only the old
          # promoter's self-install; the canonical artifact is then promoted
          # with its own immutable source revision and release directory.
          installed=/usr/local/sbin/promote-aurion-zone-runtime
          legacy_promoter_sha256=4e0a5f6d8829397923a37edaf36d52b0c0fc479e0e9b7e55e5c44f8366de69ad
          promoter_needs_readback_replay=0
          if ! cmp -s "${artifact}/deploy/promote-aurion-zone-runtime.sh" "$installed"; then
            installed_promoter_sha256="$(sha256sum "$installed" | awk '{print $1}')"
            if [[ "$installed_promoter_sha256" == "$legacy_promoter_sha256" ]]; then
              bootstrap_release_id="${bootstrap_expected_sha}-0"
              set +e
              sudo /usr/local/sbin/promote-aurion-zone-runtime "${bootstrap_artifact}" "${bootstrap_expected_sha}" "${bootstrap_release_id}"
              bootstrap_status=$?
              set -e
              printf 'legacy promoter bootstrap status=%s\n' "$bootstrap_status"
              test -x "$installed"
              cmp -s "${artifact}/deploy/promote-aurion-zone-runtime.sh" "$installed"
            elif grep -Fqx '# aurion-traefik-promoter-protocol: 2' "$installed" || { grep -Fq 'runtime_base=/opt/aurion-traefik-runtime' "$installed" && grep -Fq 'image_id="$(docker image inspect' "$installed"; }; then
              printf 'compatible promoter %s will receive the canonical artifact directly\n' "$installed_promoter_sha256"
              promoter_needs_readback_replay=1
            else
              printf 'refusing to invoke an unrecognized promoter: %s\n' "$installed_promoter_sha256" >&2
              exit 70
            fi
          fi
          sudo /usr/local/sbin/promote-aurion-zone-runtime "${artifact}" "${EXPECTED_SHA}" "${RELEASE_ID}"
          if [[ "$promoter_needs_readback_replay" -eq 1 ]]; then
            # The compatible entrypoint installed this artifact during its first
            # invocation. Re-run only this exact release so the newly installed
            # promoter can publish its root-authored readback receipt.
            cmp -s "${artifact}/deploy/promote-aurion-zone-runtime.sh" "$installed"
            sudo /usr/local/sbin/promote-aurion-zone-runtime "${artifact}" "${EXPECTED_SHA}" "${RELEASE_ID}"
          fi

          test -x /usr/local/sbin/aurion-production-schema-reconcile
          test -f /opt/echoes-of-aurion-schema-reconcile/current/manifest.json
          grep -Fq "${EXPECTED_SHA}" /opt/echoes-of-aurion-schema-reconcile/current/manifest.json
          test -x /usr/local/sbin/aurion-production-schema-apply
          test -f /opt/echoes-of-aurion-schema-apply/current/manifest.json
          grep -Fq "${EXPECTED_SHA}" /opt/echoes-of-aurion-schema-apply/current/manifest.json

      - name: Read back installed container and schema identities
        run: |
          set -euo pipefail
          artifact="${GITHUB_WORKSPACE}/runtime-artifact/dist-production-reconcile"
          apply_artifact="${GITHUB_WORKSPACE}/runtime-artifact/dist-production-apply"
          runtime_archive="${GITHUB_WORKSPACE}/runtime-artifact/aurion-traefik-runtime-release.tgz"
          readback=/var/lib/aurion-traefik-runtime-readback/current.json
          runner=/usr/local/sbin/aurion-production-schema-reconcile
          verifier=/usr/local/lib/echoes-of-aurion/verify-aurion-production-schema-reconcile-artifact.mjs
          apply_runner=/usr/local/sbin/aurion-production-schema-apply
          apply_verifier=/usr/local/lib/echoes-of-aurion/verify-aurion-production-schema-apply-artifact.mjs
          test -f "$readback"
          runtime_manifest_sha256="$(tar -xOzf "$runtime_archive" ./manifest.json | sha256sum | awk '{print $1}')"
          schema_manifest_sha256="$(sha256sum "$artifact/manifest.json" | awk '{print $1}')"
          node --input-type=module -e '
            import fs from "node:fs";
            const [file, expected, releaseId, runtimeManifest, schemaManifest]=process.argv.slice(1);
            const receipt=JSON.parse(fs.readFileSync(file,"utf8"));
            if(receipt.recordType!=="aurion_traefik_runtime_readback"||receipt.revision!==expected||receipt.releaseId!==releaseId||!/^sha256:[a-f0-9]{64}$/.test(receipt.imageId)||!/^[a-f0-9]{64}$/.test(receipt.containerId)||receipt.domain!=="arelogic.space"||receipt.runtimeManifestSha256!==runtimeManifest||receipt.schemaManifestSha256!==schemaManifest||receipt.schemaMode!=="read_only") throw new Error("Traefik runtime readback mismatch");
            console.log(JSON.stringify({revision:receipt.revision,releaseId:receipt.releaseId,imageId:receipt.imageId,containerId:receipt.containerId,domain:receipt.domain}));
          ' "$readback" "$EXPECTED_SHA" "$RELEASE_ID" "$runtime_manifest_sha256" "$schema_manifest_sha256"
          (cd "$artifact" && sha256sum --strict -c checksums.sha256)
          node "${artifact}/deploy/verify-aurion-production-schema-reconcile-artifact.mjs" "$artifact" "$EXPECTED_SHA"
          (cd "$apply_artifact" && sha256sum --strict -c checksums.sha256)
          node "${apply_artifact}/deploy/verify-aurion-production-schema-apply-artifact.mjs" "$apply_artifact" "$EXPECTED_SHA"
          test -f "$runner"
          test ! -L "$runner"
          test "$(stat -c '%U:%G:%a' "$runner")" = "root:root:755"
          cmp -s "$artifact/deploy/aurion-production-schema-reconcile" "$runner"
          test -f "$verifier"
          test ! -L "$verifier"
          test "$(stat -c '%U:%G:%a' "$verifier")" = "root:root:755"
          cmp -s "$artifact/deploy/verify-aurion-production-schema-reconcile-artifact.mjs" "$verifier"
          test -f "$apply_runner"
          test ! -L "$apply_runner"
          test "$(stat -c '%U:%G:%a' "$apply_runner")" = "root:root:755"
          cmp -s "$apply_artifact/deploy/aurion-production-schema-apply" "$apply_runner"
          test -f "$apply_verifier"
          test ! -L "$apply_verifier"
          test "$(stat -c '%U:%G:%a' "$apply_verifier")" = "root:root:755"
          cmp -s "$apply_artifact/deploy/verify-aurion-production-schema-apply-artifact.mjs" "$apply_verifier"
      - name: Independently verify public Traefik runtime health
        run: |
          set -euo pipefail
          public_ready=0
          for _attempt in $(seq 1 20); do
            if health_json="$(curl --fail --silent --show-error "https://arelogic.space/healthz?revision=${EXPECTED_SHA}" 2>/dev/null)"; then
              if printf '%s' "$health_json" | node --input-type=module -e '
                let raw="";
                for await (const chunk of process.stdin) raw+=chunk;
                const health=JSON.parse(raw);
                if(health.status!=="ok"||health.service!=="echoes-of-aurion"||health.revision!==process.argv[1]) process.exit(1);
              ' "${EXPECTED_SHA}"; then
                printf '%s\n' "$health_json"
                public_ready=1
                break
              fi
            fi
            sleep 1
          done
          [[ "$public_ready" -eq 1 ]]

  production-schema-readback:
    name: Require production schema readback receipt
    needs: promote-zone-runtime
    uses: ./.github/workflows/aurion-production-schema-readback.yml
    with:
      expected_sha: ${{ github.sha }}
      upstream_run_id: ${{ github.run_id }}
