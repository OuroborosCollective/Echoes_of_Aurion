name: Temporary boolean normalization repair

on:
  pull_request:
    paths:
      - ".github/workflows/_temporary-boolean-normalization-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Apply exact reconciler regression repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("scripts/aurionProductionSchemaReconciliation.ts")
          text = p.read_text()
          old = '''function normalizeType(value: string): string {\n  return value.toLowerCase().replace(/\\s+/g, "").replace(/int\\(\\d+\\)/g, "int");\n}'''
          new = '''function normalizeType(value: string): string {\n  const normalized = value.toLowerCase().replace(/\\s+/g, "").replace(/int\\(\\d+\\)/g, "int");\n  // MariaDB BOOLEAN is a schema alias for TINYINT(1); INFORMATION_SCHEMA reports\n  // the physical type. Normalize only that exact alias and keep other integer drift visible.\n  return normalized === "boolean" ? "tinyint" : normalized;\n}'''
          if text.count(old) != 1:
              raise SystemExit("normalizeType exact source contract changed")
          p.write_text(text.replace(old, new))

          p = Path("server/aurionProductionSchemaReconciliation.test.ts")
          text = p.read_text()
          anchor = '''  it("accepts an exact observed schema including MariaDB integer display width", async () => {\n    const migration = await parse("0026_aurion_faction_questline_state");\n    const observed = new Map(migration.tables.map(table => [table.name, observedFromExpected(table)]));\n    const result = classifyMigrationContract(migration, observed);\n    expect(result.state).toBe("PRESENT_SCHEMA_MATCH");\n    expect(result.drift).toEqual([]);\n  });\n'''
          addition = anchor + '''\n  it("accepts MariaDB BOOLEAN as physical TINYINT without masking other type drift", async () => {\n    const migration = await parse("0045_aurion_deterministic_quest_compiler");\n    const expected = migration.tables.find(table => table.name === "aurionQuestTemplateVersions")!;\n    const observed = observedFromExpected(expected);\n    const mariadbObserved: ObservedTable = {\n      ...observed,\n      columns: observed.columns.map(column =>\n        ["active", "quarantined"].includes(column.name) ? { ...column, columnType: "tinyint(1)" } : column,\n      ),\n    };\n    expect(compareTableContract(expected, mariadbObserved)).toEqual([]);\n    expect(compareTableContract(expected, {\n      ...mariadbObserved,\n      columns: mariadbObserved.columns.map(column => column.name === "version" ? { ...column, columnType: "bigint(20)" } : column),\n    }).some(item => item.includes("type:version"))).toBe(true);\n  });\n'''
          if text.count(anchor) != 1:
              raise SystemExit("reconciliation test insertion anchor changed")
          p.write_text(text.replace(anchor, addition))
          PY
          git diff --check
          pnpm install --frozen-lockfile
          pnpm check
          pnpm vitest run server/aurionProductionSchemaReconciliation.test.ts
      - name: Commit exact source repair
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/aurionProductionSchemaReconciliation.ts server/aurionProductionSchemaReconciliation.test.ts
          git commit -m 'fix(migrations): normalize MariaDB boolean alias'
          git push origin "HEAD:${HEAD_BRANCH}"
