name: Aurion world authoring MariaDB safety

on:
  pull_request:
    paths:
      - ".github/workflows/aurion-world-authoring-mariadb.yml"
      - "server/aurionAuthoringPersistence.ts"
      - "server/aurionWorldAuthoringMariaDb.test.ts"
      - "server/routes/aurionAuthoringRouter.ts"
      - "server/glbImportStore.ts"
      - "server/db.ts"
      - "shared/aurionAuthoringContract.ts"
      - "drizzle/**"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-authoring-db-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  world-authoring-mariadb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: auriontest
          MARIADB_DATABASE: aurion_authoring_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -pauriontest --silent"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      DATABASE_URL: mysql://root:auriontest@127.0.0.1:3306/aurion_authoring_test
      AURION_WORLD_AUTHORING_DB_TEST: '1'
      JWT_SECRET: isolated-ci-world-authoring-secret-never-production
      VITE_APP_ID: aurion-isolated-world-authoring-test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify exact revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Migrate isolated MariaDB
        run: pnpm verify:migrations && pnpm exec drizzle-kit migrate
      - name: Run world authoring transaction and compatibility tests
        run: pnpm exec vitest run server/aurionWorldAuthoringMariaDb.test.ts server/databaseSmoke.test.ts
      - name: TypeScript check
        run: pnpm check
