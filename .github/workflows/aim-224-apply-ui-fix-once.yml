name: AIM-224 one-shot UI fix

on:
  push:
    branches:
      - fix/aim-224-open-world-mobile-close
    paths:
      - .github/workflows/aim-224-apply-ui-fix-once.yml

permissions:
  contents: write

concurrency:
  group: aim-224-one-shot-ui-fix
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify branch ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e2faafccaac6e7bd20c139d676bc737d335927ad HEAD
          test "$GITHUB_REF" = "refs/heads/fix/aim-224-open-world-mobile-close"

      - name: Apply deterministic UI-state patch
        run: python scripts/aim224_open_world_ui_patch.py

      - name: Verify diff integrity
        run: |
          set -euo pipefail
          git diff --check
          git diff -- client/src/pages/Home.tsx client/src/game/scene.ts client/src/index.css e2e/towerHome.mobile.spec.ts

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and focused regression
        run: |
          set -euo pipefail
          pnpm check
          pnpm vitest run client/src/pages/Home.openWorldState.test.ts client/src/components/TowerHomePanel.test.tsx

      - name: Commit verified fix to branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/Home.tsx client/src/game/scene.ts client/src/index.css e2e/towerHome.mobile.spec.ts
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(frontend): separate open world from legacy arena"
          git push origin HEAD:fix/aim-224-open-world-mobile-close
