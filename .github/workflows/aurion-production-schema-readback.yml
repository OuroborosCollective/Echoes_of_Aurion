name: Aurion production schema readback

on:
  workflow_run:
    workflows: ["Deploy Aurion zone runtime"]
    types: [completed]

concurrency:
  group: aurion-production-schema-readback-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  production-readback:
    name: Read production schema after verified zone promotion
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, Linux, X64, aurion-static]
    environment: production
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
      UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}

    steps:
      - name: Guard successful main deployment event
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "OuroborosCollective/Echoes_of_Aurion"
          test "${GITHUB_EVENT_NAME}" = "workflow_run"
          [[ "${EXPECTED_SHA}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${UPSTREAM_RUN_ID}" =~ ^[0-9]+$ ]]
          EXPECTED_SHA="${EXPECTED_SHA}" UPSTREAM_RUN_ID="${UPSTREAM_RUN_ID}" node -e '
            const fs=require("node:fs");
            const event=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,"utf8"));
            const run=event.workflow_run;
            if(run?.name!=="Deploy Aurion zone runtime") throw new Error("unexpected upstream workflow");
            if(run?.conclusion!=="success"||run?.head_branch!=="main") throw new Error("untrusted upstream deployment");
            if(run?.head_sha!==process.env.EXPECTED_SHA) throw new Error("upstream revision mismatch");
            if(String(run?.id)!==process.env.UPSTREAM_RUN_ID) throw new Error("upstream run mismatch");
          '

      - name: Reset workflow-owned readback files
        run: |
          set -euo pipefail
          rm -rf deployment-artifact
          rm -f production-schema-readback.json production-schema-readback.raw.json production-schema-readback.stderr

      - name: Download exact successful deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: aurion-zone-runtime-${{ github.event.workflow_run.head_sha }}
          path: deployment-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify artifact and installed runner identities
        run: |
          set -euo pipefail
          artifact="${GITHUB_WORKSPACE}/deployment-artifact/dist-production-reconcile"
          installed="/opt/echoes-of-aurion-schema-reconcile/current/manifest.json"
          runner="/usr/local/sbin/aurion-production-schema-reconcile"
          test -d "$artifact"
          test -f "$artifact/manifest.json"
          test -f "$artifact/checksums.sha256"
          (cd "$artifact" && sha256sum --strict -c checksums.sha256)
          test -f "$installed"
          test -x "$runner"
          ARTIFACT_MANIFEST="$artifact/manifest.json" INSTALLED_MANIFEST="$installed" EXPECTED_SHA="$EXPECTED_SHA" node -e '
            const fs=require("node:fs");
            const artifact=JSON.parse(fs.readFileSync(process.env.ARTIFACT_MANIFEST,"utf8"));
            const installed=JSON.parse(fs.readFileSync(process.env.INSTALLED_MANIFEST,"utf8"));
            for(const [label,manifest] of [["artifact",artifact],["installed",installed]]) {
              if(manifest.schemaVersion!==1) throw new Error(`${label} schema mismatch`);
              if(manifest.recordType!=="aurion_production_schema_reconcile_artifact") throw new Error(`${label} record type mismatch`);
              if(manifest.revision!==process.env.EXPECTED_SHA) throw new Error(`${label} revision mismatch`);
              if(manifest.mode!=="read_only"||manifest.moduleFormat!=="commonjs") throw new Error(`${label} boundary mismatch`);
            }
          '

      - name: Execute bounded read-only production classification
        id: readback
        run: |
          set -euo pipefail
          runner=/usr/local/sbin/aurion-production-schema-reconcile
          raw="${GITHUB_WORKSPACE}/production-schema-readback.raw.json"
          result="${GITHUB_WORKSPACE}/production-schema-readback.json"
          stderr_file="${GITHUB_WORKSPACE}/production-schema-readback.stderr"
          rm -f "$raw" "$result" "$stderr_file"

          set +e
          sudo -n "$runner" "$EXPECTED_SHA" >"$raw" 2>"$stderr_file"
          runner_status=$?
          set -e

          if [[ -s "$raw" ]]; then
            RAW_PATH="$raw" RESULT_PATH="$result" RUNNER_STATUS="$runner_status" EXPECTED_SHA="$EXPECTED_SHA" node -e '
              const fs=require("node:fs");
              const receipt=JSON.parse(fs.readFileSync(process.env.RAW_PATH,"utf8"));
              if(receipt.schemaVersion!==1||receipt.recordType!=="aurion_production_schema_reconciliation") throw new Error("unexpected production receipt contract");
              if(receipt.sourceRevision!==process.env.EXPECTED_SHA||receipt.readOnly!==true||receipt.databaseCredentialReturned!==false) throw new Error("production receipt boundary mismatch");
              const migrations=Array.isArray(receipt.migrations)
                ? receipt.migrations.map(({tag,state})=>({tag,state}))
                : [];
              fs.writeFileSync(process.env.RESULT_PATH, JSON.stringify({
                schemaVersion: 1,
                recordType: "aurion_production_schema_readback_ci",
                sourceRevision: receipt.sourceRevision,
                readOnly: true,
                databaseCredentialReturned: false,
                state: receipt.overallState,
                runnerStatus: Number(process.env.RUNNER_STATUS),
                summary: receipt.summary ?? null,
                migrations,
                drizzleJournalTables: Array.isArray(receipt.drizzleJournal)
                  ? receipt.drizzleJournal.map(({tableName,rowCount,rowReadback})=>({tableName,rowCount:rowCount??null,rowReadback:rowReadback??null}))
                  : [],
              }, null, 2)+"\n");
            '
          else
            case "$runner_status" in
              69) state=ROOT_RELEASE_OR_ENV_REQUIRED ;;
              70) state=ROOT_RELEASE_IDENTITY_MISMATCH ;;
              77) state=ROOT_BOUNDARY_PERMISSION_INVALID ;;
              1) state=ROOT_RUNNER_NOT_AUTHORIZED ;;
              *) state=ROOT_READBACK_FAILED ;;
            esac
            RESULT_STATE="$state" RUNNER_STATUS="$runner_status" RESULT_PATH="$result" EXPECTED_SHA="$EXPECTED_SHA" node -e '
              const fs=require("node:fs");
              fs.writeFileSync(process.env.RESULT_PATH, JSON.stringify({
                schemaVersion: 1,
                recordType: "aurion_production_schema_readback_ci",
                sourceRevision: process.env.EXPECTED_SHA,
                readOnly: true,
                databaseCredentialReturned: false,
                state: process.env.RESULT_STATE,
                runnerStatus: Number(process.env.RUNNER_STATUS),
              }, null, 2)+"\n");
            '
          fi

          cat "$result"
          state="$(RESULT_PATH="$result" node -e 'const fs=require("node:fs");process.stdout.write(String(JSON.parse(fs.readFileSync(process.env.RESULT_PATH,"utf8")).state));')"
          printf 'state=%s\n' "$state" >> "$GITHUB_OUTPUT"

      - name: Upload revision-bound production receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurion-production-schema-readback-${{ github.event.workflow_run.head_sha }}
          path: |
            production-schema-readback.json
            production-schema-readback.raw.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce readable production boundary
        if: always()
        run: |
          set -euo pipefail
          state="${{ steps.readback.outputs.state }}"
          case "$state" in
            PRESENT_SCHEMA_MATCH|RECONCILIATION_REQUIRED|ABSENT_APPLY_REQUIRED)
              ;;
            PRESENT_SCHEMA_DRIFT)
              echo "production schema drift detected" >&2
              exit 3
              ;;
            *)
              echo "production schema readback unavailable: ${state:-NO_STATE}" >&2
              exit 1
              ;;
          esac
