name: Aurion production schema readback

on:
  workflow_call:
    inputs:
      expected_sha:
        description: Exact main revision promoted by the caller.
        required: true
        type: string
      upstream_run_id:
        description: Caller workflow run containing the immutable artifact.
        required: true
        type: string

concurrency:
  group: aurion-production-schema-readback-${{ inputs.expected_sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  production-readback:
    name: Read production schema after verified zone promotion
    runs-on: [self-hosted, Linux, X64, aurion-static]
    environment: production
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      UPSTREAM_RUN_ID: ${{ inputs.upstream_run_id }}

    steps:
      - name: Guard exact main deployment caller
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "OuroborosCollective/Echoes_of_Aurion"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_SHA}" = "${EXPECTED_SHA}"
          test "${GITHUB_RUN_ID}" = "${UPSTREAM_RUN_ID}"
          [[ "${EXPECTED_SHA}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${UPSTREAM_RUN_ID}" =~ ^[0-9]+$ ]]

      - name: Reset workflow-owned readback files
        run: |
          set -euo pipefail
          rm -rf deployment-artifact
          rm -f production-schema-readback.json production-schema-readback.raw.json production-schema-readback.stderr

      - name: Download exact successful deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: aurion-zone-runtime-${{ inputs.expected_sha }}
          path: deployment-artifact
          github-token: ${{ github.token }}
          run-id: ${{ inputs.upstream_run_id }}

      - name: Verify artifact and installed runner identities
        run: |
          set -euo pipefail
          artifact="${GITHUB_WORKSPACE}/deployment-artifact/dist-production-reconcile"
          installed_current="/opt/echoes-of-aurion-schema-reconcile/current"
          test -L "$installed_current"
          installed_root="$(readlink -f -- "$installed_current")"
          test "$installed_root" = "/opt/echoes-of-aurion-schema-reconcile/releases/${EXPECTED_SHA}"
          installed="${installed_root}/manifest.json"
          runner="/usr/local/sbin/aurion-production-schema-reconcile"
          verifier="/usr/local/lib/echoes-of-aurion/verify-aurion-production-schema-reconcile-artifact.mjs"
          test -d "$artifact"
          test -f "$artifact/manifest.json"
          test -f "$artifact/checksums.sha256"
          (cd "$artifact" && sha256sum --strict -c checksums.sha256)
          node "${artifact}/deploy/verify-aurion-production-schema-reconcile-artifact.mjs" "$artifact" "$EXPECTED_SHA"
          test -f "$installed"
          test -f "$installed_root/checksums.sha256"
          (cd "$installed_root" && sha256sum --strict -c checksums.sha256)
          bash "$artifact/deploy/verify-aurion-installed-schema-tool" "$artifact/deploy/verify-aurion-production-schema-reconcile-artifact.mjs" "$verifier"
          node "$artifact/deploy/verify-aurion-production-schema-reconcile-artifact.mjs" "$installed_root" "$EXPECTED_SHA"
          cmp -s "$artifact/manifest.json" "$installed_root/manifest.json"
          cmp -s "$artifact/checksums.sha256" "$installed_root/checksums.sha256"
          bash "$artifact/deploy/verify-aurion-installed-schema-tool" "$artifact/deploy/aurion-production-schema-reconcile" "$runner"
          ARTIFACT_MANIFEST="$artifact/manifest.json" INSTALLED_MANIFEST="$installed" EXPECTED_SHA="$EXPECTED_SHA" node -e '
            const fs=require("node:fs");
            const artifact=JSON.parse(fs.readFileSync(process.env.ARTIFACT_MANIFEST,"utf8"));
            const installed=JSON.parse(fs.readFileSync(process.env.INSTALLED_MANIFEST,"utf8"));
            for(const [label,manifest] of [["artifact",artifact],["installed",installed]]) {
              if(manifest.schemaVersion!==1) throw new Error(`${label} schema mismatch`);
              if(manifest.recordType!=="aurion_production_schema_reconcile_artifact") throw new Error(`${label} record type mismatch`);
              if(manifest.revision!==process.env.EXPECTED_SHA) throw new Error(`${label} revision mismatch`);
              if(manifest.nodeTarget!=="node22"||manifest.mode!=="read_only"||manifest.moduleFormat!=="commonjs") throw new Error(`${label} boundary mismatch`);
            }
          '
          ARTIFACT_ROOT="$artifact" node --input-type=module -e '
            import fs from "node:fs";
            const root=process.env.ARTIFACT_ROOT;
            const image=JSON.parse(fs.readFileSync(`${root}/deploy/aurion-reconcile-runtime-image.conf`,"utf8"));
            const network=JSON.parse(fs.readFileSync(`${root}/deploy/aurion-reconcile-runtime-network.conf`,"utf8"));
            if(image.schemaVersion!==1||image.recordType!=="aurion_reconcile_runtime_image_contract"||!/^sha256:[a-f0-9]{64}$/.test(image.imageDigest)) throw new Error("runtime image contract mismatch");
            if(network.schemaVersion!==1||network.recordType!=="aurion_reconcile_runtime_network_contract"||network.network!=="echoes-of-aurion-internal") throw new Error("runtime network contract mismatch");
            process.stdout.write(`EXPECTED_DOCKER_NETWORK=${network.network}\nEXPECTED_IMAGE_DIGEST=${image.imageDigest}\n`);
          ' >> "$GITHUB_ENV"

      - name: Execute bounded read-only production classification
        id: readback
        run: |
          set -euo pipefail
          runner=/usr/local/sbin/aurion-production-schema-reconcile
          raw="${GITHUB_WORKSPACE}/production-schema-readback.raw.json"
          result="${GITHUB_WORKSPACE}/production-schema-readback.json"
          stderr_file="${GITHUB_WORKSPACE}/production-schema-readback.stderr"
          umask 077
          rm -f "$raw" "$result" "$stderr_file"
          cleanup_transient_readback() {
            rm -f "$raw" "$stderr_file"
          }
          trap cleanup_transient_readback EXIT

          set +e
          sudo -n "$runner" "$EXPECTED_SHA" >"$raw" 2>"$stderr_file"
          runner_status=$?
          set -e

          if [[ -s "$raw" ]]; then
            # The fixed root runner persists a private root-owned receipt before
            # emitting this sanitized JSON. Do not broaden sudo merely to read
            # that private path: the immutable runner/artifact checks above and
            # its controlled stdout keep this workflow within its read-only
            # boundary.
            RAW_PATH="$raw" RESULT_PATH="$result" RUNNER_STATUS="$runner_status" EXPECTED_SHA="$EXPECTED_SHA" node -e '
              const fs=require("node:fs");
              const receipt=JSON.parse(fs.readFileSync(process.env.RAW_PATH,"utf8"));
              if(receipt.schemaVersion!==1||receipt.recordType!=="aurion_production_schema_reconciliation") throw new Error("unexpected production receipt contract");
              if(receipt.sourceRevision!==process.env.EXPECTED_SHA||receipt.readOnly!==true||receipt.databaseCredentialReturned!==false) throw new Error("production receipt boundary mismatch");
              const execution=receipt.execution;
              if(execution?.mode!=="docker"||execution.network!==process.env.EXPECTED_DOCKER_NETWORK||execution.imageDigest!==process.env.EXPECTED_IMAGE_DIGEST||execution.rootFilesystemReadOnly!==true||execution.releaseMountedReadOnly!==true||execution.environmentMountedReadOnly!==true) {
                throw new Error("Docker execution receipt mismatch");
              }
              if(!Number.isInteger(execution.containerExitStatus)||execution.containerExitStatus<0) {
                throw new Error("Docker execution status mismatch");
              }
              const knownStates=new Set([
                "PRESENT_SCHEMA_MATCH","RECONCILIATION_REQUIRED",
                "PRESENT_SCHEMA_DRIFT","UNREADABLE_FAIL_CLOSED",
              ]);
              if(!knownStates.has(receipt.overallState)) throw new Error("unknown production reconciliation state");

              const allowedStages=new Set([
                "INITIALIZE","READ_ENVIRONMENT","READ_EXPECTED_MIGRATIONS","CONNECT_DATABASE",
                "READ_SCHEMA_COLUMNS","READ_SCHEMA_INDEXES","READ_SCHEMA_CHECKS","READ_DRIZZLE_JOURNAL","CLOSE_DATABASE","EXECUTE_DOCKER",
              ]);
              const allowedClasses=new Set([
                "DATABASE_URL_MISSING","DATABASE_URL_INVALID","ENVIRONMENT_FILE_NOT_FOUND",
                "ENVIRONMENT_FILE_PERMISSION_DENIED","DATABASE_HOST_UNRESOLVABLE",
                "DATABASE_CONNECTION_REFUSED","DATABASE_CONNECTION_TIMEOUT","DATABASE_CONNECTION_LOST",
                "DATABASE_AUTH_DENIED","DATABASE_UNKNOWN","DATABASE_ACCESS_DENIED",
                "DATABASE_METADATA_ACCESS_DENIED","DATABASE_TLS_FAILURE",
                "DATABASE_QUERY_CONTRACT_FAILURE","OBSERVED_IDENTIFIER_UNSAFE",
                "RUNTIME_DEPENDENCY_MISSING","UNCLASSIFIED_READ_FAILURE","DOCKER_EXECUTION_FAILED",
                "DOCKER_RECEIPT_INVALID",
              ]);
              const unreadable=receipt.overallState==="UNREADABLE_FAIL_CLOSED";
              const failureStage=unreadable ? receipt.failureStage : null;
              const errorClass=unreadable ? receipt.errorClass : null;
              const retryable=unreadable ? receipt.retryable : null;
              if(unreadable && (!allowedStages.has(failureStage)||!allowedClasses.has(errorClass)||typeof retryable!=="boolean")) {
                throw new Error("unsafe or incomplete failure classification");
              }

              const migrations=Array.isArray(receipt.migrations)
                ? receipt.migrations.map(({tag,state})=>({tag,state}))
                : [];
              if(!unreadable) {
                const expectedTags=[
                  "0021_aurion_global_world_state",
                  "0022_aurion_world_chunk_deltas",
                  "0023_aurion_world_presence_epochs",
                  "0024_aurion_world_epoch_reactions",
                  "0025_aurion_loot_mastery_ethos",
                  "0026_aurion_faction_questline_state",
                  "0027_aurion_faction_questline_rewards",
                  "0028_aurion_world_checkpoint", "0029_aurion_guild_kingdom_authority", "0030_aurion_guild_bank_economy", "0031_aurion_profession_crafting_persistence",
                ];
                if(migrations.length!==expectedTags.length||migrations.map(m=>m.tag).sort().join(",")!==expectedTags.join(",")) throw new Error("production migration receipt is incomplete");
                const allowedMigrationStates=new Set(["PRESENT_SCHEMA_MATCH","ABSENT_APPLY_REQUIRED","PRESENT_SCHEMA_DRIFT"]);
                if(migrations.some(m=>!allowedMigrationStates.has(m.state))) throw new Error("production migration receipt has an unsafe state");
                const counts={
                  matchCount:migrations.filter(m=>m.state==="PRESENT_SCHEMA_MATCH").length,
                  absentCount:migrations.filter(m=>m.state==="ABSENT_APPLY_REQUIRED").length,
                  driftCount:migrations.filter(m=>m.state==="PRESENT_SCHEMA_DRIFT").length,
                };
                const summary=receipt.summary;
                if(!summary||summary.migrationCount!==11||summary.matchCount!==counts.matchCount||summary.absentCount!==counts.absentCount||summary.driftCount!==counts.driftCount) throw new Error("production receipt summary mismatch");
                if(receipt.overallState==="PRESENT_SCHEMA_MATCH"&&(counts.matchCount!==11||counts.absentCount!==0||counts.driftCount!==0)) throw new Error("production match receipt is inconsistent");
                if(receipt.overallState==="RECONCILIATION_REQUIRED"&&(counts.absentCount<1||counts.driftCount!==0)) throw new Error("production reconciliation receipt is inconsistent");
                if(receipt.overallState==="PRESENT_SCHEMA_DRIFT"&&counts.driftCount<1) throw new Error("production drift receipt is inconsistent");
                if(["PRESENT_SCHEMA_MATCH","RECONCILIATION_REQUIRED"].includes(receipt.overallState)&&(Number(process.env.RUNNER_STATUS)!==0||execution.containerExitStatus!==0)) throw new Error("readable production receipt has non-zero execution status");
              }
              fs.writeFileSync(process.env.RESULT_PATH, JSON.stringify({
                schemaVersion: 1,
                recordType: "aurion_production_schema_readback_ci",
                sourceRevision: receipt.sourceRevision,
                readOnly: true,
                databaseCredentialReturned: false,
                state: receipt.overallState,
                runnerStatus: Number(process.env.RUNNER_STATUS),
                failureStage,
                errorClass,
                retryable,
                execution: {
                  mode: execution.mode,
                  network: execution.network,
                  imageDigest: execution.imageDigest,
                  rootFilesystemReadOnly: execution.rootFilesystemReadOnly,
                  releaseMountedReadOnly: execution.releaseMountedReadOnly,
                  environmentMountedReadOnly: execution.environmentMountedReadOnly,
                  containerExitStatus: execution.containerExitStatus,
                },
                summary: receipt.summary ?? null,
                migrations,
                drizzleJournalTables: Array.isArray(receipt.drizzleJournal)
                  ? receipt.drizzleJournal.map(({tableName,rowCount,rowReadback})=>({tableName,rowCount:rowCount??null,rowReadback:rowReadback??null}))
                  : [],
              }, null, 2)+"\n");
            '
          else
            case "$runner_status" in
              69) state=ROOT_RELEASE_OR_ENV_REQUIRED ;;
              70) state=ROOT_RELEASE_IDENTITY_MISMATCH ;;
              77) state=ROOT_BOUNDARY_PERMISSION_INVALID ;;
              1) state=ROOT_RUNNER_NOT_AUTHORIZED ;;
              *) state=ROOT_READBACK_FAILED ;;
            esac
            RESULT_STATE="$state" RUNNER_STATUS="$runner_status" RESULT_PATH="$result" EXPECTED_SHA="$EXPECTED_SHA" node -e '
              const fs=require("node:fs");
              fs.writeFileSync(process.env.RESULT_PATH, JSON.stringify({
                schemaVersion: 1,
                recordType: "aurion_production_schema_readback_ci",
                sourceRevision: process.env.EXPECTED_SHA,
                readOnly: true,
                databaseCredentialReturned: false,
                state: process.env.RESULT_STATE,
                runnerStatus: Number(process.env.RUNNER_STATUS),
                failureStage: null,
                errorClass: null,
                retryable: null,
              }, null, 2)+"\n");
            '
          fi

          cat "$result"
          state="$(RESULT_PATH="$result" node -e 'const fs=require("node:fs");process.stdout.write(String(JSON.parse(fs.readFileSync(process.env.RESULT_PATH,"utf8")).state));')"
          printf 'state=%s\n' "$state" >> "$GITHUB_OUTPUT"

      - name: Upload revision-bound production receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurion-production-schema-readback-${{ inputs.expected_sha }}
          path: |
            production-schema-readback.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce readable production boundary
        if: always()
        run: |
          set -euo pipefail
          state="${{ steps.readback.outputs.state }}"
          case "$state" in
            PRESENT_SCHEMA_MATCH|RECONCILIATION_REQUIRED)
              ;;
            PRESENT_SCHEMA_DRIFT)
              echo "production schema drift detected" >&2
              exit 3
              ;;
            *)
              echo "production schema readback unavailable: ${state:-NO_STATE}" >&2
              exit 1
              ;;
          esac
