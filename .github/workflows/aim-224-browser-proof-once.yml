name: AIM224 Mobile Browser Proof

on:
  push:
    branches: [fix/aim-224-open-world-mobile-close]
    paths: [.github/workflows/aim-224-browser-proof-once.yml]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Configure proof browser
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("playwright.config.ts")
          text = p.read_text()
          start = text.index("    launchOptions: {")
          end = text.index("    headless: true,", start)
          p.write_text(text[:start] + "    launchOptions: { args: [\"--use-angle=swiftshader\", \"--disable-dev-shm-usage\"] },\n" + text[end:])
          PY
      - name: Run mobile UI proof
        run: |
          set -euo pipefail
          pnpm exec vite --host 127.0.0.1 --port 3000 >/tmp/aurion-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              pnpm exec playwright test e2e/towerHome.mobile.spec.ts
              exit $?
            fi
            sleep 1
          done
          cat /tmp/aurion-vite.log
          exit 1
