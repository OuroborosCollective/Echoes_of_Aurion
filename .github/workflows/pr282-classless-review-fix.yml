name: One-shot PR282 classless review reconciliation

on:
  push:
    branches:
      - fix/aim-227-classless-progression-local-pack

permissions:
  contents: write

concurrency:
  group: pr282-classless-review-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Apply exact asserted review replacements
        run: node scripts/.pr282-classless-review-fix.mjs
      - name: Verify and commit only intended reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git status --short)"
          printf '%s\n' "$changed"
          test -n "$changed"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(classless): fail closed on legacy gameplay readbacks'
          git push origin "HEAD:${{ github.ref_name }}"
