name: Local Blender Bootstrap

on:
  push:
    branches:
      - tooling/local-blender-bootstrap-20260913
    paths:
      - .github/workflows/local-blender-bootstrap.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download official Blender 5.2.1 LTS
        run: |
          set -euo pipefail
          base=https://download.blender.org/release/Blender5.2
          curl --fail --show-error --location --retry 3 --retry-delay 2 \
            "$base/blender-5.2.1-linux-x64.tar.xz" \
            --output blender-5.2.1-linux-x64.tar.xz
          curl --fail --show-error --location --retry 3 --retry-delay 2 \
            "$base/blender-5.2.1.sha256" \
            --output blender-5.2.1.sha256
      - name: Verify official checksum and headless startup
        run: |
          set -euo pipefail
          expected=$(grep 'blender-5.2.1-linux-x64.tar.xz' blender-5.2.1.sha256 | awk '{print $1}')
          test -n "$expected"
          actual=$(sha256sum blender-5.2.1-linux-x64.tar.xz | awk '{print $1}')
          test "$actual" = "$expected"
          mkdir extracted
          tar -xJf blender-5.2.1-linux-x64.tar.xz -C extracted
          exe=$(find extracted -maxdepth 2 -type f -name blender -perm -111 -print -quit)
          test -n "$exe"
          "$exe" --background --factory-startup --version
          printf '%s  %s\n' "$actual" blender-5.2.1-linux-x64.tar.xz > verified.sha256
      - name: Upload verified portable Blender
        uses: actions/upload-artifact@v4
        with:
          name: blender-5.2.1-linux-x64-verified
          path: |
            blender-5.2.1-linux-x64.tar.xz
            verified.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
