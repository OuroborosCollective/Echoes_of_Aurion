name: Aurion WS Ingress Regression

on:
  pull_request:
    paths:
      - "server/zoneGateway.ts"
      - "server/zoneGatewayIngress.test.ts"
      - "scripts/tests/zone-gateway-ingress-probe.mjs"
      - ".github/workflows/aurion-ws-ingress-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-ws-ingress:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify real isolated WebSocket ingress regressions
        run: pnpm exec vitest run server/zoneGatewayIngress.test.ts --reporter=verbose
      - name: Neighbor protocol checks
        run: pnpm exec vitest run server/zoneGatewayPresence.test.ts --reporter=verbose
      - name: TypeScript
        run: pnpm check
