name: AIM-239 xaurion validation

on:
  push:
    branches:
      - feature/aim-239-xaurion-open-world-integration

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Resolve exact dependency closure
        run: pnpm install --no-frozen-lockfile
      - name: Persist resolved lock on branch
        shell: bash
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "build(open-world): lock Three.js dependency closure"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload resolved lock
        uses: actions/upload-artifact@v4
        with:
          name: aim239-pnpm-lock-${{ github.sha }}
          path: pnpm-lock.yaml
          if-no-files-found: error
      - name: TypeScript
        run: pnpm check
      - name: AIM-239 regression
        run: pnpm vitest run server/aurionXaurionIntegration.test.ts
      - name: Production build
        run: pnpm build
