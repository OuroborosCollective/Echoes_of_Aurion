# Echoes of Aurion — Dependabot
#
# Ziele:
# - Dependency-Updates regelmäßig erkennen
# - Sicherheitsupdates NICHT künstlich verzögern
# - zusammengehörige Stacks gemeinsam aktualisieren
# - große / riskante Updates isoliert halten
# - PR-Flut begrenzen
# - deterministische Runtime-/Regression-/Evidence-Prüfung vor Merge ermöglichen
#
# Wichtig:
# Dependabot-PR != Merge-Freigabe.
# Jeder PR muss weiterhin durch die Aurion Regression-/Runtime-/Evidence-Lanes.

version: 2

updates:
  # ---------------------------------------------------------------------------
  # Node.js / pnpm
  #
  # Repository:
  #   /package.json
  #   /pnpm-lock.yaml
  #
  # pnpm wird von Dependabot über das npm ecosystem verwaltet.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "04:10"
      timezone: "Europe/Berlin"

    # Kein Dependency-PR-Sturm.
    # Security-PRs zählen laut GitHub nicht gegen dieses Limit.
    open-pull-requests-limit: 8

    # Neue Releases nicht sofort auf die Runtime loslassen.
    # Security Updates sind vom Dependabot-Cooldown nicht betroffen.
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3

    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

    groups:
      # -----------------------------------------------------------------------
      # Three.js Runtime Stack
      #
      # Aurion koppelt Three.js, Typen und BVH eng miteinander.
      # Diese sollten bei kompatiblen Patch/Minor-Bumps gemeinsam geprüft
      # werden statt in zeitlich getrennten Runtime-Zuständen zu landen.
      #
      # ACHTUNG:
      # Three befindet sich im 0.x-Versionsraum. Auch "minor" kann dort
      # substantiell sein -> vollständige Renderer-/Collision-/Replay-Evidence.
      # -----------------------------------------------------------------------
      three-render-stack:
        patterns:
          - "three"
          - "@types/three"
          - "three-mesh-bvh"
        update-types:
          - "patch"
          - "minor"

      # React und die zugehörigen Typen nicht auseinanderlaufen lassen.
      react-stack:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "patch"
          - "minor"

      # tRPC Client/Server/React-Versionen gemeinsam halten.
      trpc-stack:
        patterns:
          - "@trpc/*"
        update-types:
          - "patch"
          - "minor"

      # Capacitor Android/Core/CLI müssen als zusammengehöriger Mobile-Stack
      # betrachtet werden.
      capacitor-stack:
        patterns:
          - "@capacitor/*"
        update-types:
          - "patch"
          - "minor"

      # Genkit-Kern und Provider gemeinsam bewegen.
      genkit-stack:
        patterns:
          - "genkit"
          - "@genkit-ai/*"
        update-types:
          - "patch"
          - "minor"

      # MCP-Pakete bilden einen gemeinsamen Contract-/Runtime-Stack.
      mcp-stack:
        patterns:
          - "@modelcontextprotocol/*"
        update-types:
          - "patch"
          - "minor"

      # ORM + Migration Tooling gemeinsam prüfen.
      drizzle-stack:
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
        update-types:
          - "patch"
          - "minor"

      # Vite / React Plugin gemeinsam testen.
      vite-stack:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
        update-types:
          - "patch"
          - "minor"

      # Tailwind Build-/Presentation-Stack.
      tailwind-stack:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwindcss-animate"
          - "tw-animate-css"
          - "tailwind-merge"
          - "postcss"
          - "autoprefixer"
        update-types:
          - "patch"
          - "minor"

      # Radix-Komponenten sind untereinander eng verwandt.
      radix-ui:
        patterns:
          - "@radix-ui/*"
        update-types:
          - "patch"
          - "minor"

      # Weniger kritische Development-Abhängigkeiten zusammenfassen.
      #
      # Die oben definierten Gruppen werden zuerst ausgewertet; dadurch
      # bleiben React/Three/Vite/etc. in ihren eigenen Gruppen.
      dev-tooling:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"


  # ---------------------------------------------------------------------------
  # Android / Gradle
  #
  # Repository:
  #   /android/build.gradle
  #   /android/app/build.gradle
  #   /android/variables.gradle
  #   /android/gradle/wrapper/gradle-wrapper.properties
  #
  # AGP / Google Services bleiben absichtlich eigenständige Updates.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "gradle"
    directory: "/android"

    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "04:25"
      timezone: "Europe/Berlin"

    open-pull-requests-limit: 4

    cooldown:
      default-days: 7

    commit-message:
      prefix: "build(android-deps)"

    groups:
      androidX:
        patterns:
          - "androidx.*"
        update-types:
          - "patch"
          - "minor"


  # ---------------------------------------------------------------------------
  # GitHub Actions
  #
  # directory "/" ist bei diesem Ecosystem korrekt:
  # Dependabot untersucht damit .github/workflows.
  #
  # Major Action Upgrades bleiben absichtlich einzelne PRs.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "04:40"
      timezone: "Europe/Berlin"

    open-pull-requests-limit: 4

    cooldown:
      default-days: 7

    commit-message:
      prefix: "ci(deps)"

    groups:
      actions-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"


  # ---------------------------------------------------------------------------
  # Production Container
  #
  # Der aktuelle Dockerfile nutzt einen expliziten Node-Tag PLUS SHA256 Digest:
  #
  #   node:22.23.2-bookworm-slim@sha256:...
  #
  # Genau diese Provenienz soll erhalten bleiben.
  # Keine Gruppierung mit npm/Actions/Gradle, weil Containeränderungen einen
  # eigenen Runtime-/Digest-/Health-Readback verdienen.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "docker"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "04:55"
      timezone: "Europe/Berlin"

    open-pull-requests-limit: 2

    cooldown:
      default-days: 7

    commit-message:
      prefix: "build(container-deps)"
