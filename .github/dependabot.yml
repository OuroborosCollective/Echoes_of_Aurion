# Echoes of Aurion — Dependabot
#
# Routine version updates are intentionally bounded.
# Security updates remain enabled independently of the version-update limits.
# Dependabot PRs are never merge authority: exact-head regression/runtime/evidence
# remains mandatory before any dependency reaches main.

version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "04:10"
      timezone: "Europe/Berlin"

    open-pull-requests-limit: 4

    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3

    # Routine Dependabot version PRs may only move patch/minor.
    # Major upgrades are explicit integration work.
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"

    # three.js is 0.x. 0.185 -> 0.186 already failed several exact-head
    # renderer/runtime lanes, so only patch-level routine updates are accepted.
    # The version-update selector does not disable Dependabot security updates.
    ignore:
      - dependency-name: "three"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "@types/three"
        update-types:
          - "version-update:semver-minor"

    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

    groups:
      three-render-stack:
        patterns:
          - "three"
          - "@types/three"
          - "three-mesh-bvh"
        update-types:
          - "patch"

      react-stack:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "patch"
          - "minor"

      trpc-stack:
        patterns:
          - "@trpc/*"
        update-types:
          - "patch"
          - "minor"

      capacitor-stack:
        patterns:
          - "@capacitor/*"
        update-types:
          - "patch"
          - "minor"

      genkit-stack:
        patterns:
          - "genkit"
          - "@genkit-ai/*"
        update-types:
          - "patch"
          - "minor"

      mcp-stack:
        patterns:
          - "@modelcontextprotocol/*"
        update-types:
          - "patch"
          - "minor"

      drizzle-stack:
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
        update-types:
          - "patch"
          - "minor"

      vite-stack:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
        update-types:
          - "patch"
          - "minor"

      tailwind-stack:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwindcss-animate"
          - "tw-animate-css"
          - "tailwind-merge"
          - "postcss"
          - "autoprefixer"
        update-types:
          - "patch"
          - "minor"

      radix-ui:
        patterns:
          - "@radix-ui/*"
        update-types:
          - "patch"
          - "minor"

      dev-tooling:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "04:25"
      timezone: "Europe/Berlin"

    open-pull-requests-limit: 2

    cooldown:
      default-days: 7

    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"

    commit-message:
      prefix: "build(android-deps)"

    groups:
      androidX:
        patterns:
          - "androidx.*"
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "04:40"
      timezone: "Europe/Berlin"

    open-pull-requests-limit: 2

    cooldown:
      default-days: 7

    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"

    commit-message:
      prefix: "ci(deps)"

    groups:
      actions-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "04:55"
      timezone: "Europe/Berlin"

    open-pull-requests-limit: 1

    cooldown:
      default-days: 7

    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"

    commit-message:
      prefix: "build(container-deps)"
