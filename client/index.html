<!doctype html>
<html lang="de">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#061820" />
    <meta name="description" content="Echoes of Aurion — ein sichtbares Koop-Abenteuer mit deinem LLM-Partner." />
    <meta name="keywords" content="LLM Koop-Spiel, 3D Action-Abenteuer, Browsergame, MCP LLM Partner, Mobile Fantasy-Spiel" />
    <link rel="icon" type="image/png" href="/manus-storage/aurion-sigil_e1fd1a34.png" />
    <title>Echoes of Aurion – LLM Koop-Action-Abenteuer</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (() => {
        const endpoint = "%VITE_ANALYTICS_ENDPOINT%";
        const websiteId = "%VITE_ANALYTICS_WEBSITE_ID%";
        // Vite preserves unknown HTML placeholders. Never request such a literal
        // path in local development; production analytics remain opt-in.
        if (!endpoint || endpoint.startsWith("%") || !websiteId || websiteId.startsWith("%")) return;
        const analytics = document.createElement("script");
        analytics.defer = true;
        analytics.src = `${endpoint.replace(/\/$/, "")}/umami`;
        analytics.dataset.websiteId = websiteId;
        document.head.appendChild(analytics);
      })();
    </script>
  </body>

</html>
