# Include this file only inside the TLS server block for arelogic.space.
# Existing /api/ forwarding, /mcp and static-file locations remain independent.
location = /_runtime/healthz {
    proxy_pass http://127.0.0.1:3100/_runtime/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
}

location = /v1/ws {
    limit_req zone=aurion_zone_upgrade burst=5 nodelay;
    limit_conn aurion_zone_connections 8;
    proxy_pass http://127.0.0.1:3100/v1/ws;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
}
