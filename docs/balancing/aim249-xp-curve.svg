<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">AIM-249 WASD XP curve</title>
<desc id="desc">Log-log plot of floor 50 times level to the power 1.4 from level 1 through 10000.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="450" y="25" text-anchor="middle" font-family="sans-serif" font-size="18">XP_next(L) = floor(50 × L^(7/5))</text>
<line x1="85" y1="45" x2="85" y2="450" stroke="black"/>
<line x1="85" y1="450" x2="865" y2="450" stroke="black"/>
<line x1="85.0" y1="450" x2="85.0" y2="456" stroke="black"/>
<text x="85.0" y="475" text-anchor="middle" font-family="sans-serif" font-size="12">10^0</text>
<line x1="280.0" y1="450" x2="280.0" y2="456" stroke="black"/>
<text x="280.0" y="475" text-anchor="middle" font-family="sans-serif" font-size="12">10^1</text>
<line x1="475.0" y1="450" x2="475.0" y2="456" stroke="black"/>
<text x="475.0" y="475" text-anchor="middle" font-family="sans-serif" font-size="12">10^2</text>
<line x1="670.0" y1="450" x2="670.0" y2="456" stroke="black"/>
<text x="670.0" y="475" text-anchor="middle" font-family="sans-serif" font-size="12">10^3</text>
<line x1="865.0" y1="450" x2="865.0" y2="456" stroke="black"/>
<text x="865.0" y="475" text-anchor="middle" font-family="sans-serif" font-size="12">10^4</text>
<line x1="79" y1="422.5" x2="85" y2="422.5" stroke="black"/>
<text x="75" y="426.5" text-anchor="end" font-family="sans-serif" font-size="12">10^2</text>
<line x1="79" y1="353.9" x2="85" y2="353.9" stroke="black"/>
<text x="75" y="357.9" text-anchor="end" font-family="sans-serif" font-size="12">10^3</text>
<line x1="79" y1="285.3" x2="85" y2="285.3" stroke="black"/>
<text x="75" y="289.3" text-anchor="end" font-family="sans-serif" font-size="12">10^4</text>
<line x1="79" y1="216.7" x2="85" y2="216.7" stroke="black"/>
<text x="75" y="220.7" text-anchor="end" font-family="sans-serif" font-size="12">10^5</text>
<line x1="79" y1="148.1" x2="85" y2="148.1" stroke="black"/>
<text x="75" y="152.1" text-anchor="end" font-family="sans-serif" font-size="12">10^6</text>
<line x1="79" y1="79.5" x2="85" y2="79.5" stroke="black"/>
<text x="75" y="83.5" text-anchor="end" font-family="sans-serif" font-size="12">10^7</text>
<polyline points="85.0,443.2 143.7,414.3 178.0,397.2 221.3,375.1 280.0,346.8 338.7,318.3 416.3,279.4 475.0,251.1 533.7,222.7 611.3,184.0 670.0,155.7 728.7,127.5 806.3,88.8 865.0,60.7" fill="none" stroke="black" stroke-width="2.5"/>
<text x="475" y="502" text-anchor="middle" font-family="sans-serif" font-size="14">Mastery level (log scale)</text>
<text x="18" y="247.5" text-anchor="middle" transform="rotate(-90 18 247.5)" font-family="sans-serif" font-size="14">XP for next level (log scale)</text>
<text x="865" y="502" text-anchor="end" font-family="sans-serif" font-size="11">candidate_local_exact_replay_complete</text>
