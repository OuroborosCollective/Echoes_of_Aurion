server {
    listen 80;
    listen [::]:80;
    server_name arelogic.space;

    location /.well-known/acme-challenge/ {
        root /var/www/echoes-of-aurion/current;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arelogic.space;

    root /var/www/echoes-of-aurion/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/echoes-of-aurion-arelogic/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/echoes-of-aurion-arelogic/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Aurion API only. Browser requests remain same-origin under arelogic.space;
    # the upstream is the existing project-bound Aurion server, not a new VPS service.
    location ^~ /api/ {
        proxy_pass https://aurion3d-6hpapr2g.manus.space;
        proxy_http_version 1.1;
        proxy_set_header Host aurion3d-6hpapr2g.manus.space;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name aurion3d-6hpapr2g.manus.space;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Existing route preserved exactly; it is not managed by the local account flow.
    location = /mcp {
        proxy_pass http://127.0.0.1:8090/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~* \.mp4$ {
        default_type video/mp4;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
