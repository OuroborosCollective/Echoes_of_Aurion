server {
    listen 80;
    listen [::]:80;
    server_name arelogic.space;

    location /.well-known/acme-challenge/ {
        root /var/www/echoes-of-aurion/current;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arelogic.space;

    root /var/www/echoes-of-aurion/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/echoes-of-aurion-arelogic/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/echoes-of-aurion-arelogic/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
