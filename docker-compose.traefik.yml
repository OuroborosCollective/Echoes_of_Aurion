services:
  aurion:
    image: echoes-of-aurion:${AURION_IMAGE_TAG:?AURION_IMAGE_TAG must identify a verified runtime image}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      STRICT_PORT: "true"
      TRUST_PROXY_HOPS: "1"
      AURION_GLB_STORAGE_DIR: /var/lib/aurion/glb
    env_file:
      - ${AURION_ENV_FILE:?AURION_ENV_FILE must point to the root-managed production environment}
    expose:
      - "3000"
    volumes:
      - aurion-glb-assets:/var/lib/aurion/glb
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-areloria_arelorian-network}
      - traefik.http.routers.aurion.rule=Host(`${AURION_DOMAIN:-arelogic.space}`)
      - traefik.http.routers.aurion.priority=1000
      - traefik.http.routers.aurion.entrypoints=websecure
      - traefik.http.routers.aurion.tls=true
      - traefik.http.routers.aurion.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.aurion.loadbalancer.server.port=3000
      - traefik.http.services.aurion.loadbalancer.healthcheck.path=/healthz
      - traefik.http.services.aurion.loadbalancer.healthcheck.interval=10s
      - org.opencontainers.image.revision=${AURION_RELEASE_SHA:?AURION_RELEASE_SHA must match the verified image revision}
    networks:
      - traefik-proxy
      - database-private

volumes:
  aurion-glb-assets:
    name: echoes-of-aurion-glb-assets

networks:
  traefik-proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-areloria_arelorian-network}
  database-private:
    external: true
    name: ${AURION_DATABASE_NETWORK:-echoes-of-aurion-internal}
